<text x="20" y="34" fill="#e8e8e8" font-size="19" font-weight="700">Smaller is easy. Smaller without paying for it is not.</text>
<text x="20" y="60" fill="#9a9a9a" font-size="13">Every design submission. Left: the ones with a comparable number, on all three axes at once — each cell is the ratio to that task&#39;s reference, under 1.00x is better.</text>
<text x="20" y="80" fill="#9a9a9a" font-size="13">Clock is the period the design needs against the period the reference needs. Right: the ones that never reached a number.</text>
<text x="20" y="110" fill="#e8e8e8" font-size="15" font-weight="700">3 of 16 beat the reference on all three. 13 buy one axis with another. 14 of 30 produce no comparable number at all.</text>
<rect x="20" y="128" width="12" height="12" rx="2" fill="#5b8dfb"/>
<text x="37" y="138" fill="#9a9a9a" font-size="12">better than the reference</text>
