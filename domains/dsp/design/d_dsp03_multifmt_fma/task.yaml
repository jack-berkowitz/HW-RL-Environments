negative_controls:
  - name: nc_a_stuck_output
    kind: synthetic known-bad
    result: 0/2
    failure_reason: "vec 0/1, FP32 scalar: result 0 against a non-zero expected value"
    build_note: >
      WRONG RESET POLARITY WAS TRIED FIRST AND PASSED AT BOTH WIDTHS. That is
      not a hole in the checker: the reference binds NumPipeRegs=0 and is purely
      combinational, so it has no state for a reset to hold and inverting rst_ni
      changes nothing observable. The control was vacuous, not the checker
      blind. Recorded because that control is standard equipment here and is
      inert against every combinational DUT in this project.
  - name: nc_b_two_lanes
    kind: capability-reduced
    result: 1/2
    isolated: true
    detail: >
      Declares WIDTH and only ever computes two lanes; lanes 2 and 3 are copies
      of lanes 0 and 1. PASSES at WIDTH=32 and FAILS at WIDTH=64 on the
      four-lane FP16/BF16 vectors. Flags, every scalar case and every two-lane
      case are left correct, so the ONLY thing that can fail is the lane count
      (rule 16).
  - name: nc_c_flush_to_zero
    kind: capability-reduced
    result: 0/2
    isolated: true
    detail: >
      Flushes subnormal RESULTS to a signed zero in every format and lane;
      operands and flags untouched. A3 is the headline capability of this task
      and a capability no control isolates is a capability nobody has checked.
      Fails at both widths -- the vector set carries 158/299/271 subnormal
      results per format at WIDTH=32 and 284/358/265 at WIDTH=64.

second_source:
  file: tb/fp_multifmt_fma_alt_ref.sv
  status: PROBE_COMPLETE
  adjudication_rounds_used: 2     # of 2
  result: 2/2   # 13860/13860 vectors bit-exact, results and flags
  targeted_opposite_choices:
    L4_handshake: >
      REGISTERED. The reference is purely combinational, latency 0, in_ready_o
      high every cycle. This one is a state machine whose in_ready_o does not
      look at in_valid_i and whose out_valid_o is a flop.
    L2_latency: "3-cycle pipeline against the reference's 0. Measured 4-14 against 0."
    L3_throughput: "one operation at a time. Measured 187 ops/1000cyc against 427."
    L1_algorithm: >
      Exact integer significands with a bounded alignment window and an explicit
      sticky, against the anchor's structure. No shared code, no anchor instance.
  genuinely_different: >
    Verified rather than assumed: over the same vector set the two run in 33511
    and 40350 cycles against the reference's 14758 and 17680, at latency 4-14
    against 0, and at 187 ops/1000cyc against 427.
  round_1: >
    `sh` and `shu` -- the rounding shift amounts -- were declared `int unsigned`,
    so they wrapped whenever k < M, which is every cancellation case, and
    `mag >> sh` returned zero. A defect in the second source, not the harness.
    Adjudicated and fixed rather than debugged to green; it passed on the next
    run with nothing else changed.
  round_2: >
    A SPEC DEFECT, and the kind only a second source finds. The second source
    passed every simulation config and was then REJECTED BY THE SYNTHESIS
    FRONTEND: "unroll limit of 4000 exhausted". Its leading-one search is a
    132-iteration loop nested inside a lane loop whose bound is the runtime lane
    count, which slang cannot bound at elaboration. Verilator accepts both
    without comment.
    .
    T1 said "must elaborate under both slang and Verilator" and gave no hint
    about the one construct that most commonly breaks it here -- so a
    conformant, bit-exact design would have scored full correctness and produced
    NO PPA NUMBER AT ALL, with the cause surfacing much later as an unexplained
    mid-pipeline failure. Fixed in the spec as T5, with the constant-bound
    idiom spelled out, and the second source's loops were bounded to match.
    Re-verified afterwards: reference 2/2, all three controls unchanged,
    second source 2/2, spec lints at both widths. Nothing moved.
  what_it_bought: >
    T5 above, and one thing more that is a positive result rather than a null.
    The checker had already been wrong TWICE about handshake observation, both
    times against a zero-latency design and both times invisible to all three
    controls: it raced its own driver at the negedge, and it deadlocked on
    latched backpressure. A registered, one-at-a-time, multi-cycle design is the
    case those defects would have survived into. It retired 13860/13860 with no
    queue desync and no liveness failure, which is the first positive evidence
    that the handshake observation is right rather than merely not-yet-wrong.
  also_bought: >
    It demonstrates the task is SOLVABLE at the pinned contract, independently
    of the anchor.

harness_defects_found:
  - by: the reference, during the first scoring run
    defect: >
      Backpressure was latched for the whole duration of one issue() call, so
      out_ready_i stayed low while the driver waited on in_ready_o. L4 permits
      in_ready_o to depend on out_ready_i and the reference, at zero pipeline
      depth, does exactly that -- instant deadlock. 4200 of 6300 vectors lost,
      and it looked exactly like a candidate wedging. The stall window is now a
      level and the stalling is driven by a free-running LFSR.
  - by: the reference, immediately after
    defect: >
      The transfer monitor fired on the NEGEDGE, the same edge on which issue()
      clears in_valid_i with a blocking assignment. The two orders give
      different answers; it double-counted transfers, slid the expected-value
      queue by one, and reported 6116 mismatches against a bit-exact reference.
      Moved to the POSEDGE -- the edge the DUT itself samples, and the one no
      testbench assignment races.
  - by: building the capture rig
    defect: >
      Same class, earlier: the capture rig's driver waited for its own input
      transfer and then looked for a result, which cannot see a result presented
      in the same cycle the operation was accepted. Both rigs now observe both
      sides with one monitor at the transfer edge.
  - by: running the second source through the real gated path
    defect: >
      ref/sim_flags_verilator.txt put `-y` and its path on ONE line. The loader
      appends one array element PER LINE, so the pair arrived as a single
      argument and Verilator rejected it: "Invalid option: -y /path". Every
      config reported COMPILE_ERROR. Split to one token per line, which is what
      the loader documents and what d_ca01's flag file already does. Found only
      by running scripts/sim_candidate.sh rather than verilator directly --
      building by hand had worked all along.

difficulty_assessment: >
  Not a first-try problem. Bit-exact fused multiply-add across three formats
  with different exponent/mantissa splits, subnormal operands AND results at
  full precision, five rounding modes, tininess detected after rounding,
  IEEE 754 clause 6.3 exact-zero signs, canonical NaN, NaN-boxing above the
  lanes in use, and 2- or 4-lane SIMD that scales with a declared parameter. The
  second source -- written with the finished spec in hand and no ambiguity to
  resolve -- still took an iteration, on a signed-shift declaration.

orfs:
  config: orfs/config.mk
  sdc: orfs/constraint.sdc
  synthesises_at_scored_config_by_default: >
    The shim's parameter default IS S0 -- WIDTH=64 -- so nothing in config.mk
    pins it. If the default ever drifts from `scored_configuration:` above, the
    PPA number silently stops being the scored one. Both must move together.
  closure_note: >
    config.mk names SEVEN vendored files and no more. The slice instantiates
    eight different unit types, but every one except fpnew_fma_multi sits inside
    an `OpGroup ==` generate branch that is false at ADDMUL, and slang does not
    elaborate a dead branch. That matters: fpnew_divsqrt_th_32's own
    dependencies (pa_fdsu_top, pa_fpu_dp, pa_fpu_frbus) are NOT VENDORED, so a
    frontend that elaborated dead branches could not build this design at all.
    The Verilator flow needs -y paths to refs/cvfpu/src/mxdotp and .../pace only
    because -y resolution is not branch-aware.
  synthesis_verified:
    stage: 1_synth only (place-and-route not run -- Agent 1's)
    area_um2: 150130.24
    worst_slack_ns: +3.42
    tns_ns: 0.00
    at_period_ns: 65.0
    combinational_delay_ns: 35.58
    how_the_period_was_chosen: >
      MEASURED, not guessed, and the first two guesses were wrong. 20 ns
      (reasoning from d_dsp02's 20.25) gave -23.58; 50 ns gave -5.58. Both runs
      produced the SAME NETLIST -- identical area to four decimals -- so the raw
      slacks are not two different critical paths but one, seen through two I/O
      budgets: slack = 0.6*period - logic, and both solve to logic = 35.58 ns.
      The I/O budget takes 40% of the period (20% each side), so a purely
      combinational design needs period >= 35.58/0.6 = 59.3 ns before it can
      meet timing at all. 65 ns leaves 3.42 ns for place-and-route to spend.
    why_2x_d_dsp02: >
      d_dsp02 is the same shape at 20.25 ns. The lanes here are parallel, so
      width alone does not explain the gap. The depth comes from SHARING:
      fpnew_fma_multi selects exponent and mantissa widths per format, which
      puts muxes INSIDE the alignment and normalisation paths rather than beside
      them, and the slice adds lane packing on top. Format-parametric sharing is
      what this task is about, and this is what it costs.

ppa: ABSENT
ppa_note: >
  Agent 1 owns PPA. Tier-B pins a fixed clock period rather than sweeping fmax;
  the period, the resolved-config hash and the task-text hash are Agent 1's to
  record. No find_fmax. The reference is COMBINATIONAL (NumPipeRegs=0), so it
  will not meet a tight period -- a property of the shim's spec-minimal binding,
  not of the contract, which leaves latency free under L2. The ORFS config above
  is validated through synthesis only: it builds and meets timing at its
  starting constraint, so a full run will not die on a config error, but no
  place-and-route number exists yet.

skipped_under_tier_b: [find_fmax, mutant_set, formal_EC_per_task]

scored_metrics:
  # DECLARED FROM THE EMITTED KEYS, verified against a run record -- a name no
  # checker produces renders ABSENT, which is how three of d_ca01's four were
  # found to be fictional. 26 keys are emitted here; these are the ones that
  # describe a DESIGN CHOICE rather than coverage bookkeeping.
  #
  # The spec fixes neither latency nor throughput for this unit, so both are
  # free choices that move PPA: a deeper pipeline costs area and buys frequency,
  # and at a common clock it buys nothing. An area comparison against a design
  # that chose a different latency is not like-for-like.
  - {metric: latency_min,                 label: "lat.min", role: choice}
  - {metric: latency_max,                 label: "lat.max"}  # worst case, not a choice
  - {metric: throughput_ops_per_1000cyc,  label: "ops/1k",  role: capability}

