title: multi-format FMA
id: d_dsp03
module: fp_multifmt_fma
domain: dsp
type: design
catalog: TASK_CATALOG.md
procedure: TIER-B

catalog_divergence: >
  The catalog row d_dsp03 names the task `multifmt_slice` after the anchor
  module. The contract here is narrower and is named for what it pins:
  fused multiply-add only, three formats, packed SIMD. `multifmt_slice` would
  have named the artifact rather than the contract. Also: the row rates it
  Class B; it is Class A -- cvfpu and its common_cells closure are vendored and
  elaborate clean at both WIDTH settings. I do not own TASK_CATALOG.md; both
  corrections are recorded here and reported.

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/cvfpu
  sha: 6e5267e2fe75198f91ef9304ddd56c0028eea526
  licence: SHL-0.51
  mode: vendor
  file: refs/cvfpu/src/fpnew_opgroup_multifmt_slice.sv
  closure: [fpnew_fma_multi, fpnew_classifier, fpnew_rounding, lzc, cf_math_pkg, fpnew_pkg]
  shim: ref/fp_multifmt_fma_ref.sv
  shim_note: >
    Parameter binding, rename and enum decode only. OpGroup=ADDMUL (which also
    keeps the DIVSQRT generate shut -- its default DivSqrtSel names pa_fdsu_top,
    which is NOT vendored), IntFmtConfig and the MX configs zero, PaceFeatures
    zero, NumPipeRegs=0, EnableVectors=1.
  format_mask_note: >
    FpFmtConfig is built BY INDEX and then asserted by the WIDTH it produces.
    `fmt_logic_t` is `logic [0:NUM_FP_FORMATS-1]` -- ASCENDING -- and
    NUM_FP_FORMATS is 9 in this revision, so the obvious literal
    {{(N-1){1'b0}},1'b1} selects FP4, not FP32. That is not a hypothetical: it
    is what d_dsp01 did, and the unit elaborated four bits wide, returned zero,
    and asserted done in the same cycle as the start. See F53.

anchor_conformance:
  status: VERIFIED_BEFORE_USE
  tool: tb/audit/ieee754_fma_model.py
  result: 13860 of 13860 vectors bit-exact, results AND flags, both widths
  why_this_step_exists: >
    Rule 11 keeps locally written code away from expected values, which makes a
    FABRICATED answer impossible and says nothing about whether the vendored
    anchor knows the right one. d_dsp01 satisfied rule 11 exactly and its anchor
    was correctly rounded in no mode but RTZ -- F54. An anchor is a CANDIDATE
    for the reference until its output has been checked against the standard the
    contract cites.
  model_validation: >
    The model's own rounder is checked against a property it does not compute:
    the bracketing representable pair is found by BINARY SEARCH OVER BIT
    PATTERNS and the rounder must have picked the member the mode requires.
    3000 trials x 2 signs x 5 modes at each of FP32, FP16, BF16: 0 mismatches.
  model_defect_found: >
    The model was wrong first, not the anchor. 28 vectors disagreed on UF, all
    where the exact result is tiny and inexact and gradual underflow rounds it
    to ZERO. Clause 7.5 defines tininess-after as rounding at the target
    PRECISION with an UNBOUNDED EXPONENT, not as inspecting the delivered value
    -- which is already zero, so a `val != 0` guard drops UF. The anchor was
    right. Corrected in the model and in the second source.

spec: [spec/fp_multifmt_fma_iface.sv]

scored_configuration:
  WIDTH: 64
  rationale: >
    Chosen so the capability check can DISCRIMINATE, which is the deciding
    criterion here rather than engineering merit. WIDTH is bound by RESULT BITS,
    not by a rate: lanes = WIDTH/format_width, so a vectorial 16-bit operation
    has two lanes at WIDTH=32 and four at WIDTH=64. At WIDTH=32 a design that
    hardcodes two lanes is indistinguishable from a correct one, because two is
    all that configuration ever has. At WIDTH=64 it cannot produce the upper two.
  discrimination_evidence:
    measured: true
    reference: PASS at WIDTH=32, PASS at WIDTH=64
    capability_reduced_control: PASS at WIDTH=32, FAIL at WIDTH=64
    first_failing_vector: "1080, fmt=FP16 vec=1 lanes=4"
    note: >
      The control passing at the unscored configuration is the evidence, not an
      inconvenience: it is the direct measurement that WIDTH=32 cannot tell the
      two apart and WIDTH=64 can. F49 records what shipping the other choice
      costs.

configs:   # 2; keep in step with the d_dsp03 arm in sim_candidate.sh
  - {WIDTH: 32}
  - {WIDTH: 64}   # <- scored

vectors:
  files: [vectors/vectors_w32.hex, vectors/vectors_w64.hex]
  counts: {w32: 6300, w64: 7560}
  captured_by: tb/audit/capture_vectors_tb.sv
  record_note: >
    288-bit records carry the WIDTH they were captured at, and the checker
    refuses a file whose records disagree with its own WIDTH. Scope is not
    allowed to ride on the filename.
  directed_bands: >
    Two bands the random draw does not reach in useful quantity. NEAR-
    CANCELLATION sets c to the negation of the product's leading M+1 significand
    bits, so a*b+c is the product's own tail -- the case a design that rounds
    the product before adding gets wrong wholesale. UNDERFLOW arranges exponents
    so the product lands within a few ulps of the smallest normal. Both are
    input generation, not oracle generation. They took UF coverage from 27 to
    451 at WIDTH=32 and surfaced the model's tininess defect above.

results:
  reference: 2/2   # PASS at WIDTH=32 and WIDTH=64, 14230/14230 vectors checked

