    and the second source and Python model were changed to track the pinned
    decision.
  material_to_rule_17: YES -- and more broadly than d_dsp02's
  reasoning: >
    Unlike d_dsp02, the pre-change spec here did NOT state the delivered-result
    rule anywhere. It named clause 7.5 and nothing else, so a candidate reading
    it literally would implement the unbounded-exponent rule -- which is what
    this task's own second source and Python model both did. The requirement was
    genuinely undetermined in the band, and is now determined.
    .
    The VECTOR SET also changed, which is the stronger reason. 13860/13860 was
    measured on a set that never reached the band -- zero cases in 13860. The
    post-bump set reaches it in all three formats and the checker refuses a set
    that does not. A pass on one set is not a pass on the other.
