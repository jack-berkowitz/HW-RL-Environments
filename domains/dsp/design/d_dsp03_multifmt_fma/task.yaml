  changed_on: 2026-08-21
  pre_bump_task_text_hash:  c4b5edc12f407731
  post_bump_task_text_hash: 35619b11aa94307d
  what_changed: >
    A7 split, and a new A7a pinning underflow longhand as "inexact AND the
    delivered result's biased exponent field is zero", with the IEEE-754 clause
