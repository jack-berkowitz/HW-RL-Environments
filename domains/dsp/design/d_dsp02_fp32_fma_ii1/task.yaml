ppa:
  platform: sky130hd
  binding: NumPipeRegs=3, DISTRIBUTED -- THE SCORED CONFIGURATION (S1)
  config: orfs/config.mk
  sdc: orfs/constraint.sdc
  status: MEASURED at the scored configuration
  fmax_mhz: 78.05
  fmax_period_ns: 12.8125
  fmax_converged: true
  fmax_bracket_ns: [12.5, 12.8125]     # 0.312 wide, inside the 0.5 resolution
  fmax_record: fmax_results/d_dsp02_fmax.json
  area_um2_at_own_fmax: 68303          # RECORDED, wns +0.273, DRC 0
  power_w_at_own_fmax: 0.144741        # RECORDED
  measurement_note: >
    Three registers take this from below 33 MHz to 78 MHz -- 2.4x, not the ~4x
    an even four-way split would give. cvfpu's DISTRIBUTED placement leaves the
    longest segment carrying about 12.8 ns. That is a fact about register
    placement (free under S1a), not about the choice of depth.

  first_measurement:
    period_ns: 10.0
    binding: NumPipeRegs=0 -- NO LONGER THE SCORED CONFIGURATION
    result: FAILED TIMING, wns -14.47 ns, DRC 0
    area_um2: null        # DELIBERATELY NULL. The run missed its gate, so its
                          # area (73290) is a real number and NOT a result --
                          # rule 6. Recorded as a failing point, never in a ratio.
    what_it_established: >
      The combinational cone is about 24.5 ns, so the spec-minimal binding runs
      near 40 MHz. For scale: d_ca04 reaches 380 MHz and d_nw01 190 MHz. That is
      not a defect -- it is what a full FMA looks like as one combinational cone,
      and it is the correct answer for THIS configuration.

  envelope_retired: >
    THE TWO-POINT ENVELOPE IS WITHDRAWN under rule 18. It was proposed because
    latency was free, which forced a baseline curve rather than a baseline
    point. With latency pinned at 3 there is one configuration, one Fmax sweep
    and one PPA point. The reasoning that motivated the envelope is preserved
    below because it is correct FOR A FREED AXIS -- it is simply no longer the
    situation here.

  superseded_envelope_reasoning: >
    THIS TASK NEEDS A TWO-POINT ENVELOPE, for the same reason d_nw01 does.
    The spec fixes II=1 and explicitly frees latency, so the achievable Fmax
    spans a very wide range depending only on how deeply a candidate pipelines
    -- a choice the contract deliberately does not constrain. Reporting a single
    Fmax would therefore build an arbitrary preference into every comparison:
    with NumPipeRegs=0 canonical, a pipelining candidate looks unfairly good on
    Fmax and bad on area; with a pipelined binding canonical, the reverse.

    So the baseline is the ENVELOPE {NumPipeRegs=0, cPIPE3}, and a candidate is
    reported against it rather than against a point. Comparing across the two
    requires naming the axis under rule 17 -- they are two configurations of one
    contract, not two results for one configuration.
  note: >
    FIRST LOGIC-DOMINATED DESIGN MEASURED HERE. The others are storage-dominated,
    where area barely responds to timing constraint. There is no register
    retiming available at NumPipeRegs=0, so this is the sharpest available test
    of whether area responds to constraint at all in this flow.

    Any comparison against another binding -- a pipelined one, for instance --
    must name the axis under rule 17. A pipelined FMA is a different
    configuration, not a better result for this one.

# =============================================================================
stimulus_variation:
  status: FIXED -- H3 is now exercised and gated
  tool: scripts/check_stimulus_variation.py
  measured: "8 contract inputs, 7 vary; out_ready pinned to 1"
  finding: F82
  h3_unexercisable:
    clause: "H3 -- out_valid and payload stable while out_ready is low"
    measured: "out_ready low for 0 cycles; H3 guard true 0 times, on a passing run"
    why_it_looks_covered: >
      The H3 checker EXISTS and is correctly written -- it latches the previous
      valid, result and flags and reports either a dropped out_valid or a changed
      payload. And a phase banner reading "H3 phase: backpressure on the result
      side" sits at line 367, immediately followed by `phase = "final"`. THE
      BANNER SURVIVED; THE PHASE DOES NOT. So an audit finds a clause, a check
      and a labelled phase, none of which needed the stimulus to exist.
  consequence_for_candidates: >
    PROVISIONAL ON H3, NOT INVALID. Every candidate was scored with H3
    unexercised, so no submission has been tested for result stability under
    backpressure and a design dropping out_valid when the consumer stalls would
    have scored clean. The other ten clauses are unaffected; nothing suggests
    they were mis-scored. Re-scoring is only needed if H3 matters to the result
    being claimed.
  clauses_depending_on_output_backpressure: >
    EXACTLY ONE, and it is the unexercisable one. C3 defines itself at out_ready
    high -- "with operands offered continuously and results always accepted" --
    so II=1 is unaffected. S1, H4, H1 and H2 are independent.
  fix_shape:
    scope: TESTBENCH ONLY -- LANDED. No hash bump, no re-solicitation.
    landed_result: >
      Reference PASS with h3_guard_true=60; controls/nc_h3_drops_valid.sv FAILS
      H3; and ZERO of the three existing candidates fail H3 -- chat and claude
      pass outright, gemini fails vector 0 arithmetic identically before and
      after, so that is pre-existing and not an H3 failure. The guard count is
      printed AND gated, so a run that fails to exercise H3 now fails.
    defects_the_fix_exposed: >
      The checker was broken -- its guard compared a LATCHED out_valid against a
      FRESH out_ready, so a legally accepted beat followed by a stall read as a
      withdrawal, and the REFERENCE failed H3 the first time it ran. The first
      negative control EVADED the check by gating out_valid on out_ready
      combinationally, which makes H3's antecedent unsatisfiable -- and nothing
      in the contract forbids that, since H1's ban on a combinational
      ready/valid dependency has no mirror on the output side. And the phase,
      first written after the streaming loop, exercised zero cycles.
    reason: >
      H3 already pins the required behaviour, so exercising it needs no new
      clause. task_text_hash covers spec/ and probe/PASTE.md; this is tb/.
    trap: >
      S1 pins latency at "exactly 3 clocks after the operands are accepted", and
      a held result makes that ambiguous. THE BACKPRESSURE WINDOW MUST SIT
      OUTSIDE THE LATENCY AND II MEASUREMENT or a correct design fails S1 for
      being stalled. A constraint on where the phase goes, not a reason to write
      a clause.
    unpinned_latitude_that_is_harmless: >
      Nothing says what in_ready must do while the output is stalled. A design
      may deassert immediately or buffer; both satisfy H3, both are legal, and
      neither is measured -- C3 and S1 are both defined at out_ready high. So the
      latitude is invisible on every scored surface, which is the same argument
      T2 makes elsewhere: do not score what reports an implementation choice.
  same_shape_elsewhere: >
    d_ca01's R1 response half, rsp_ready_i pinned to 1. An initial reading that
    the two tasks differed did not survive checking -- both pin the stability
    behaviour and both leave the input-side response to a stalled output
    unpinned. Both fixes are tb-only and can land as ONE boundary.

# =============================================================================
# PROPOSED, NOT LANDED. It moves task_text_hash, and the same mirror may be
# needed on other tasks -- sent for a decision rather than applied. See F86.
proposed_clause_h1b:
  problem: >
    H3 can be satisfied VACUOUSLY. A design that gates out_valid on out_ready
    never presents a result to a stalled consumer, so H3's antecedent is never
    true and there is nothing to check. Demonstrated: a control built that way
    PASSES the whole suite. H1 forbids the input-side version of exactly this
    dependency and there is no mirror on the output side.
  text: |
    H1b. `out_valid` MUST NOT depend combinationally on `out_ready`. The
         consumer may hold `out_ready` low indefinitely, and a design that
         waits for it before asserting `out_valid` deadlocks against a
         consumer that waits for `out_valid` before asserting `out_ready`.
         This is H1's rule with the roles swapped, and it is stated because
         H3 is otherwise satisfiable by never offering: a result that is
         never presented to a stalled consumer cannot be withdrawn from one.
  also_affects: >
    d_ca01 has the same hole from the other direction. Its L5 deliberately
    PERMITS req_ready_o to depend combinationally on req_valid_i, with a stated
    reason, and says nothing about rsp_valid_o and rsp_ready_i -- those two names
    appear only in R1's stability sentence and the port list. Any mirror clause
    should be decided for both tasks at once.

# ---------------------------------------------------------------------------
# CONTROL DECLARATION -- inbox/CONTROL_ENUMERATION.contract.md, revision 2.
# DECLARED, NOT GLOBBED: the directory is where they live, this is what they are.
# `measured_by` is mandatory on this side because most of these verdicts are hand
# runs, and a hand run is a measurement whose instrument was never wired -- the
# defect the contract exists to close. It is stated per control rather than per
# task so a mixed set cannot read as uniform.
# ---------------------------------------------------------------------------
controls:
  - file: controls/nc_h3_drops_valid.sv
    kind: negative
    expect: fail
    clause: H3
    exclusive: true
    measured_by: scored_path
    result: "FAIL at phase=h3 -- out_valid dropped while stalled. The CONSEQUENT violated."
  - file: controls/nc_h3_evades_antecedent.sv
    kind: suppressing
    expect: fail
    clause: H1b
    exclusive: true
    antecedent_counter: h3_guard_true
    expect_count: 0
    measured_by: scored_path
    result: >
      FAIL at phase=final -- "H3 was never exercised". The ANTECEDENT suppressed.
      Under the contract before H1b it passed the entire suite, which is what made
      it the measurement rather than a broken control.
    note: >
      THE PAIR IS THE POINT. These two differ only in where they land, and the
      landing place is the diagnostic: phase=<clause> means the consequent was
      violated and the clause has force; phase=final means the antecedent was
      suppressed. A runner that records only pass/fail loses the distinction.

# ---------------------------------------------------------------------------
# HANDSHAKE MIRROR DECISION -- taken ACROSS FOUR TASKS AT ONCE, 2026-08-25.
# Recorded identically in all four so a reader of any one sees the whole shape.
# ---------------------------------------------------------------------------
handshake_mirror_decision:
  decided_on: 2026-08-25
  the_question: >
    A stability clause of the form "once valid is asserted it stays asserted
    until the transfer completes" is satisfiable by NEVER OFFERING -- a beat or
    result never presented to a stalled consumer cannot be withdrawn from one. So
    a design may empty the antecedent instead of honouring the consequent. Does
    the contract forbid that, permit it, or say nothing?
  why_it_was_decided_together: >
    SILENCE IS THE ONE STATE THAT IS NOT A DECISION. Before this, d_dsp02 and
    d_ca01 had the gap, d_dsp03 had made the opposite decision deliberately, and
    d_nw03 was simply silent. Deciding task by task would have produced four
    positions that looked like an inconsistency; deciding once produces three
    that forbid it and one that permits it FOR A STATED REASON, which is an
    intentional asymmetry a reader can check.
  outcome:
    d_dsp02: FORBIDS -- clause H1b, landed 2026-08-25
    d_ca01:  FORBIDS -- clause R1b, landed 2026-08-25
    d_nw03:  FORBIDS -- clause R1b, landed 2026-08-25
    d_dsp03: PERMITS -- clause L4, THE DELIBERATE EXCEPTION, unchanged
  d_dsp03_is_the_exception_and_here_is_its_reason: >
    QUOTED RATHER THAN SUMMARISED, because the point is that it was decided and
    not overlooked. d_dsp03's L4 reads:
    .
      "L4. `in_ready_o` MAY DEPEND COMBINATIONALLY ON `in_valid_i`, and
           `out_valid_o` may depend combinationally on `out_ready_i`. The harness
           drives neither from the other, so a design that gates either way
           cannot deadlock against it. A fully combinational unit is conformant."
    .
    The reason is task-specific and sound: d_dsp03's reference binds
    NumPipeRegs=0 and is purely combinational, so requiring a registered valid
    would exclude the reference's own shape. The other three tasks all have
    buffering designs where the deadlock L4 rules out is reachable.
  the_consequence_d_dsp03_carries: >
    STATED SO IT IS NOT REDISCOVERED AS A DEFECT. L4 licenses the construction
    that EMPTIES d_dsp03's own output stability clause, so on that task the
    stability sentence is decorative rather than wrong -- a design gating
    out_valid_o on out_ready_i never has valid high while ready is low, and it is
    CONFORMING. Two coherent resolutions remain open and neither is taken here:
    narrow L4 to the input side, or drop the output stability sentence as
    non-normative. Doing neither leaves a clause that reads as a requirement and
    is not one.
  evidence_base: >
    Every one of the three FORBIDS clauses cites a control that PASSED the
    contract as it stood while driving the clause's firing count to zero:
    nc_h3_evades_antecedent (d_dsp02), nc_r1_evades_antecedent (d_ca01, 0/16),
    nc_r1_evades_antecedent (d_nw03, 0/8). None was declared unfalsifiable by
    reading; F86's own founding instance was, and that is recorded in F86.
  enforceability_caveat: >
    ALL THREE CLAUSES FORBID A COMBINATIONAL DEPENDENCY, which no testbench here
    can observe directly -- it sees valid low and cannot distinguish "gated on
    ready" from "nothing ready yet". The condition floor catches the construction
    but reports it as "the clause was never exercised", not as a violation of the
    mirror clause. Enforceable by inspection and by control, only partially by
    the harness. This is in each task's candidates README where a grader meets it.

compile_warning_audit:
  audited_on: 2026-08-25
  trigger: >
    AGENT-VERIF-A2 reported a combinational loop -- ready driven from valid,
    closing ready -> design -> valid -> arm -> ready -- which Verilator reported
    as UNOPTFLAT and which was INVISIBLE BY DILUTION among ~30 warnings about the
    vendored anchor under -Wno-fatal. On v_ca06 it converged and every verdict
    was right; on v_ca03 it produced 26 failures across six clause ids, none a
    design defect. The tell: four different one-hot variants gave the IDENTICAL
    26 failures, and a defect that does not change when you change what provokes
    it is a settle order, not a design defect.
  result_here: CLEAN -- zero UNOPTFLAT on every design task audited
  measured:
    - {task: d_nw03_axis_switch_oq,     warnings: 18, unoptflat: 0}
    - {task: d_nw01_axi4_xbar,          warnings: 43, unoptflat: 0}
    - {task: d_ca01_nonblocking_dcache, warnings: 17, unoptflat: 0}
    - {task: d_dsp02_fp32_fma_ii1,      warnings: 83, unoptflat: 0}
  why_it_is_clean_and_it_is_not_luck: >
    No testbench here drives a ready from a valid. Grepped all eight for an
    assignment of a *ready* from a *valid* and found none. d_ca01's testbench
    header states it as structural remedy 1 -- "NO COMBINATIONAL PATH FROM A DUT
    OUTPUT TO A DUT INPUT. Every input this harness drives comes from a register
    or a constant" -- written after two builds differing only by a debug process
    disagreed about whether the design had deadlocked. The remedy predates the
    hazard report and is why the hazard does not land.
  BUT_THE_DETECTION_IS_WORSE_HERE_THAN_DILUTION: >
    scripts/sim_candidate.sh captures the compile output in `cerr` and prints it
    ONLY WHEN THE BUILD FAILS. On a successful build it reports ZERO warnings --
    not diluted, SUPPRESSED. These counts come from building each task directly,
    because the scored path cannot answer the question at all.
    .
    So the number above is not "the runner says clean". It is "the runner cannot
    say, and a direct build says clean". A NEW UNOPTFLAT introduced tomorrow would
    be invisible on this side by total suppression rather than by dilution, which
    is strictly harder to notice than what AGENT-VERIF-A2 hit. Reported to the
    owner of scripts/; not worked around.
