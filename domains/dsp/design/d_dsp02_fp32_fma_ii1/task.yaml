title: FP32 fused multiply-add
id: d_dsp02
module: fp32_fma_ii1
domain: dsp
type: design
catalog: TASK_CATALOG.md

# CLASS A, not B. The catalog listed this as Class B, which was stale from when
# the task was planned around a locally-written Python model. What it actually
# does is rule 11's inversion: locally authored code generates INPUTS ONLY, and
# the expected values are produced by running the vendored cvfpu anchor. That is
# an external RTL oracle, so the strong claim -- "the testbench passed RTL nobody
# here wrote" -- is available and is the one being made.
oracle_class: A
reference:
  refs_lock_repo: pulp-platform/cvfpu
  licence: SHL-0.51
  mode: vendor
  file: refs/cvfpu/src/fpnew_fma.sv
  shim: ref/fp32_fma_ii1_ref.sv
  shim_note: >
    Binds NumPipeRegs=0 -- the spec-minimal configuration, purely combinational
    -- plus a 3-bit rnd_mode to fpnew_pkg::roundmode_e decode. No behaviour in
    the shim.

spec: [spec/fp32_fma_ii1_iface.sv]

# RULE 18 -- PPA, latency and throughput are measured ONLY here.
scored_configuration:
  LATENCY: 3            # NumPipeRegs=3; spec clause S1
  rationale: >
    The FMA dataflow has four natural segments -- classify-and-multiply,
    align-and-add, normalise (lzc then shift), round. Three register boundaries
    is the SHALLOWEST depth placing one boundary between each pair, so no
    segment spans two.
    Not the anchor's default: the shim bound 0, and at depth 0 the design is one
    combinational cone that MISSES TIMING AT 30 ns -- roughly 33 MHz or worse.
    A baseline nobody would ship measures nothing. Deeper also clocks well and is
    deliberately not chosen: it buys registers for a rate C3 already guarantees.
  register_placement: free (S1a) -- pinned depth, unpinned distribution

submissions_status: >
  NO SUBMISSION IN HAND HAS SEEN S1. candidates/d_dsp02/chat.sv was submitted
  2026-08-15, before the 3-cycle latency requirement was added 2026-08-16, under
  a spec that said "LATENCY IS NOT CONSTRAINED AND NOT CHECKED. Pipeline as
  deeply as you like." Its latency of 1 complied with the spec it was given.
  THIS TASK MUST BE RE-SOLICITED before it carries a scored latency or PPA
  result -- rescoring the existing answer would measure the spec change rather
  than the model. See FINDINGS.md F30.
  candidates/d_dsp02/gemini.sv does not build (wire declared inside always_comb,
  rejected by both frontends) and scores zero under rule 19.

scored_metrics:
  # `expect` is the value S1 requires. The metric is MEASURED from the design,
  # so a submission that declares the parameter and does something else shows a
  # mismatch here -- the MAX_TRANS shape, where the parameter existed and
  # nothing bound it. The checker does NOT enforce this: S1 is a spec
  # requirement, and correctness is checked separately (rule 18).
  - {metric: latency_cycles,  label: "lat(cyc)", expect: 3, role: fixed}
  - {metric: init_interval,   label: "II",       expect: 1, role: fixed}

configs:
  # CORRECTNESS SWEEP -- UNCHANGED by rule 18. Rule 18 pins the SCORED
  # configuration for PPA/latency/throughput; it does not narrow correctness
  # coverage. This list was already one entry and remains one entry.
  #
  # EXACTLY ONE, and one BY CONSTRUCTION rather than by omission. fp32_fma_ii1
  # declares no parameters: binary32 is fixed by the spec, and rounding mode is
  # a runtime INPUT swept by the stimulus rather than by elaboration.
  # If a parameter is ever added, the list in sim_candidate.sh must grow with it
  # or the sweep silently narrows.
  - {}

# ---------------------------------------------------------------------------
oracle:
  method: rule-11 inversion
  generator: gen/generate_inputs.py     # INPUTS ONLY, never expected values
  seed: 0xD5F02
  vectors: vectors/vectors.hex
  vector_count: 4290
  vector_width_bits: 136                # {a, b, c, rnd, result, flags}
  capture: tb/audit/capture_vectors_tb.sv
  note: >
    A hand-computed IEEE-754 case was wrong on the first attempt here and was
    caught ONLY because the anchor disagreed. Had that misunderstanding been
    coded into a model producing expected values, a cross-check would have
    agreed with it. The consequence is that COVERAGE FLOORS CARRY THE WHOLE
    WEIGHT: expected values are safe by construction, input coverage is not.
    Every floor is stimulus-side and tallied from the file before a cycle runs.

# ---------------------------------------------------------------------------
contract_terms_requiring_authority:
  # Rule 15. "Because the anchor does it" is not an authority.
  - id: A4
    term: canonical NaN 0x7FC00000
    authority: RISC-V; IEEE-754 only RECOMMENDS payload propagation
    alternative_out_of_scope: payload-propagating NaN
  - id: A4b
    term: overflow flag semantics; invalid always yields the canonical quiet NaN
    authority: IEEE-754 §7.4 for overflow; A4 (task-pinned) for the NaN result
  - id: A6
    term: >
      UNDERFLOW is set iff the result is inexact AND the delivered result's
      biased exponent field is zero (subnormal or zero).
    authority: PINNED BY THIS TASK -- no standard is cited, deliberately.
    departure_from_standard: >
      DEPARTS from IEEE-754 §7.5 tininess-after-rounding in exactly one band:
      an exact result strictly below the smallest normal that rounds UP to the
      smallest normal. §7.5 rounds at the destination precision with an
      UNBOUNDED EXPONENT RANGE and calls that underflow; this task inspects the
      DELIVERED result and does not. They disagree in RNE, RUP and RMM and
      agree in RTZ and RDN. 6 of the 4290 vectors sit in that band.
    why_longhand: >
      "Tininess after rounding" names TWO INCOMPATIBLE RULES -- the colloquial
      one (inspect the delivered result) and §7.5's (round with unbounded
      exponent, then test). This spec's PROSE always described the first and was
      correct; only the CITATION named the second. Same words, two rules, so the
      clause is now stated in full and cites nothing.
    requirement_unchanged: >
      The behaviour required of a submission is IDENTICAL to what A6 has always
      said in prose -- "a result that is tiny before rounding but rounds up to
      the smallest normal is NOT underflow". No candidate was ever mis-scored by
      this. What changed is the attribution and the predicate's precision (the
      zero case, which "subnormal" alone does not cover).
    note: >
      F14. The spec already SAID "tininess after rounding" and that still would
      not have caught the inherited choice -- it was found by counting flag
      combinations across the 4290 captured vectors. Audit the artefact, not the
      prose.

# ---------------------------------------------------------------------------
simulators_verified: [verilator-5.046]
sim_flags: ref/sim_flags_verilator.txt
sim_flags_note: >
  THIS FILE DID NOT EXIST UNTIL FINDINGS.md F22. Every result previously
  reported for this task came from ad-hoc Verilator invocations rather than the
  scored path, so none carried the leak check, the slang gate or NBSP
  normalisation. The task read as finished while being unscoreable. All results
  below have since been reproduced THROUGH the scored path.

# ---------------------------------------------------------------------------
mutants:
  # Each wraps the vendored anchor with one thing changed, so a failure isolates
  # the injected defect. mA1 is TWO anchor instances (MUL feeding ADD), so every
  # arithmetic step is externally-authored correct and the only defect is the
  # extra rounding between them.
  # Witness = the vector index at which the scored checker fails it.
  - {id: mCAP1, class: CAPABILITY,      defect: flush-to-zero on subnormals,      witness: "vector 0"}
  - {id: mA1,   class: fused-vs-unfused, defect: rounds the product before adding, witness: "vector 140"}
  - {id: mA4,   class: nan-payload,     defect: propagates NaN payload,           witness: "vector 55"}
  - {id: mA5,   class: signed-zero,     defect: zero result always positive,      witness: "vector 87"}
  - {id: mA6,   class: tininess,        defect: underflow detected before rounding, witness: "vector 0"}
  - {id: mA7,   class: flags,           defect: inexact dropped on subnormal,     witness: "vector 118"}

# Was indented as though it were a member of the `mutants:` sequence above, which
# is not valid YAML -- a mapping key cannot sit at the same indentation as the
# `- ` items of a sequence under the same parent. The file has therefore not
# parsed since it was written, so nothing machine-reading it saw ANY of these
# fields. Promoted to a top-level key; the value is unchanged.
mutants_all_killed_through_scored_path: true

second_source:
  file: tb/audit/fp32_fma_ii1_second_source.sv
  result: 4290/4290, zero coverage holes, C3 zero dead cycles
  differences:
    - bidirectional alignment onto max(ep, ec), not a unidirectional addend shift
    - speculate-and-select rounding, not decide-then-increment
    - single barrel shift from one leading-one index, subnormal folded into the
      index clamp, not lzc-then-correct staging
  attempted_and_withdrawn:
    - difference: frame strictly on the addend and shift the product
      why_withdrawn: >
        NOT IMPLEMENTABLE AT SANE WIDTH. With the frame pinned to the addend, a
        zero or subnormal addend sits at effective exponent -149 while the
        product ranges to 2^128 and down to 2^-298 -- about 426 binades plus 48
        product mantissa bits plus round and sticky, so ~485 bits. The anchor
        sizes its alignment shifter for 3*PRECISION_BITS+5 = 77 positions
        (fpnew_fma.sv:72), about a sixth of that.
      what_it_established: >
        This is a REAL RESULT ABOUT THE DESIGN SPACE, not a failed attempt. It
        explains why the anchor frames on the product, which nothing in the
        anchor's source says -- SHIFT_AMOUNT_WIDTH is a bound with no rationale
        attached. Framing is a CONSTRAINT wearing the costume of a choice, and
        the second source is what proved it. See FINDINGS.md F18.
  adjudication_note: >
    Three failures, all adjudicated to "the second source is wrong" under rule
    5's disambiguation. No check was loosened at any point. The sharpest was a
    signedness bug: {2'b0, ep} is UNSIGNED, so ep = -13 read as 4083 and gave a
    shift amount of 4139 where 43 was correct. Found by instrumenting, not by
    reasoning -- hand-tracing said the logic was correct.
  result_scope: >
    THE 4290/4290 ABOVE IS ACCURATE OVER THE SET IT WAS MEASURED ON, and that
    set is the pre-2026-08-21 4290. It is not a statement about the extended
    4340. Do not delete it and do not restate it as a current number.
  extended_set_result: 4330/4340
  extended_set_defect: >
    OPEN. The 50 directed band vectors added on 2026-08-21 expose 10 failures,
    all in one shape -- smallest subnormal squared, both signs, all five
    rounding modes -- and they include WRONG RESULT BITS, not only flags. The
    diagnosis is an exponent-underflow bug: the significand product survives
    while the exponent wraps out of range without being clamped to the subnormal
    path (2^-298 delivering 1d000000). BAND, LOW, HIGH and EXACT all pass, so it
    is NOT the underflow-flag clause.
    Filed in OPEN_DEFECT_second_source_ftz.md. NOT FIXED, and NOT fixed by the
    agent who found it -- repairing another owner's second source in passing is
    how independence quietly disappears. This task is NOT marked green on it.
    See F59: the prior 4290/4290 held over the region the set reached.

