version_boundary:
  changed_on: 2026-08-21
  pre_bump_task_text_hash:  5ad30593403b4ae2
  post_bump_task_text_hash: 13e3c4673f8a3270
  what_changed: >
    A4b and A6. The overflow and canonical-NaN authorities were split out and
    kept; underflow was rewritten longhand as "inexact AND the delivered
    result's biased exponent field is zero", the IEEE-754 §7.5 citation was
    removed, and the departure from §7.5 in the round-up-to-smallest-normal band
    was stated explicitly. F57.
  material_to_rule_17: YES -- NOT documentation-only
  reasoning: >
    The first read of this was that the requirement was unchanged, because A6's
    prose ALREADY said the right thing about the band: "a result that is tiny
    before rounding but rounds up to the smallest normal is NOT underflow".
    That is true, and for the BAND the bump really is documentation-only.
    .
    It does not hold for the ZERO case, and that is the half nobody checked.
    A4b said underflow is raised "only when the result is tiny AFTER rounding
    AND inexact", and A6 directed the reader to inspect the DELIVERED result.
    A delivered result of zero is not tiny -- IEEE defines tininess for a
    NON-ZERO result -- so the natural literal reading of the pre-change prose
    yields NO UNDERFLOW for a tiny inexact value that rounds all the way to
    zero. The anchor sets it.
    .
    MEASURED: 14 of the original 4290 sit in exactly that case -- delivered
    result zero, inexact, UF set. The pre-change spec did not determine them,
    and its most natural reading determined them WRONGLY. A candidate that read
    the contract carefully could have failed 14 scored vectors on a requirement
    the contract did not state.
    .
    So the requirement DID change: the zero case went from undetermined to
    determined. That is material under rule 17 and the landed results are
    labelled with the pre-bump hash rather than re-scored.
  landed_results_treatment: >
    RETAINED, labelled pre-bump, NOT re-scored and NOT deleted. Every landed
    d_dsp02 candidate run was scored against 5ad30593403b4ae2 and is comparable
    only to other pre-bump runs.
  candidates_actually_affected: >
    NONE OBSERVED. The landed candidate records were checked: no candidate
    failed on the zero case. That is the outcome, not the justification -- the
    exposure was real and no candidate happening to hit it is luck of the draw,
    not evidence the contract was adequate. F59.

