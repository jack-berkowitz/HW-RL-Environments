title: FP non-computational ops
id: v_dsp02
module: fp_noncomp
domain: dsp
type: verification
catalog: TASK_CATALOG.md

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/cvfpu
  refs_lock_sha: 6e5267e2fe75198f91ef9304ddd56c0028eea526
  licence: SHL-0.51
  mode: vendor
  file: refs/cvfpu/src/fpnew_noncomp.sv
  closure: [refs/cvfpu/src/fpnew_pkg.sv, refs/cvfpu/src/fpnew_classifier.sv]
  golden: dut/fp_noncomp.sv
  note: >
    SHIPS NO RTL. Task contents are spec/fp_noncomp_iface.sv and
    spec/fp_noncomp_spec.md only.
  anchor_modification: >
    dut/fpnew_noncomp.sv is the anchor with its ONE `include
    "common_cells/registers.svh" line replaced verbatim by that file's contents.
    sim_verification.sh passes no -I include path and the verification half has
    no sim_flags equivalent, so dut/ has to be self-contained. Verified
    mechanically: outside the inlined block the file is line-for-line identical
    to the anchor with the include removed (526 lines both sides).
  provenance_caveat: >
    Files present at the paths refs.manifest.yaml names, in a repo refs.lock
    pins. Contents NOT verified against upstream at that SHA -- needs network,
    egress closed. Attests local state only.

harness:
  golden_top: fp_noncomp
  tb_module: fp_noncomp_tb
  conformant_prefix: fn_c
  mutant_prefix: fn_m
  golden_file: dut/fp_noncomp.sv
  support_files: [dut/fpnew_pkg.sv, dut/fpnew_classifier.sv, dut/fpnew_noncomp.sv]
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  sim_timeout_s: 25

spec: [spec/fp_noncomp_spec.md, spec/fp_noncomp_iface.sv]
task_statement: probe/BLIND_TB_TASK.md

scored_configuration:
  format: binary32
  NumPipeRegs: 1
  PipeConfig: BEFORE
  rationale: >
    No free parameters are exposed; the port map is fixed-width. NumPipeRegs=1
    is NOT the anchor's default of 0: at 0 the unit is combinational and the
    handshake degenerates to passthrough, so H1-H3 would have no state to be
    wrong about. One stage makes the handshake real while leaving latency
    unconstrained (latitude 1).
  pinned_inside_the_shim: [FpFormat=FP32, NumPipeRegs=1, PipeConfig=BEFORE, op_mod_i=0, is_boxed_i=3]

second_dut:
  status: WIRED
  file: dut2/fp_noncomp_alt.sv
  differences:
    - "ordering: a monotone key map and ONE unsigned compare, against the anchor's
       compare-then-correct with (a<b) ^ (sign_a||sign_b)"
    - "classification: one-hot straight off the exponent/significand fields, against
       the anchor's separate classifier module producing an info struct"
    - "DECLARED pipeline placement (outputs vs inputs) -- MEASURED AND DID NOT
       SURVIVE: in_ready_o and out_valid_o differ on ZERO of 3178 cycles, because
       cvfpu's ready path is combinational through every stage. Record kept rather
       than back-fitted."
  surviving_difference_measured: >
    The two disagree on 1450 cycles and every disagreement is inside the latitude:
    result_o differs on 333 cycles, ALL with op=CLASSIFY (10.4); class_mask_o on
    1117, ALL with op!=CLASSIFY (10.5); status_o on 0. The second DUT drives zero
    where the anchor drives datapath residue, so it probes 10.4 and 10.5 from the
    opposite side to fn_c4 and fn_c5.
  result: passes the reference testbench, zero rule-5 adjudications
  UNWIRED: >
    sim_verification.sh gates on this DECLARATION only -- it refuses when a
    non-ABSENT status has no dut2/ -- and never compiles or runs the file. Every
    result above came from running the reference testbench by hand. Do not assume
    it working as a gate.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpromised_reliance: must PASS every conformant perturbation
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10
  ceiling_caveat: >
    Same caveat as v_nw03 and not discharged: one author wrote the spec, the
    checker and the mutants, so the set has only been challenged by what that
    author anticipated. The first submission is the real test.

watchdog:
  tb_sim_time_limit: 200000000    # time units
  tb_sim_time_measured: 75us
  harness_sim_timeout_s: 25
  harness_wall_measured_s: 0.44   # cold; <0.01 warm

conformant_perturbations:
  - {id: fn_c1, licence: "10.1 latency",        witness: "all 1008 results one cycle later; values identical"}
  - {id: fn_c2, licence: "10.2 idle outputs",   witness: "values and timing identical; idle-line changes 92 vs 461"}
  - {id: fn_c3, licence: "10.3 ready",          witness: "1005 of 1008 results shift in time"}
  - {id: fn_c4, licence: "10.4 result on CLASSIFY",     witness: "144 CLASSIFY results differ on result_o only"}
  - {id: fn_c5, licence: "10.5 class on non-CLASSIFY",  witness: "864 results differ on class_mask_o only"}
  enumeration: conformant/README.md
  all_survive: true

policy_independence_5c:
  policy_independence: >
    All ten guarded defects re-derived on the policy-divergent implementation in
    dut2/ -- an INDEPENDENT design written from the spec, not a wrapper around
    the anchor -- and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    HOW THE RE-DERIVATION IS DONE. Every mutant in this task wraps an
    implementation and reads its guards from the PORTS only, so the re-derived
    defect is the same wrapper pointed at the other design. The wrapper cannot
    depend on either implementation's internals because it never sees them --
    which is the reason guards were restricted to contract-level state in the
    first place.

    RULE 24: licensed by an observed run on 2026-08-23; the output is recorded
    in mutants/RULE24.md alongside the witness-runner controls.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Each defect is a wrong behaviour paired with an ORDINAL
    over contract-level state: it fires only from the Nth operation of its own
    class since reset. The clause it violates holds on EVERY operation, so
    catching it needs a testbench that keeps checking rather than one that
    spot-checks each operand class once.
  why_ordinals: >
    This unit is combinational at the contract level -- no occupancy, no burst,
    no queue to key a guard on. What it has is the sequence of operations and
    clauses that hold on every one of them. Ordinals are the contract-level
    state this design actually has.
  thresholds: >
    Raised once. At ordinals of 2 to 5 the reference killed all ten with NO
    change to the reference at all, which is the signal that a guard is
    shallower than the reference's own sweeps. Raised, fn_m9 went out of reach
    and the REFERENCE was extended to meet it rather than the guard loosened.
  - {id: fn_m1_classify_subnormal_as_zero, violates: "S12",
     guard: "the EIGHTH subnormal classify since reset",
     defect: "a subnormal is classified as zero",
     witness: "FAIL [S12] classify a=807fffff : mask expected 0000000100 got 0000001000"}
  - {id: fn_m2_ieee2019_minmax, violates: "S4",
     guard: "the SIXTH minmax with exactly one NaN operand",
     defect: "IEEE 754-2019 minimum/maximum semantics: the NaN propagates",
     witness: "FAIL [S4] op=1 mode=1 a=00000000 b=7fa00000 : result expected 00000000 got 7fc00000"}
  - {id: fn_m3_minmax_ignores_zero_sign, violates: "S3",
     guard: "the FOURTH minmax of two zeros",
     defect: "-0.0 and +0.0 are treated as interchangeable",
     witness: "FAIL [S3] op=1 mode=0 a=80000000 b=00000000 : result expected 80000000 got 00000000"}
  - {id: fn_m4_feq_is_signalling, violates: "S9",
     guard: "the FOURTH quiet comparison with a NaN operand",
     defect: "equality is made a SIGNALLING comparison",
     witness: "FAIL [S9] op=2 mode=2 a=80000000 b=7fc00000 : NV expected 0 got 1"}
  - {id: fn_m5_sgnjx_becomes_sgnj, violates: "S1",
     guard: "the TENTH sign-injection XOR since reset",
     defect: "sgnjx behaves as sgnj",
     witness: "FAIL [S1] op=0 mode=2 a=80000000 b=00000000 : result expected 80000000 got 00000000"}
  - {id: fn_m6_sgnj_canonicalises_nan, violates: "S1",
     guard: "the SIXTH sign-injection on a NaN",
     defect: "the NaN payload is canonicalised instead of carried through",
     witness: "FAIL [S1] op=0 mode=0 a=ffd5a5a5 b=00000000 : result expected 7fd5a5a5 got 7fc00000"}
  - {id: fn_m7_sgnj_quiets_snan, violates: "S1",
     guard: "the SIXTH sign-injection on a signalling NaN",
     defect: "the sNaN is quieted; sign injection is not an arithmetic operation",
     witness: "FAIL [S1] op=0 mode=2 a=7fa00000 b=80000000 : result expected ffa00000 got ffe00000"}
  - {id: fn_m8_max_subnormal_is_normal, violates: "S12",
     guard: "the FOURTH classify of the largest subnormal",
     defect: "it is classified as the smallest normal",
     witness: "FAIL [S12] classify a=807fffff : mask expected 0000000100 got 0000000010"}
  - {id: fn_m9_feq_distinguishes_zeros, violates: "S7",
     guard: "the FOURTH equality comparison of +0 against -0",
     defect: "they compare unequal",
     witness: "FAIL [S7] op=2 mode=2 a=80000000 b=00000000 : result expected 00000001 got 00000000"}
  - {id: fn_m10_minmax_snan_not_invalid, violates: "S6",
     guard: "the EIGHTH minmax with a signalling NaN operand",
     defect: "no invalid flag is raised",
     witness: "FAIL [S6] op=1 mode=1 a=80000000 b=ff812345 : NV expected 1 got 0"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_runner: mutants/witness.sh
  reference_reachability: >
    The reference kills all ten. A mutant it cannot reach is unverified, not
    difficult.
