title: byte-stream realignment
id: v_ai02
module: stream_realign
domain: ai_accel
type: verification
catalog: TASK_CATALOG.md
tier: B

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/hwpe-stream
  licence: SHL-0.51
  mode: vendor
  file: refs/hwpe-stream/rtl/streamer/hwpe_stream_source_realign.sv
  closure: [refs/hwpe-stream/rtl/hwpe_stream_package.sv,
            refs/hwpe-stream/rtl/hwpe_stream_interfaces.sv,
            refs/tech_cells_generic/src/rtl/tc_clk.sv]
  golden: dut/stream_realign.sv
  note: >
    SHIPS NO RTL. The task ships spec/stream_realign_iface.sv (port map) and
    spec/stream_realign_spec.md only. dut/ holds the anchor VERBATIM plus a
    Class A port shim, used for scoring and never given to a submission. The
    anchor copies keep their upstream headers unaltered.
  provenance_caveat: >
    The files are present at the paths refs.manifest.yaml names, in a repo
    refs.lock pins. Their CONTENTS have not been verified against upstream at
    that SHA -- that needs network, egress is closed. Attests local state only.

harness:
  golden_top: stream_realign
  tb_module: stream_realign_tb
  conformant_prefix: sr_c
  mutant_prefix: sr_m
  golden_file: dut/stream_realign.sv
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  sim_timeout_s: 60

spec: [spec/stream_realign_spec.md, spec/stream_realign_iface.sv]

scored_configuration:
  beat_width_bits: 32
  strb_width: 4
  pinned_inside_the_shim: [DECOUPLED=0, DATA_WIDTH=32, STRB_FIFO_DEPTH=4, enable=1, last_packet=0]
  rationale: >
    Four bytes per beat is the smallest width at which the rotation takes more
    than two distinct values, so an off-by-one in it is distinguishable from a
    reversal. DECOUPLED=0 is the configuration whose control inputs are all
    live: on the decoupled path the unit derives first and last from an internal
    word counter instead, and strb_valid and line_length come alive with it.
  dead_ports_omitted: >
    strb_valid_i and line_length_i are read ONLY on the DECOUPLED path and are
    dead at this configuration, so they are not in the port map. A port the
    design never reads is a port map that lies.

second_dut:
  status: WIRED
  file: dut2/stream_realign_alt.sv
  note: >
    The SAME artefact as the policy-divergent perturbation of Tier-B step 5c,
    generated from it so the two cannot drift. Independently written from the
    spec; it does not instantiate the golden.
  differences:
    - "readiness (clause L1): every beat waits for the sink, the first one
       included. The golden accepts a line's first beat whether or not the sink
       is ready, since that beat produces no output."
    - "idle payload (clause L2): drives a fixed pattern on pop_data_o and zero on
       pop_strb_o while pop_valid_o is low; the golden drives the computed value."
    - "structure: an explicit popcount and a case-selected join, against the
       anchor's barrel shifter with width-truncated shift amounts."
  nonequivalence_witness: >
    With the sink held not ready at a line's first beat the golden accepts it and
    the alt does not, so push_ready_o differs while the source is offering.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpremised_reliance: must PASS the policy-divergent perturbation and dut2
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10

conformant_perturbations:
  - id: sr_c1_first_beat_waits
    licence: "L1 and L2"
    kind: POLICY-DIVERGENT, Tier-B step 5c
    change: an INDEPENDENT implementation, not a wrapper; every beat waits for the sink
    reference_tb_verdict: PASS
  policy_independence: >
    All ten defects re-derived on the divergent implementation
    (mutants/policy/) and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22. Rerun with
    mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a wrong behaviour paired with a rare
    predicate over contract-level state, so it is caught only by a testbench
    that CONSTRUCTS the named configuration and is still checking when it
    arrives. A total defect fires on the first transaction of its class and
    measures coverage rather than checking.
  fairness: >
    Each guard names a condition the spec states as a checkable bound at a named
    boundary -- a rotation value, a line's beat index, a run of lines, a stall
    length, an ordinal delivery -- so the catching act is derivable from the
    spec text alone.
  - {id: sr_m1_rotation_four_when_three, violates: "R2/R4/R5",
     guard: "the line's rotation is exactly 3",
     defect: "it is realigned at rotation 4 instead -- 0, 1, 2 and 4 are all exact",
     witness: "cycle 33 -- output: golden data=24232221 / mutant data=00000000"}
  - {id: sr_m2_first_beat_emitted_from_third_line, violates: "R1",
     guard: "the third line since reset or clear, and every line after",
     defect: "a line's first beat produces an output instead of being retained",
     witness: "cycle 142 -- pop_valid_o: golden 0 / mutant 1"}
  - {id: sr_m3_rotation_recaptured_deep_in_line, violates: "R4",
     guard: "the fifth beat of a line and every beat after",
     defect: "the rotation is recaptured from the current beat's strobe",
     witness: "cycle 177 -- output: golden data=f1f0efee / mutant data=f0efeeed"}
  - {id: sr_m4_retain_skipped_after_stall, violates: "R5",
     guard: "a beat accepted in the first cycles after the sink held off four or more",
     defect: "it is not retained, so the next output joins stale data",
     witness: "cycle 206 -- output: golden data=0c0b0a09 / mutant data=0cfbfaf9"}
  - {id: sr_m5_last_dropped_on_long_line, violates: "R6",
     guard: "the line is five beats or longer",
     defect: "a final beat with a clear strobe produces no output",
     witness: "cycle 231 -- pop_valid_o: golden 1 / mutant 0"}
  - {id: sr_m6_strb_from_input_on_last_beat, violates: "R3",
     guard: "the output beat of a line's LAST beat",
     defect: "pop_strb_o carries push_strb_i instead of all ones",
     witness: "cycle 84 -- output strb: golden 1111 / mutant 0011"}
  - {id: sr_m7_drop_every_thirty_second, violates: "R2/R5",
     guard: "the thirty-second output beat, and every thirty-second after",
     defect: "it is consumed internally and never shown to the sink",
     witness: "cycle 156 -- pop_valid_o: golden 1 / mutant 0"}
  - {id: sr_m8_passthrough_rotates_after_realign, violates: "P1",
     guard: "realign_i has been high at least once since reset",
     defect: "pass-through is not transparent -- the data is rotated one byte",
     witness: "cycle 262 -- output: golden data=55545352 / mutant data=54535255"}
  - {id: sr_m9_extra_beat_on_late_empty_strobe, violates: "R2",
     guard: "the empty-strobe beat is the fourth or later in its line",
     defect: "it produces an output beat anyway; earlier ones are correctly suppressed",
     witness: "cycle 248 -- pop_valid_o: golden 0 / mutant 1"}
  - {id: sr_m10_admission_withheld_after_long_stall, violates: "X3",
     guard: "the sink has just held off eight or more consecutive cycles",
     defect: "admission is withheld twenty cycles although pop_ready_i is high",
     witness: "cycle 204 -- push_ready_o while offering: golden 1 / mutant 0"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_harness: mutants/nonequiv_tb.sv
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  depth: >
    None falls to a single line through an idle unit. Reaching them needs three
    lines run without a clear between, a strobe that CHANGES popcount inside a
    line, a stall taken while an output is actually being offered, lines long
    enough to pass a five-beat boundary, an empty strobe deep inside a line
    rather than at its edges, a partial strobe on a LAST beat, pass-through
    exercised after realigning rather than before, and thirty-two delivered
    beats.
  reference_reachability: >
    The reference kills all ten. It did not before this set: it reached three,
    and seven phases had to be added to it. A mutant the reference cannot reach
    is unverified rather than difficult.

negative_controls:
  known_bad_dut:
    status: PASS
    detail: >
      negctl/stuck_dut.sv (all 4 outputs tied low, generated from the port map)
      and negctl/reset_polarity_dut.sv (rst_ni treated as active high) are both
      caught naming clauses X3 and R2, not by the watchdog.
  null_testbench:
    status: PASS -- rejected
    detail: >
      negctl/null_tb.sv drives nothing and never instantiates the DUT. The
      harness runs a gate-mutant with every output tied high and requires a
      submission to reject it; the null testbench is reported INVALID and
      EXCLUDED FROM SCORING.

watchdog:
  tb_sim_time_limit: 2ms
  harness_sim_timeout_s: 60
