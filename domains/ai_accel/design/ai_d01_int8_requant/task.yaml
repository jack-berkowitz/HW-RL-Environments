id: ai_d01
module: int8_requant
domain: ai_accel
type: design

# CLASS B -- local model of record. No external RTL oracle exists for this task.
# "The checker passes known-correct external RTL" is NOT a claim available here.
oracle_class: B
reference:
  refs_lock_repo: nvdla/hw
  sha: 8e06b1b9d85aab65b40d43d08eec5ea4681ff715
  mode: cross_check_only
  note: >
    NVDLA SDP confirms the accumulate->scale->shift->clamp structure is real
    inference hardware. It never defines expected values. The oracle is
    ref/model/int8_requant_model.py plus the committed vectors.

spec: spec/int8_requant_iface.sv
oracle: ref/model/int8_requant_model.py
vectors: tb/vectors/          # 2060 vectors, regenerate with --emit-vectors

# Every legal config, all checker-verified on BOTH simulators.
configs:
  - {LANES: 1}
  - {LANES: 2}
  - {LANES: 4}
  - {LANES: 8}
illegal_configs: "LANES not in {1,2,4,8} -- checker aborts with TEST_RESULT: FAIL: illegal LANES"

sim_timeout_s: 300
simulators_verified: [verilator-5.046, iverilog-13.0]

# ai_d01 is NOT on the mandatory second-source list (DESIGN_CATALOG.md
# § Second-source requirement lists ca_d01, ca_d02, ca_d03, ca_d08, nw_d01,
# dsp_d02, ai_d02). Not skipped by oversight -- not required.
second_source: false

mutants:
  - {id: m01, class: arithmetic-rounding,   kill: "D3 @ cyc 19",   diff_rate_ppm: 5671}
  - {id: m02, class: arithmetic-rounding,   kill: "D3 @ cyc 14",   diff_rate_ppm: 19509}
  - {id: m03, class: arithmetic-sign,       kill: "D2 @ cyc 8",    diff_rate_ppm: 24727}
  - {id: m04, class: boundary,              kill: "D3 @ cyc 11",   diff_rate_ppm: 5444}
  - {id: m05, class: saturation-vs-wrap,    kill: "D3 @ cyc 11",   diff_rate_ppm: 560571}
  - {id: m06, class: reset,                 kill: "D6 @ cyc 3108", diff_rate_ppm: 1814}
  - {id: m07, class: protocol-concurrency,  kill: "D4 @ cyc 527",  diff_rate_ppm: 247731}

ppa_baseline:
  platform: sky130hd
  lanes: 4
  clk_period_ns: 20.0
  area_um2: 275995          # post-route design area, 14% utilisation
  synth_area_um2: 193269
  power_mw: 1470            # 100% combinational
  wns_ns: -6.41             # DOES NOT CLOSE -- see NOTES.md
  tns_ns: -193.07
  timing_closed: false
  sequential_cells: 33
  flow_completed: true
  note: >
    Baseline is for LANES=4 only. A baseline taken at a different LANES is NOT
    comparable -- the datapath replicates per lane.
