second_source:
  status: PRESENT_WITH_OPEN_RESIDUAL
  file: tb/fp16_gemm_array_alt_ref.sv
  oracle_class: B
  oracle_class_note: >
    A LOCAL MODEL OF RECORD, not an external one. RedMulE exposes no shimmable
    boundary for this contract beyond redmule_engine itself, so there is no second
    external RTL to anchor on. NOTHING HERE CARRIES A "passes known-correct
    external RTL" CLAIM.
  independence: >
    NOT A CLEAN ROOM, and the file header says so itself. ref/ was never opened
    while writing it, but the anchor's structure was already in working memory
    from the step-0 audit -- W rows of H chained elements, a registered partial
    sum between stages, physically gated row clocks. The structural differences
    are therefore DELIBERATE OPPOSITES of a known structure rather than
    independent convergence, which is weaker evidence and is labelled as such.
    Where it still bites is the arithmetic and the timing readings, both derived
    from clause text alone.
  structural_differences:
    measured:
      - "elaborates under Verilator but FAILS slang with `unroll limit of 4000
         exhausted`, where the reference passes both -- a direct consequence of
         the iterative wide-value search the exact-integer algorithm uses"
      - "divergence profile: disagreement confined to control transitions and
         lasting exactly one pipeline depth, with zero divergence in the directed
         arithmetic tail -- measures that the two hold state in different places"
    inspection_verifiable:
      - "no clock-gating cell of any kind (grep the file), against
         tc_clk_gating per row in redmule_engine.sv:75 and cluster_clock_gating
         per element in redmule_ce.sv:68"
      - "no instantiated arithmetic unit at all, against redmule_row instantiating
         HEIGHT redmule_ce instances per row"
      - "one partial-sum shift register per row with an FMA tapped in at position
         D*k, 14,464 declared state bits at 8x8, against per-element internal
         pipelines"
    rule_5_note: >
      Two measured and three inspection-verifiable, which satisfies the amended
      rule 5. It is AT THE FLOOR, not comfortably above it, and that is stated
      rather than left for a reader to work out.
  results:
    measured_against_task_text: 86b7d95729381055
    HEIGHT_4: {scored_cycles: 3157, z_mismatches: 4, status_mismatches: 10}
    HEIGHT_8: {scored_cycles: 2937, z_mismatches: 6, status_mismatches: 13}
  open_residual: >
    IT DOES NOT AGREE WITH THE REFERENCE, and is committed in that state
    deliberately. Two populations remain. (1) 4 z cycles at HEIGHT=4 (2637-2640,
    one row) and 6 at HEIGHT=8 (1472-1478) that reproduce under NO directed probe
    built so far -- MEASUREMENTS.md section 17, recorded OPEN, at the adjudication
    cap, needing a differently-shaped instrument rather than more rounds.
    (2) flush-cycle status divergences, closed as a second-source defect in
    MEASUREMENTS.md section 15: the reference keeps advancing its status pipeline
    through a flush and this file does not, and matching it exactly would mean
    modelling per-stage internal registers the contract deliberately omits.
    .
    Four of five earlier residuals resolved as defects in THIS FILE rather than in
    the task -- a truncated self-determined product, a missing output pipeline
    stage, a status pipeline one stage short, and a feedback tap one tick early.
    On that record the likely reading of the remaining z cycles is a fifth. That
    is a prior, not a measurement.
  what_it_bought: >
    THREE CONTRACT DEFECTS, none of which any of the seven negative controls could
    see. A10 left flag timing unpinned and permitted two legal readings that
    disagreed on ~2900 of 3400 cycles. C2 asserted the post-flush refill was
    contractual when the reference's refill is not derivable from A3. C3 and C4
    asserted determinism across control transitions the contract cannot deliver.
    All three are now narrowed or pinned, and F68 and rule 26 generalise the
    pattern. It also reproduced d_dsp03's slang unroll failure on the same
    construct, which is why this task now has a T5.
    .
    It does NOT yet demonstrate the task is solvable at the pinned contract --
    that claim needs an implementation that AGREES, and this one does not.

orfs:
  config: orfs/config.mk
  sdc: orfs/constraint.sdc
  synthesises_at_scored_config_by_default: >
    The shim's parameter defaults ARE S0 -- HEIGHT=8, WIDTH=8 -- so nothing in
    config.mk pins them. If a default ever drifts from `scored_configuration:`
    above, the PPA number silently stops being the scored one.
  closure_note: >
    The VERILOG_FILES list is Verilator's own dependency output for the elaborated
    hierarchy, not a hand-assembled list, and was then verified by running
    read_slang with exactly that list: exit 0, 45.4 s, 1292 MB peak. slang `stat`
    reported 256 $mul at 16x16 -- one multiplier per element -- which is the check
    that the list builds the design meant rather than merely A design.
  frontend_note: >
    read_slang is BUILT IN to the Yosys in openroad/orfs:latest (0.67).
    `plugin -i slang` fails there with "cannot open shared object file".
  synthesis_verified:
    stage: synthesis + OpenSTA only (place-and-route not run -- Agent 1's)
    area_um2: 1631831.31
    logic_delay_ns: 35.385
    closes_at_period_ns: 44.62
    sdc_starting_period_ns: 50.0
    how_the_period_was_chosen: >
      MEASURED at two periods and reconciled. Arrival 39.385 at 20 ns and 43.385
      at 40 ns differ by exactly the input-delay change (4.000 ns), so they are
      one path through two I/O budgets; both give logic = 35.385 ns. Required is
      period - 0.311, so the path closes at period >= 44.62 and 50 ns leaves
      +4.30 ns for place-and-route.
    why_the_path_is_long: >
      It is an input-to-register path. A lone redmule_ce is 15.672 ns; the array
      is 35.385. The difference is the operand broadcast -- w_i fans out to all
      64 elements and x_i to a whole row each, unbuffered at synthesis, so the
      boundary paths carry the array's fanout before reaching the first register.

  elaboration:
    verilator: "0 errors"
    slang: "exit 0"
    widthtrunc_warnings: >
      All 10 are internal to redmule_fma.sv -- 37/38-bit alignment widths and
      int-literal shift amounts, the same set cvfpu's fpnew_fma emits. None
      touches a shim binding, and the 37/38 widths are consistent with FP16.

ppa: ABSENT
ppa_note: >
  Agent 1 owns PPA. Tier-B pins a fixed clock period rather than sweeping fmax.
  No place-and-route run exists. The SDC's starting period is derived from a
  measured critical path rather than guessed -- see orfs/constraint.sdc -- but
  the final pin is Agent 1's, and should be overridden with CLK_PERIOD_NS rather
  than by editing the file.

skipped_under_tier_b: [find_fmax, mutant_set, formal_EC_per_task]
# second_source was listed here and should not have been. Rule 5 makes it
# mandatory; Tier-B drops find_fmax's binary search in favour of a pinned clock
# period, which is a PPA procedure change and says nothing about anchoring.

difficulty_assessment: >
  Not a first-try problem, and not for the reason the catalog row expected. The
  MAC is not trivial: it is a bit-exact binary16 fused multiply-add chain with
  five rounding modes, subnormal operands AND results, tininess signalled only
  when inexact, IEEE 754 clause 6.3 exact-zero signs, canonical NaN, and
  mode-dependent delivered values at BOTH ends of the range -- ten distinct
  values on overflow and ten on underflow, which is what A5 and A6 tabulate.
  .
  On top of that the dataflow is contractual. Stage k consumes its operands
  D*(H-1-k)+3 enabled ticks before the result appears, so a coherent dot product
  requires the operand pairs to be presented STAGGERED, and a design with the
  right arithmetic and the wrong skew fails on ordinary vectors -- nc_b kills
  2784 of 3400 while changing no delivered value at all.

# ---------------------------------------------------------------------------
# CONTROL DECLARATION -- inbox/CONTROL_ENUMERATION.contract.md, revision 2.
# DECLARED, NOT GLOBBED: the directory is where they live, this is what they are.
# `measured_by` is mandatory on this side because most of these verdicts are hand
# runs, and a hand run is a measurement whose instrument was never wired -- the
# defect the contract exists to close. It is stated per control rather than per
# task so a mixed set cannot read as uniform.
# ---------------------------------------------------------------------------
controls:
  - file: controls/nc_a_stuck_output.sv
    kind: negative
    expect: fail
    clause: any
    measured_by: scored_path
    result: "0/2 -- fails at both geometries; 2936 z mismatches at H=8"
    note: the floor case, every output stuck
  - file: controls/nc_b_extra_pipe_stage.sv
    kind: negative
    expect: fail
