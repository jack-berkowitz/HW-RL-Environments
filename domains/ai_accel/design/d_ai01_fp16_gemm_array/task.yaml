    note: >
      The vector sets themselves did NOT change across EITHER boundary -- the
      stimulus and the recorded reference behaviour are byte-identical throughout.
      What changed both times is which cycles are scored.
  candidates_affected: NONE -- no candidate has ever been scored against this task.

scored_configuration:
  HEIGHT: 4
  WIDTH: 8
  moved_from_HEIGHT_8_on: 2026-08-25
  moved_because: >
    HEIGHT=8 DOES NOT ROUTE ON sky130hd. Measured, not estimated: 76,253 to
    83,445 detailed-routing violations across three separate floorplans -- CORE
    UTILIZATION 10 and 30, PLACE_DENSITY 0.50 and 0.35. HEIGHT=4 closes clean at
    0 violations, 710,752 um^2, 33% utilisation. Both at the SAME 50 ns
    constraint, so the comparison is like-for-like and is about the geometry.
  necessary_not_sufficient: >
    50 ns is the most RELAXED constraint this task allows and the pinned period is
    NOT YET SET (spec G1). A failure at 50 ns would have been decisive; this pass
    is NECESSARY AND NOT SUFFICIENT. The pin will be tighter, closure is bought
    with area, and the routed design at the pin will exceed 710,752 um^2 -- it
    must be re-checked before any PPA number publishes from it.
  what_did_NOT_move: >
    P1 still makes HEIGHT legal at 4 AND 8, and T3 still requires a submission to
    hold at BOTH. What moved is which geometry carries the PPA comparison, not
    which geometries a design must implement. The runner sweeps both.
  consequence_for_nc_g_discrimination: >
    THE SCORED GEOMETRY IS NOW THE ONE WHERE nc_g CANNOT DISCRIMINATE, and that is
    recorded rather than left to be discovered. nc_g_height_blind_depth pins the
    chain depth to the literal 4: it PASSES at HEIGHT=4 and FAILS at HEIGHT=8.
    With HEIGHT=4 scored, a run of the SCORED CONFIGURATION ALONE would not catch
    it.
    .
    The task is not weakened, because T3 requires a submission to hold at BOTH
    legal heights and scripts/sim_candidate.sh sweeps both -- correctness is
    scored across the pair, not at the scored geometry. Re-verified after the
    move: reference 2/2, nc_g 1/2 failing at +HH=8.
    .
    WHAT THIS DOES CHANGE is that T3 is now load-bearing for a discrimination it
    was previously redundant with. Anyone running only the scored configuration --
    a PPA-only flow, for instance -- gets no evidence about HEIGHT at all.
  second_capacity_control_owed:
    status: RESOLVED -- the L3 LATENCY FLOOR was built instead of the mirror control
    resolution_date: 2026-08-25
    what_was_built: >
      A latency floor in tb/fp16_gemm_array_tb.sv. It measures total latency with a
      directed impulse at stage 0 and asserts L3's D*(H-1)+2 -- 14 enabled ticks at
      HEIGHT=4, 30 at HEIGHT=8 --
      [SUPERSEDED 2026-08-26: the constant is D*(H-1)+3, 15 and 31. The floor in
      the testbench was corrected then; this record describes what was built on
      2026-08-25 and is left as written.] so the value is DERIVED FROM H and a design
      carrying a CONSTANT latency satisfies at most one of the two legal
      geometries.
    validated_by_firing_it: >
      A floor that has only ever agreed with the reference is a floor nobody has
      seen discriminate. Measured:
        reference  H=4 15/15 PASS   H=8 31/31 PASS
        nc_g       H=4 15/15 PASS   H=8 15/31 FAIL
        nc_b       H=4 16/15 FAIL
      nc_g's row IS the test: its latency is 15 at BOTH heights, the same number
      for a geometry twice the size, which is what "constant rather than derived"
      looks like measured rather than argued. It does NOT fire at H=4 where nc_g
      is a correct design, so the floor does not manufacture a failure at the
      geometry it cannot speak about.
    what_is_new_at_the_scored_geometry: >
      nc_b now FIRES AT HEIGHT=4 and is reported as a latency defect rather than
      inferred from a mismatch count. Before this floor HEIGHT=4 carried no
      latency evidence of its own.
    what_it_still_does_not_close: >
      IT CANNOT DETECT nc_g AT HEIGHT=4 AND NOTHING CAN. At HEIGHT=4 nc_g is not a
      wrong design, it is a right one that happens to be inflexible, and it is
      behaviourally identical to a conforming design at that geometry. The only
      evidence of inflexibility is the other geometry, which is why T3 is
      load-bearing and why correctness must be read across the pair.
    a_convention_error_the_floor_caught_in_itself: >
      The first cut asserted D*(H-1)+2 directly and the REFERENCE measured one tick
      more at BOTH geometries -- 15 against 14, 31 against 30. A UNIFORM offset
      across both heights is the signature of a counting convention, not a design
      defect, and the H-dependence was intact: 31 - 15 = 16 = D*(8-4), exactly
      L3's slope. MEASUREMENTS.md section 3 records probe_skew_tb making the
      identical mistake and being settled by the identical test. The convention is
      now stated in the assertion rather than absorbed into a magic number.

    WHY_THE_MIRROR_CONTROL_WAS_REJECTED:
      verdict: CONSTRUCTIBLE BUT NOT PLAUSIBLE
      the_candidate: >
        nc_g's mirror -- chain depth pinned to the literal 8, correct at HEIGHT=8
        and wrong at HEIGHT=4, so it would fail at the scored geometry and give
        the pair one failing capacity control at each legal height.
      why_it_constructs: >
        Pinning depth to 8 while the port is HEIGHT-wide means indexing stages
        4..7 of a [3:0] array. SystemVerilog resolves an out-of-range index to X
        rather than raising an elaboration error, so the design compiles and runs
        and produces wrong data.
      why_that_is_the_objection_and_not_the_defence: >
        IT CONSTRUCTS ONLY BECAUSE THE LANGUAGE DECLINES TO OBJECT. No submission
        builds for a height ABOVE the one it was given -- the plausible mistake is
        building for the smaller legal height, which is nc_g and which already
        exists. A CONTROL NOBODY WOULD WRITE MEASURES THE CHECKER RATHER THAN THE
        CONTRACT: it demonstrates that the testbench can detect a thing, without
        evidence that the thing is a way designs fail.
      the_distinction_generalises: >
        CONSTRUCTIBLE means the artefact can be built and will exercise the
        checker. PLAUSIBLE means it is a way a submission actually goes wrong.
        Only the second makes a control evidence about the contract. "It
        compiles" is not an argument for plausibility and, where it compiles only
        because the language resolves an error to X, it is an argument against.
      the_precedent_that_frames_it: >
        d_nw01 recorded that no capability check discriminates at MAX_TRANS=2 and
        that A PASS AT THE LOW SETTING IS NOT CAPABILITY EVIDENCE; d_ca01 cites
        that as its reason for MAX_MISSES=8 over 2. THE SCORED SETTING HERE IS NOW
        THE LOW ONE, which is what made a second capacity control owed at all. The
        floor discharges that debt without needing a plausible-design argument,
        because a floor asserts a contract quantity rather than impersonating a
        submission.
    the_gap: >
      THERE IS NOW NO CAPACITY-CLASS CONTROL THAT FAILS AT THE SCORED GEOMETRY.
      nc_g_height_blind_depth is the only capacity control and its polarity points
      away from HEIGHT=4: it pins the chain depth to the literal 4, which is
      CORRECT at HEIGHT=4, so it passes there and fails only at HEIGHT=8. The six
      controls that fail at both heights -- nc_a stuck output, nc_b extra pipe
      stage, nc_c flush subnormal, nc_d overflow always inf, nc_e positive zero
      only, nc_f reversed chain -- are arithmetic and ordering controls. None of
      them tests that HEIGHT is load-bearing.
    why_this_is_the_gap_nc_g_EXISTED_to_close: >
      d_nw01 recorded that no capability check discriminates at MAX_TRANS=2 and
      that A PASS AT THE LOW SETTING IS NOT CAPABILITY EVIDENCE. That lesson is
      cited in d_ca01's own scored_configuration rationale as the reason
      MAX_MISSES=8 was chosen over 2. THE SCORED SETTING HERE IS NOW THE LOW ONE:
      4 of the two legal heights. So the PPA number will be taken at the geometry
      where the capacity claim is least tested, which is the shape the repository
      already recorded as a mistake not to repeat.
    the_shape_of_the_control: >
      THE MIRROR OF nc_g -- chain depth pinned to the literal 8. Correct at
      HEIGHT=8, wrong at HEIGHT=4, so it would FAIL at the scored geometry and
      PASS at the other. Together the pair would give one failing capacity control
      at each legal height and neither geometry would be blind.
    open_question_before_building: >
      IS IT A PLAUSIBLE DESIGN OR ONLY A CONSTRUCTIBLE ONE? nc_g is plausible --
      a submission reading P1 and building for the smaller legal height is a real
      mistake a model makes. Pinning depth to 8 while the port is HEIGHT-wide
      means indexing stages 4..7 of a [3:0] array, which SystemVerilog resolves to
      X rather than an elaboration error, so it CONSTRUCTS. Whether any submission
      would ever write it is a different question, and a control nobody would
      write measures the checker rather than the contract. That is the question to
      settle before building, not after.
    cheaper_alternative_to_weigh_first: >
      A capacity FLOOR at the scored geometry may cover the same ground: assert
      that the design's observed latency at HEIGHT=4 is D*(H-1)+2 = 14
      [SUPERSEDED: +3 = 15] and that it
      is DERIVED rather than constant, by comparing the two geometries' measured
      latencies within one run. That is rule 36's shape -- a firing count rather
      than a control -- and it needs no new plausible-design argument.
    not_built: >
      Scoped on instruction and deliberately not built. Recorded here rather than
      in a note because the gap is live from the moment P2 moved.
  the_prediction_this_refuted: >
    The failure signature -- 80% of violations on met1, mass shorts directly above
    the cells, global route clean, antennas driven to zero -- was read as PIN
    ESCAPE, which is LOCAL, and that predicted ~35,000-40,000 violations at 4x8:
    roughly half of 76,253. The measured answer is ZERO. Halving the array did not
    halve the violations, it eliminated them, which is congestion-like and not
    pin-access-like. The reading was endorsed here and the measurement refutes it.
  rationale: >
    Capped by SYNTHESIS FEASIBILITY, not by the anchor and not by the contract.
    Measured on sky130hd: one redmule_ce is 23,034.59 um^2, and redmule_engine at
    8x8 is 1,631,831.31 um^2. The largest design this repository has ever built is
    d_nw01_axi4_xbar at 2.09 mm^2, so 8x8 at 1.63 mm^2 is inside the proven
    envelope while the catalog's 16x16 would be roughly 5.9 mm^2 -- about 2.8x
    anything built here.
  envelope_correction: >
    "INSIDE THE PROVEN ENVELOPE" ABOVE IS TRUE FOR SYNTHESIS AND UNSUPPORTED FOR
    ROUTING, and the sentence does not say which. Both of 1.63 and 2.09 are yosys
    synth-flatten figures, so the comparison licenses one conclusion: 8x8
    synthesises at a size this repo has synthesised before.
    .
    On the routing axis, counted over all 53 PPA records in runs/: only SIX carry
    a drc field at all, and the largest area with a recorded clean DRC is
    294,555 um^2 -- 0.29 mm^2, d_nw01_second_source own_fmax_9ns. The 2.09 mm^2
    record (d_nw01_axi4_xbar chat_at_9p0) carries NO drc field, so it establishes
    that the flow completed, not that the design routed clean. The one
    d_nw01_axi4_xbar record that is drc=0 is config CUT_ALL_AX at 154,245 um^2.
    .
    Stated as an ABSENCE of evidence, not as a claim that the 2.09 mm^2 runs were
    dirty -- nothing measures that. What follows is that no data point exists
    anywhere between 0.29 mm^2 and 1.63 mm^2. 8x8 is 5.5x over the demonstrated
    routing envelope and 4x8 is still ~2.8x over it, so halving the array does
    not bring it inside; it is a guess that the cliff sits between those two
    points. See MEASUREMENTS.md section 5, and orfs_runs/d_ai01_h4/ for the
    measurement that settles it.
  extrapolation_note: >
    The 8x8 figure is MEASURED, not scaled. Per-element scaling from one
    redmule_ce would have predicted 1.47 mm^2; the real number is 11% higher,
    the difference being row output registers and fanout that do not exist inside
    a lone element. The geometry decision rests on the measured number.
  why_HEIGHT_is_the_parameterised_axis: >
    HEIGHT changes the OBSERVABLE SCHEDULE -- it sets both the chain latency
    D*(H-1)+3 and the per-stage operand skew of spec A3 -- so a design that
    hardcodes one depth cannot pass at the other. WIDTH is pure replication and
    would not discriminate.
  discrimination_evidence:
    measured: true
    reference: PASS at HEIGHT=4, PASS at HEIGHT=8 (3400/3400 cycles each)
    capacity_reduced_control: nc_g_height_blind_depth
    control_result: PASS at HEIGHT=4, FAIL at HEIGHT=8
    numbers:
      HEIGHT_4: {result: PASS, z_kills: 0, status_kills: 0, first_kill: none}
      HEIGHT_8: {result: FAIL, z_kills: 3208, first_z_kill_cycle: 14,
                 status_kills: 3189, first_status_kill_cycle: 13}
    witness: >
      HEIGHT=8, x=1.0 and w=2.0 on every stage, y=+0, field held until settled.
      The reference delivers 0x4C00 (16.0 = 8 * 2.0); nc_g delivers 0x4800
      (8.0 = 4 * 2.0). Hand-checkable, and a real non-equivalence rather than a
      no-op perturbation. Both instances are handed the same eight operand pairs
      -- nc_g's ports are HEIGHT-wide, it simply discards stages 4..7.
    detail: >
      HEIGHT IS LOAD-BEARING, and this is now measured rather than assumed.
      nc_g pins the chain depth to the literal 4 instead of deriving it from
      HEIGHT. At HEIGHT=4 that is the identity and it is bit-for-bit the
      reference; at HEIGHT=8 it computes a four-deep dot product where the
      contract requires eight, and additionally carries the four-deep operand
      skew, so it fails on both z_o and status_o.
      .
      The control passing at the unscored configuration is the evidence, not an
      inconvenience: it is the direct measurement that HEIGHT=4 cannot tell a
      HEIGHT-blind design from a conformant one and HEIGHT=8 can. This is why
      the scored configuration is the larger geometry.

configs:
  - {HEIGHT: 4, WIDTH: 8}
  - {HEIGHT: 8, WIDTH: 8}   # <- scored

vectors:
  files: [vectors/vectors_h4.hex, vectors/vectors_h8.hex]
  counts: {h4: 3400, h8: 3400}
  record_bits: {h4: 1006, h8: 1742}
  captured_by: tb/audit/capture_vectors_tb.sv
  record_note: >
    ONE RECORD IS ONE CYCLE: the whole operand field and control state presented
    at that cycle, followed by z_o and status_o sampled immediately after the same
    edge. The contract is temporal (spec A3), so a record holding only an operand
    triple could not express it. Replay compares at the same cycle indices, so
    neither rig has to model the skew.
  layout_note: >
    tb/fp16_gemm_array_vec.svh is included by BOTH the capture rig and the scoring
    TB. A layout that lived separately in each would present a silent disagreement
    as a DUT mismatch on every vector.
  directed_bands: >
    Operand draws are banded rather than uniform: uniform 16-bit patterns are ~3%
    infinity/NaN and mostly enormous exponents, so an 8-deep chain saturates to
    infinity within a stage or two and stops testing the adder. Band 0 (magnitudes
    around 1) carries the bulk; bands 1-3 drive underflow, overflow and
    subnormals. Ten corner values are planted on a walking (row, stage) schedule
    from cycle 400.
  directed_tail: >
    Cycles 3000-3399 hold two settled configurations that force a SIGNED ZERO onto
    z_o: 3000-3199 collapses a negative tiny result to -0 (A6 sign preservation),
    3200-3399 drives (-0)*(+1.0)+(+0) (A8, which is -0 under roundTowardNegative
    alone). Added because the first vector set delivered no -0 at all. See
    controls/CONTROLS.md.

results:
  measured_against_task_text: 86b7d95729381055
  reference: 2/2   # PASS at both; 3157 scored cycles at H=4, 2937 at H=8
  unscored_cycles: {HEIGHT_4: 243, HEIGHT_8: 463}   # C2 flush + C3 accumulate windows; C4 is per row
  superseded: >
