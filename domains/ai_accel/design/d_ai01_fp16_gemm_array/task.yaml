    measured:
      - {name: nc_a_stuck_output,        z_was: 3399, z_now: 2936, status_was: 0,    status_now: 0}
      - {name: nc_b_extra_pipe_stage,    z_was: 2784, z_now: 2368, status_was: 0,    status_now: 0}
      - {name: nc_c_flush_subnormal,     z_was: 84,   z_now: 80,   status_was: 0,    status_now: 0}
      - {name: nc_d_overflow_always_inf, z_was: 230,  z_now: 167,  status_was: 0,    status_now: 0}
      - {name: nc_e_positive_zero_only,  z_was: 132,  z_now: 132,  status_was: 0,    status_now: 0}
      - {name: nc_f_reversed_chain,      z_was: 3203, z_now: 2746, status_was: 3057, status_now: 2572}
      - {name: nc_g_height_blind_depth,  z_was: 3208, z_now: 2752, status_was: 3189, status_now: 2725}
    nc_e_is_the_confirmation_not_the_exception: >
      nc_e is the ONLY control whose count is unchanged, at exactly 132, and that
      is a prediction this file already made: nc_e_is_why_the_floor_exists
      records that every one of its 132 kills lands at cycle 3031 or later --
