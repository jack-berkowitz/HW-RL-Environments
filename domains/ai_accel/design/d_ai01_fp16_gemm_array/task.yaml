    nc_c at 80 and nc_e at 132 OUT OF 2937 SCORED CYCLES are the useful ones: they
    fire only on the behaviour their clause describes, so passing them is evidence
    about that clause rather than about the harness. nc_d at 167 is the bug a
    plausible submission actually writes -- delivering infinity on every overflow
    is what falls out of reading a general rounding clause without A5's table --
    and it is caught in the random body of the set at cycle 18.
