interface_boundary:
  changed_on: 2026-08-25
  pre_bump_task_text_hash:  2b7c36c5b08e7965
  post_bump_task_text_hash: 2f2c4cd76f582ae1
  intermediate_hash_no_candidate_saw: 2cf1ff4be7bf693a
  one_boundary_not_two: >
    The interface declaration landed first, at 2cf1ff4be7bf693a, and P2's move to
    HEIGHT=4 landed on top of it before any candidate was solicited at the
    intermediate value. Recorded as ONE boundary because that is what a submission
    experiences -- two would imply a solicitation that never happened. The
    intermediate hash is named rather than dropped so the chain has no gap.
  behavioural: PARTLY -- see p2_is_behavioural_for_PPA
  what_changed: >
    THE INTERFACE IS NOW DECLARED. spec/fp16_gemm_array_iface.sv was 492 lines
    of which every one was a comment -- the only design spec in the repository
    shipping no module declaration. V1 stated the ports as a TABLE. 45 lines
    added, none removed; probe/PASTE.md regenerated and byte-identical to the
    spec (30756 bytes each, check_paste_sync 0 of 9 out of sync).
    .
    Checked field by field against V1's table before landing: every width, every
    packed dimension, every direction agrees. No requirement changes. What
    changes is that the declaration is AUTHORITATIVE rather than described -- a
    table and a port list can drift and nothing would report it.
  why_it_mattered: >
    scripts/sim_candidate.sh derives the DUT module by grepping `^module` in the
    spec. It got an empty string, resolved the testbench to tb/_tb.sv and
    refused -- correctly, but the effect was that d_ai01 could not run through
    the scored path at all. That was gap 1 of the four in F88. The runner
    fallback made the task runnable; this makes the defect go away at its source,
    and the fallback's "derived from the TASK DIRECTORY" note is now silent for
    this task.
  parameter_defaults_are_not_normative: >
    HEIGHT=8 WIDTH=8 appear as defaults and CARRY NO CLAIM ABOUT WHAT IS SCORED.
    P2 is the sole authority on the scored configuration; if P2 ever names a
    different geometry, P2 is right and the default is stale.
    .
    THE DEFAULTS ARE PRESENT BECAUSE OMITTING THEM CRASHES THE SYNTHESIS
    FRONTEND, measured rather than assumed. `parameter int unsigned HEIGHT` with
    no default makes yosys `read_slang --top fp16_gemm_array` exit 133 with a
    trace/breakpoint trap and NO ERROR MESSAGE; the same file with `= 8` exits 0
    clean. Reproduced twice through the runner and once directly in the
    container. A submission copying the declaration verbatim would have received
    "slang did not run" instead of a verdict.
    .
    Recorded because the no-defaults form was RECOMMENDED AND AGREED before it
    was tested, on the reasoning that one statement of the scored geometry is
    safer than two. The reasoning was sound and the answer was wrong. The drift
    it worried about is closed by naming which statement governs instead.
  p2_is_behavioural_for_PPA: >
    The interface declaration changes no requirement. P2's move DOES change one:
    which geometry carries the PPA comparison. No CORRECTNESS verdict moves --
    P1 and T3 are untouched and the runner already swept both geometries -- but no
    PPA number measured at HEIGHT=8 is comparable to one measured at HEIGHT=4, and
    d_ai01 has no PPA numbers yet, so nothing is invalidated.

  # ---------------------------------------------------------------------------
  # OUT-OF-PATH OBSERVATION. THIS IS NOT A VERDICT AND MUST NOT BE READ AS ONE.
  # ---------------------------------------------------------------------------
  gemini_out_of_path_observation:
    IS_NOT_A_SCORED_VERDICT: true
    scored_status: TOOLFAIL -- build_status=slang_tool_error, NO correctness verdict
    observation: "2755 z mismatches, 2725 status mismatches over 2937 scored cycles at HEIGHT=8"
    provenance: >
      PRODUCED BY A HAND-BUILT VERILATOR INVOCATION, outside scripts/sim_candidate.sh.
      The scored path will not produce it: TOOLFAIL records no correctness verdict
      and does not fall through to Verilator.
    why_it_is_recorded_this_way: >
      Jack's ruling. A Verilator correctness verdict is NOT recordable as a scored
      verdict when slang has failed -- the scored path defines what counts, and
      admitting an out-of-path number because it happens to exist is how the
      boundary erodes. That is F22's argument and it was mine. But the measurement
      is real and should not disappear: it tells us something about this submission
      that TOOLFAIL alone does not, namely that the design also fails on OUTPUT and
      not only at the frontend.
    verdict_count: >
      d_ai01 is 2 OF 3 MEASURED, not 3 of 3. I reported 3 of 3 and was wrong;
      AGENT-PPA-2381f2fe caught it and was right to refer the policy question
      rather than decide it.

  candidates: >
    RE-SOLICITATION REQUIRED for chat, claude and gemini. The shipped text
    changes, and the hash is what asserts "same question". Nothing is re-scored
    for correctness -- no behaviour required of a submission changes.

version_boundary:
  changed_on: 2026-08-23
  pre_bump_task_text_hash:  9a93e4502979efc9
  post_bump_task_text_hash: 86b7d95729381055
  missed_boundaries:
    note: >
      THREE BOUNDARIES CROSSED THIS FIELD WITHOUT UPDATING IT. Recorded now, in
      order, so the current hash has a traceable predecessor chain rather than a
      gap. All three are repository-wide spec edits confined to the G section --
      diffed clause by clause, no A/L/P/T clause moved -- so they are
      NON-BEHAVIOURAL for correctness and the candidates solicited at 16:28 on
      08-24 are current, not stale.
      .
      The defect is not that the boundaries were wrong. It is that a field
      asserting "this is the question that was asked" went three revisions out of
      date while reading as authoritative, and the only thing that caught it was
      a hand recompute during unrelated work.
    crossed:
      - {commit: f19cd10, at: "2026-08-24 14:54", post: cf2509a6982f29c3,
         what: "grading scheme stated in every prompt, all nine tasks", behavioural: false}
      - {commit: 28803d8, at: "2026-08-24 15:44", post: d030c6c9089dffeb,
         what: "timing slack is a gate, not a compared axis", behavioural: false}
      - {commit: 4045b56, at: "2026-08-24 15:58", post: 2b7c36c5b08e7965,
         what: "Fmax consistency sweep; pinned period declared not-yet-set", behavioural: false}
  what_changed_this_boundary: >
    GRADING CRITERIA ADDED to the shipped contract, as clauses G1-G4. The text
    previously specified WHAT to build and said nothing about how a submission
    would be judged or what it should optimise, leaving every candidate to guess
    at the objective.
    .
    G1 states the order, and that correctness is a GATE rather than a weighting:
    bit-exact at BOTH geometries over the scored cycles, and a failure at either
    yields no PPA number at all. G2 names the three compared axes. G3 states what
    is NOT available to optimise, which for this task is unusual and
    load-bearing -- latency, throughput and the arithmetic are all pinned by L1,
    A3 and A1-A10, so a submission CANNOT buy frequency by changing pipeline
    depth, the lever most designs reach for first. G4 states what is actually
    left: how the fused multiply-add is built, how rows share logic given the
    broadcast weight vector, where state sits inside the fixed delay budget, and
    clock gating.
  non_behavioural: >
    MEASURED, NOT ASSERTED. Only spec/fp16_gemm_array_iface.sv and probe/PASTE.md
    changed; the testbench, vectors, controls and reference shim are byte-identical.
    Re-running at the new hash reproduces every number exactly -- reference 0 z and
    0 status at both geometries, second source 4/10 at HEIGHT=4 and 6/13 at
    HEIGHT=8. So unlike the two earlier boundaries, results DO carry across this
    one: a design conformant before it is still conformant after, and no candidate
    needs re-scoring for correctness. The hash still changes, because the shipped
    text changed and the hash is what asserts "same question".
  earlier_boundaries:
    - {pre: 84950ba1d90be2d8, post: e43648a5afcacc53, what: "A10 pinned, C2 narrowed, T5 added", behavioural: true}
    - {pre: e43648a5afcacc53, post: 9a93e4502979efc9, what: "C3 and C4 narrowed", behavioural: true}
  # The two blocks below are the narratives for the boundaries listed in
  # earlier_boundaries, each written while it was the current one and never
  # renamed. The second was still called `what_changed_this_boundary`, a second
  # copy of the key above it, so on parse the SUPERSEDED narrative replaced the
  # current one. Renamed to name the boundary each describes; no text changed.
  earlier_boundary_2_detail: >
    C3 and C4 narrowed, batched into ONE hash bump. Both are the SAME DEFECT AS
    C2 one level deeper: the contract specifies steady states and does not model
    the in-flight pipeline, so its silence about control TRANSITIONS read as a
    determinism claim it cannot deliver.
    .
    C3 -- the pinned dfb stays as the steady-state rule. Partial sums still in
    flight when accumulate_i changes, in either direction, are UNSCORED for
    D*(HEIGHT-1)+3 enabled ticks (31 at HEIGHT=8, 15 at HEIGHT=4).
    .
    C4 -- "holds" and "resumes from where it stopped" are kept for the row's own
    registers. The relationship between a resumed row's in-flight sums and an
    operand stream that advanced during the freeze is UNSCORED for the same
    window, PER ROW; other rows stay scored throughout.
    .
    Not modelled, deliberately: putting the pipeline into the contract would hand
    every submission a required microarchitecture, which is the freedom this task
    exists to measure.
  earlier_boundary_1_detail: >
    Three clause changes, all of them found by the second source and none of
    them visible to any of the seven negative controls.
    .
    A10 -- flag TIMING is now pinned. The clause said status_o[r][k] reports
    that stage's operation "alone" and said nothing about when. Two readings
    satisfied it, and an independent implementation took the other one and
    disagreed with the reference on ~2900 of 3400 cycles. Pinned to the
    reference's behaviour: every stage reports its own in-flight operation at a
    uniform delay of 2 enabled ticks, NOT aligned with the z_o it contributes
    to. Measured with a four-tick overflow burst per stage at both geometries.
    .
    C2 -- the post-flush refill window is now explicitly UNSCORED, named as
    D*(HEIGHT-1)+3 enabled ticks. The clause previously asserted the refill
    intermediates were contractual because they "follow from A3 with the flushed
    zeros as the starting state". They do not: the reference holds per-stage
    state this contract does not model. A contract defect, narrowed rather than
    modelled -- nothing is scored that the text cannot specify.
    .
    T5 -- ADDED. Elaboration is required under both slang and Verilator, with the
    4000-iteration unroll limit named. Without it a bit-exact submission can
    score full correctness and produce no PPA number at all. Reproduced history,
    not hypothesis: d_dsp03 hit this exact error and carries the same clause, and
    this task's own second source hit it again on the same construct.
  material_to_rule_17: YES
  prior_results:
    status: >
      EVERY RESULT ON THIS TASK PREDATING THE CURRENT HASH WAS MEASURED AGAINST A
      SUPERSEDED TEXT -- 84950ba1d90be2d8 before the first boundary,
      e43648a5afcacc53 before the second. That includes the reference's original
      2/2 at 3400/3400 cycles, every kill count in controls/CONTROLS.md, and the
      nc_g discrimination measurement. All are retained as historical and NONE is
      comparable to a number measured against 9a93e4502979efc9.
    note: >
      The vector sets themselves did NOT change across EITHER boundary -- the
      stimulus and the recorded reference behaviour are byte-identical throughout.
      What changed both times is which cycles are scored.
  candidates_affected: NONE -- no candidate has ever been scored against this task.

scored_configuration:
  HEIGHT: 4
  WIDTH: 8
  moved_from_HEIGHT_8_on: 2026-08-25
  moved_because: >
    HEIGHT=8 DOES NOT ROUTE ON sky130hd. Measured, not estimated: 76,253 to
    83,445 detailed-routing violations across three separate floorplans -- CORE
    UTILIZATION 10 and 30, PLACE_DENSITY 0.50 and 0.35. HEIGHT=4 closes clean at
    0 violations, 710,752 um^2, 33% utilisation. Both at the SAME 50 ns
    constraint, so the comparison is like-for-like and is about the geometry.
  necessary_not_sufficient: >
    50 ns is the most RELAXED constraint this task allows and the pinned period is
    NOT YET SET (spec G1). A failure at 50 ns would have been decisive; this pass
    is NECESSARY AND NOT SUFFICIENT. The pin will be tighter, closure is bought
    with area, and the routed design at the pin will exceed 710,752 um^2 -- it
    must be re-checked before any PPA number publishes from it.
  what_did_NOT_move: >
    P1 still makes HEIGHT legal at 4 AND 8, and T3 still requires a submission to
    hold at BOTH. What moved is which geometry carries the PPA comparison, not
    which geometries a design must implement. The runner sweeps both.
  consequence_for_nc_g_discrimination: >
    THE SCORED GEOMETRY IS NOW THE ONE WHERE nc_g CANNOT DISCRIMINATE, and that is
    recorded rather than left to be discovered. nc_g_height_blind_depth pins the
    chain depth to the literal 4: it PASSES at HEIGHT=4 and FAILS at HEIGHT=8.
    With HEIGHT=4 scored, a run of the SCORED CONFIGURATION ALONE would not catch
    it.
    .
    The task is not weakened, because T3 requires a submission to hold at BOTH
    legal heights and scripts/sim_candidate.sh sweeps both -- correctness is
    scored across the pair, not at the scored geometry. Re-verified after the
    move: reference 2/2, nc_g 1/2 failing at +HH=8.
    .
    WHAT THIS DOES CHANGE is that T3 is now load-bearing for a discrimination it
    was previously redundant with. Anyone running only the scored configuration --
    a PPA-only flow, for instance -- gets no evidence about HEIGHT at all.
  the_prediction_this_refuted: >
    The failure signature -- 80% of violations on met1, mass shorts directly above
    the cells, global route clean, antennas driven to zero -- was read as PIN
    ESCAPE, which is LOCAL, and that predicted ~35,000-40,000 violations at 4x8:
    roughly half of 76,253. The measured answer is ZERO. Halving the array did not
    halve the violations, it eliminated them, which is congestion-like and not
    pin-access-like. The reading was endorsed here and the measurement refutes it.
  rationale: >
    Capped by SYNTHESIS FEASIBILITY, not by the anchor and not by the contract.
    Measured on sky130hd: one redmule_ce is 23,034.59 um^2, and redmule_engine at
    8x8 is 1,631,831.31 um^2. The largest design this repository has ever built is
    d_nw01_axi4_xbar at 2.09 mm^2, so 8x8 at 1.63 mm^2 is inside the proven
    envelope while the catalog's 16x16 would be roughly 5.9 mm^2 -- about 2.8x
    anything built here.
  envelope_correction: >
    "INSIDE THE PROVEN ENVELOPE" ABOVE IS TRUE FOR SYNTHESIS AND UNSUPPORTED FOR
    ROUTING, and the sentence does not say which. Both of 1.63 and 2.09 are yosys
    synth-flatten figures, so the comparison licenses one conclusion: 8x8
    synthesises at a size this repo has synthesised before.
    .
    On the routing axis, counted over all 53 PPA records in runs/: only SIX carry
    a drc field at all, and the largest area with a recorded clean DRC is
    294,555 um^2 -- 0.29 mm^2, d_nw01_second_source own_fmax_9ns. The 2.09 mm^2
    record (d_nw01_axi4_xbar chat_at_9p0) carries NO drc field, so it establishes
    that the flow completed, not that the design routed clean. The one
    d_nw01_axi4_xbar record that is drc=0 is config CUT_ALL_AX at 154,245 um^2.
    .
    Stated as an ABSENCE of evidence, not as a claim that the 2.09 mm^2 runs were
    dirty -- nothing measures that. What follows is that no data point exists
    anywhere between 0.29 mm^2 and 1.63 mm^2. 8x8 is 5.5x over the demonstrated
    routing envelope and 4x8 is still ~2.8x over it, so halving the array does
    not bring it inside; it is a guess that the cliff sits between those two
    points. See MEASUREMENTS.md section 5, and orfs_runs/d_ai01_h4/ for the
    measurement that settles it.
  extrapolation_note: >
    The 8x8 figure is MEASURED, not scaled. Per-element scaling from one
    redmule_ce would have predicted 1.47 mm^2; the real number is 11% higher,
    the difference being row output registers and fanout that do not exist inside
    a lone element. The geometry decision rests on the measured number.
  why_HEIGHT_is_the_parameterised_axis: >
    HEIGHT changes the OBSERVABLE SCHEDULE -- it sets both the chain latency
    D*(H-1)+2 and the per-stage operand skew of spec A3 -- so a design that
    hardcodes one depth cannot pass at the other. WIDTH is pure replication and
    would not discriminate.
  discrimination_evidence:
    measured: true
    reference: PASS at HEIGHT=4, PASS at HEIGHT=8 (3400/3400 cycles each)
    capacity_reduced_control: nc_g_height_blind_depth
    control_result: PASS at HEIGHT=4, FAIL at HEIGHT=8
    numbers:
      HEIGHT_4: {result: PASS, z_kills: 0, status_kills: 0, first_kill: none}
      HEIGHT_8: {result: FAIL, z_kills: 3208, first_z_kill_cycle: 14,
                 status_kills: 3189, first_status_kill_cycle: 13}
    witness: >
      HEIGHT=8, x=1.0 and w=2.0 on every stage, y=+0, field held until settled.
      The reference delivers 0x4C00 (16.0 = 8 * 2.0); nc_g delivers 0x4800
      (8.0 = 4 * 2.0). Hand-checkable, and a real non-equivalence rather than a
      no-op perturbation. Both instances are handed the same eight operand pairs
      -- nc_g's ports are HEIGHT-wide, it simply discards stages 4..7.
    detail: >
      HEIGHT IS LOAD-BEARING, and this is now measured rather than assumed.
      nc_g pins the chain depth to the literal 4 instead of deriving it from
      HEIGHT. At HEIGHT=4 that is the identity and it is bit-for-bit the
      reference; at HEIGHT=8 it computes a four-deep dot product where the
      contract requires eight, and additionally carries the four-deep operand
      skew, so it fails on both z_o and status_o.
      .
      The control passing at the unscored configuration is the evidence, not an
      inconvenience: it is the direct measurement that HEIGHT=4 cannot tell a
      HEIGHT-blind design from a conformant one and HEIGHT=8 can. This is why
      the scored configuration is the larger geometry.

configs:
  - {HEIGHT: 4, WIDTH: 8}
  - {HEIGHT: 8, WIDTH: 8}   # <- scored

vectors:
  files: [vectors/vectors_h4.hex, vectors/vectors_h8.hex]
  counts: {h4: 3400, h8: 3400}
  record_bits: {h4: 1006, h8: 1742}
  captured_by: tb/audit/capture_vectors_tb.sv
  record_note: >
    ONE RECORD IS ONE CYCLE: the whole operand field and control state presented
    at that cycle, followed by z_o and status_o sampled immediately after the same
    edge. The contract is temporal (spec A3), so a record holding only an operand
    triple could not express it. Replay compares at the same cycle indices, so
    neither rig has to model the skew.
  layout_note: >
    tb/fp16_gemm_array_vec.svh is included by BOTH the capture rig and the scoring
    TB. A layout that lived separately in each would present a silent disagreement
    as a DUT mismatch on every vector.
  directed_bands: >
    Operand draws are banded rather than uniform: uniform 16-bit patterns are ~3%
    infinity/NaN and mostly enormous exponents, so an 8-deep chain saturates to
    infinity within a stage or two and stops testing the adder. Band 0 (magnitudes
    around 1) carries the bulk; bands 1-3 drive underflow, overflow and
    subnormals. Ten corner values are planted on a walking (row, stage) schedule
    from cycle 400.
  directed_tail: >
    Cycles 3000-3399 hold two settled configurations that force a SIGNED ZERO onto
    z_o: 3000-3199 collapses a negative tiny result to -0 (A6 sign preservation),
    3200-3399 drives (-0)*(+1.0)+(+0) (A8, which is -0 under roundTowardNegative
    alone). Added because the first vector set delivered no -0 at all. See
    controls/CONTROLS.md.

