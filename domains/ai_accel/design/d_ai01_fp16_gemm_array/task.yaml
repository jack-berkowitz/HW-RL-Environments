title: FP16 weight-broadcast multiply-accumulate array
id: d_ai01
module: fp16_gemm_array
domain: ai_accel
type: design
catalog: TASK_CATALOG.md
procedure: TIER-B

catalog_divergence: >
  THE CATALOG'S PREMISE FOR THIS ROW IS REFUTED, and the divergence is larger
  than a rename. Row d_ai01 reads: `systolic_16x16_dbuf` -- "16x16 array with
  weight double-buffering and accumulator drain overlapping compute. The
  scheduling is the task; the MAC is trivial."
  .
  RedMulE is TWO-LEVEL. redmule_top instantiates redmule_x_buffer,
  redmule_w_buffer, redmule_z_buffer, redmule_engine, redmule_scheduler and
  redmule_streamer as siblings; there is no intermediate module. Verified by
  grepping every instantiation site in refs/redmule/rtl. So the composition the
  row describes -- array plus double-buffering plus drain overlap -- is not
  exposed at ANY shimmable boundary. Reaching it requires either taking all of
  redmule_top (an HWPE memory-mapped accelerator with TCDM master ports, a
  register file and an XIF control interface, which is a different and far
  larger task) or writing a sequencer inside the shim, which would put behaviour
  in the reference and disqualify it the way d_dsp01 was disqualified.
  .
  This task is therefore built at the redmule_engine boundary, and it INVERTS
  the row's last sentence: the scheduling is not reachable, and the MAC is not
  trivial. What is left is a genuinely hard contract -- a chain of binary16
  fused multiply-adds with a contractual operand skew, five rounding modes,
  subnormal support at both ends, and mode-dependent delivered values at the
  range boundaries.
  .
  The row also rates the geometry 16x16. That is capped to 8x8 here on measured
  synthesis area -- see scored_configuration. Note the catalog's own remark at
  line 564 that "ORFS runtime grows a lot. A 16x16 systolic array or a full AXI4
  crossbar is a..." anticipates exactly this.
  .
  I do not own TASK_CATALOG.md. The divergence is recorded here and reported.

manifest_divergence: >
  refs.manifest.yaml lists the redmule entry as `tasks: [ai_v03]`. d_ai01 is not
  named, although TASK_CATALOG.md gives "PULP redmule datapath" as this row's
  reference. The manifest field looks incomplete rather than contradictory.
  Recorded, not edited -- refs.manifest.yaml is not mine.

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/redmule
  sha: 7fa9fbe8a29e8572810ae12b92c19749045ac860
  licence: SHL-0.51
  mode: vendor
  file: refs/redmule/rtl/redmule_engine.sv
  closure: [redmule_row, redmule_ce, redmule_fma, redmule_noncomp,
            fpnew_classifier, fpnew_rounding, lzc, cf_math_pkg, fpnew_pkg,
            redmule_pkg, hci_package, hwpe_stream_package, tc_clk,
            cluster_clk_cells]
  shim: ref/fp16_gemm_array_ref.sv
  shim_top: ref/fp16_gemm_array_top.sv
  shim_note: >
    Parameter binding, rename, struct flatten and enum decode only. FpFormat=FP16,
    Height/Width from the module parameters, NumPipeRegs=3, PipeConfig=DISTRIBUTED,
    op1=FMADD (which clock-gates redmule_ce's stage-2 noncomp unit off entirely,
    so z_output_o is the stage-1 FMA result and nothing else), op_mod=0,
    is_boxed all ones, TagType/AuxType=logic.
    .
    cntrl_engine_t has twelve fields but redmule_engine reads exactly two of them
    -- accumulate and row_clk_gate_en. The other ten are shadowed by dedicated
    top-level ports on the same module. The two live fields are surfaced as
    scalars; the dead ten are driven to their bound values so no field is left X.
  split_note: >
    The shim declares fp16_gemm_array_ref_inner and a separate pass-through top
    declares the contract name. The split exists so the negative controls can wrap
    the reference and perturb one behaviour each without a module-name collision.
  format_mask_note: >
    FpFormat is bound by enum and then CHECKED BY THE WIDTH IT PRODUCES
    (fp_width(FP16) == 16, asserted at elaboration), and confirmed independently
    by measurement: the settled 16x16 trace is the FP16 encoding sequence
    0x4000, 0x4400, ... 0x5000 for 2.0, 4.0, ... 32.0. d_dsp01's FP4 elaboration
    is why the assertion and the measurement both exist -- see F53.
  scope_narrowing: >
    in_valid_i and out_ready_i are bound HIGH and in_ready_o, out_valid_o and
    busy_o are NOT surfaced. Deliberate, with a reason: every measurement the
    contract rests on was taken under that binding, and the handshake protocol is
    characterised only to first order (the interaction of backpressure with chain
    advance was not separated from reg_enable_i). Scoring a port whose protocol
    is not fully characterised is scoring the anchor while the text only appears
    to specify it. MEASUREMENTS.md section 6.

anchor_conformance:
  status: VERIFIED_BEFORE_USE
  method: four measurement probes under tb/audit/, all recorded in MEASUREMENTS.md
  result: >
    The anchor is a conforming IEEE 754-2019 binary16 fused multiply-add.
    Overflow, underflow, subnormal delivery, tininess-without-inexactness,
    exact-zero sign and the three non-finite cases were each measured across all
    five rounding modes and agree with the standard in every case.
  why_this_step_exists: >
    Rule 11 keeps locally written code away from expected values; it says nothing
    about whether the vendored anchor knows the right answer. d_dsp01 satisfied
    rule 11 exactly and its anchor was correctly rounded in no mode but RTZ (F54).
  probe_defects_found:
    - >
      probe_skew_tb's FIRST MODEL WAS WRONG. delay(K) = D*(H-K) produced a uniform
      2-cycle shortfall at every stage. The stage-to-stage spacing came back as
      exactly 4, which is origin-independent and agreed with probe_schedule_tb, so
      the formula was wrong rather than the instrument. Corrected to
      delay(k) = D*(H-1-k)+2 and re-measured: 0 mismatches out of 6 trials at H=4
      and 0 out of 10 at H=8, bias path included.
    - >
      probe_corners_tb's first cut read z=0 for EVERY corner case while the status
      flags varied correctly -- a one-edge-early sample, not an anchor returning
      zero. Fixed by holding the operands stable across several edges.
    - >
      probe_control_tb first reported that flush_i does nothing, because it
      sampled after DEASSERTING flush. A direct cycle-by-cycle trace shows flush
      does clear z_o to 0x0000 while asserted; the chain simply refills within one
      cycle of deassertion.
  note: >
    All three were defects in my instruments, not in the anchor. They are recorded
    because a probe that has never been wrong has usually never been checked.

