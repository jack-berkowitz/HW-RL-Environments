version_boundary:
  changed_on: 2026-08-23
  pre_bump_task_text_hash:  9a93e4502979efc9
  post_bump_task_text_hash: 86b7d95729381055
  missed_boundaries:
    note: >
      THREE BOUNDARIES CROSSED THIS FIELD WITHOUT UPDATING IT. Recorded now, in
