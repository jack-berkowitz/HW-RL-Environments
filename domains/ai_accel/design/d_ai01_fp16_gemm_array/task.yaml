controls_schema_gap:
  field: "expect: PER_CONFIG with passes_at / fails_at"
  status: PROPOSED EXTENSION -- not in contract revision 2
  why: >
    The contract's `expect:` is scalar, pass or fail. FOUR OF THE TWENTY-FIVE
    DESIGN CONTROLS HAVE A CONFIG-DEPENDENT VERDICT BY CONSTRUCTION, because that
    is what a CAPABILITY-REDUCED control is: it is correct at the setting whose
    capability it lacks and wrong at the setting that needs it.
      d_ai01 nc_g_height_blind_depth   PASS at HEIGHT=4,  FAIL at HEIGHT=8
      d_ca03 nc_g_itlb_one_entry       PASS at ITLB=16,   FAIL at ITLB=1
      d_dsp03 nc_b_two_lanes           PASS at WIDTH=32,  FAIL at WIDTH=64
      d_nw03 nc_b_outputs_serialised   FAILS only at S_COUNT=M_COUNT=4
    Declaring any of them `expect: fail` makes the runner report a false mismatch
    on every configuration where the control is CORRECT. Declaring `expect: pass`
    inverts it. Neither is the fact.
  why_it_matters_beyond_bookkeeping: >
    A capability-reduced control's whole evidentiary value is the SPLIT -- it
    passes where the capability is not needed and fails where it is, and that pair
    is what proves the capability is scored. A schema that cannot express the
    split cannot express the evidence.
  sent_to: AGENT-VERIF-A2, for contract revision 3
