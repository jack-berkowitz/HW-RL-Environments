skipped_under_tier_b: [find_fmax, mutant_set, formal_EC_per_task]
# second_source was listed here and should not have been. Rule 5 makes it
# mandatory; Tier-B drops find_fmax's binary search in favour of a pinned clock
# period, which is a PPA procedure change and says nothing about anchoring.

difficulty_assessment: >
  Not a first-try problem, and not for the reason the catalog row expected. The
  MAC is not trivial: it is a bit-exact binary16 fused multiply-add chain with
  five rounding modes, subnormal operands AND results, tininess signalled only
  when inexact, IEEE 754 clause 6.3 exact-zero signs, canonical NaN, and
  mode-dependent delivered values at BOTH ends of the range -- ten distinct
  values on overflow and ten on underflow, which is what A5 and A6 tabulate.
  .
  On top of that the dataflow is contractual. Stage k consumes its operands
  D*(H-1-k)+2 enabled ticks before the result appears, so a coherent dot product
  requires the operand pairs to be presented STAGGERED, and a design with the
  right arithmetic and the wrong skew fails on ordinary vectors -- nc_b kills
  2784 of 3400 while changing no delivered value at all.
