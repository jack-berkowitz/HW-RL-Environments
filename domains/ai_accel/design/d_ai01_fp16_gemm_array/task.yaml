    kill_counts_do_NOT_reproduce: >
      Every count is LOWER, and the cause is a boundary this file already
      declares behavioural. The recorded counts were taken at 54a7745
      (2026-08-23 13:59), BEFORE df82446 narrowed C3 and C4 at 17:12 -- the
      boundary version_boundary lists as `behavioural: true`. Narrowing made the
