     band_freeze_violations: {H4: 88, H8: 176}, z_kills: 0,
     note: "fails the floor ALONE -- zero z mismatches, so its verdict names the floor"}
  scored_path_remeasurement:
    when: 2026-08-25
    why: >
      EVERY NUMBER ABOVE WAS AN AD-HOC RUN. d_ai01 could not execute through the
      scored path at all until this date -- four independent gaps, see F88 -- so
      it has zero sim records and every control verdict, the reference result and
      the nc_g discrimination result were produced by hand-built invocations.
      Re-run through scripts/sim_candidate.sh, both geometries.
    verdicts_reproduce: >
      ALL OF THEM. reference PASS 2/2. nc_a..nc_f FAIL at both geometries.
      nc_g PASS at HEIGHT=4 and FAIL at HEIGHT=8 -- the discrimination result the
      scored geometry rests on, reproduced through the path that will score
