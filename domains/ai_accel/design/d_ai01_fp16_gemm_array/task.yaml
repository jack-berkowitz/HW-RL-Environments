  - {name: nc_b_extra_pipe_stage,    targets: "A3, L1 skew",       z_kills: 2784, status_kills: 0}
  - {name: nc_c_flush_subnormal,     targets: "F1, A6 middle",     z_kills: 84,   status_kills: 0, isolated: true}
  - {name: nc_d_overflow_always_inf, targets: "A5 mode-dependence", z_kills: 230, status_kills: 0, isolated: true}
  - {name: nc_e_positive_zero_only,  targets: "A6 sign, A8",       z_kills: 132,  status_kills: 0, isolated: true}
  - {name: nc_f_reversed_chain,      targets: "A2 ordering",       z_kills: 3203, status_kills: 3057}
  - {name: nc_g_height_blind_depth,  targets: "P1 HEIGHT is load-bearing",
     kind: capacity-reduced, at_HEIGHT_4: PASS, at_HEIGHT_8: FAIL,
