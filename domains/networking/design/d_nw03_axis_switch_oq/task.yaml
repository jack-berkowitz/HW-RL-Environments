title: output-queued AXI-Stream switch
id: d_nw03
module: axis_switch_oq
domain: networking
type: design
catalog: TASK_CATALOG.md
procedure: TIER-B

oracle_class: A
reference:
  refs_lock_repo: alexforencich/verilog-axis
  sha: 48ff7a7e2ef782cf778d47910cf85835c64b1bce
  licence: MIT
  mode: vendor
  file: refs/verilog-axis/rtl/axis_switch.v
  closure: [axis_demux, axis_register, axis_fifo, axis_arb_mux, arbiter, priority_encoder]
  shim: ref/axis_switch_oq_ref.sv
  shim_note: >
    Parameter binding, rename and reset-polarity inversion only. ID/USER tied
    off (the contract carries neither), S_DEST_WIDTH bound equal to
    clog2(M_COUNT) so M_BASE=0 routes tdest as the port index directly, and
    KEEP_ENABLE forced 1 at every width because the anchor's default would
    disable keep propagation at DATA_W=8.
  arbitration_pinned: >
    ARB_TYPE_ROUND_ROBIN=1 is bound EXPLICITLY, not inherited. The catalog
    records that at this anchor family's default arbitration three of four
    backlogged inputs were served zero frames across 406 -- starvation, which
    C3 forbids.

spec: [spec/axis_switch_oq_iface.sv]

scored_configuration:
  S_COUNT: 4
  M_COUNT: 4
  DATA_W: 32
  rationale: >
    Chosen so the capability check can DISCRIMINATE, which is the deciding
    criterion here rather than engineering merit. C1's floor is 2.0 beats/cycle
    and the ceiling at 2x2 is 2.0, so at the small configurations a correct
    design cannot clear the floor and a serialised one cannot be told apart. At
    4x4 the correct design measures 2.40 and the capability-reduced control
    measures 0.81, with the floor between them. DATA_W=32 because at 8 the
    KEEP_W is 1 and R2's partial-final-beat case degenerates.
  discrimination_evidence:
    reference_at_scored: 2.40 beats/cycle
    capability_reduced_control: 0.81 beats/cycle
    floor: 2.0

configs:   # full cross = 8; keep in step with the d_nw03 arm in sim_candidate.sh
  - {S_COUNT: 2, M_COUNT: 2, DATA_W: 8}
  - {S_COUNT: 2, M_COUNT: 2, DATA_W: 32}
  - {S_COUNT: 2, M_COUNT: 4, DATA_W: 8}
  - {S_COUNT: 2, M_COUNT: 4, DATA_W: 32}
  - {S_COUNT: 4, M_COUNT: 2, DATA_W: 8}
  - {S_COUNT: 4, M_COUNT: 2, DATA_W: 32}
  - {S_COUNT: 4, M_COUNT: 4, DATA_W: 8}
  - {S_COUNT: 4, M_COUNT: 4, DATA_W: 32}   # <- scored

results:
  reference: 8/8

negative_controls:
  - name: nc_a_reset_polarity
    kind: synthetic known-bad
    result: 0/8
    failure_reason: "phase 1: input 0 never delivered a frame to output 0"
  - name: nc_b_outputs_serialised
    kind: capability-reduced
    result: 6/8
    isolated: true
    detail: >
      Fails exactly and only the two configurations where C1 is enforced
      (S_COUNT=M_COUNT=4), and fails on C1: 486 beats / 601 cycles against a
      floor of 2.0. Correct on R3, R4, R5, C2 and C3 -- the only thing it lacks
      is the concurrency the port counts claim.
    build_note: >
      Its first version held an output's turn until the frame completed, which
      deadlocked when that output was backpressured and made it fail C2 instead
      of C1 -- a control that trips the wrong check validates neither. Now it
      yields the turn unless a beat is actually transferring; frame atomicity is
      per output port, so yielding mid-frame is safe.

second_source:
  file: tb/axis_switch_oq_alt_ref.sv
  status: PROBE_COMPLETE
  adjudication_rounds_used: 0     # of 2; it passed first run, so nothing to adjudicate
  result: 8/8
  targeted_opposite_choices:
    L2_buffering: STORE-AND-FORWARD against the anchor's cut-through
    L1_arbitration: OLDEST-FIRST against the anchor's round-robin
    L5_ready: gated on valid, which the anchor does not do
  genuinely_different: >
    Verified rather than assumed: at the scored configuration the two measure
    2.40 and 2.57 beats/cycle over the same window, over different cycle counts
    (7940 vs 8183) and different frame mixes. It took the other path and the
    checker accepted both.
  what_it_bought: >
    One spec defect, found BEFORE it was written: L2 permits store-and-forward,
    and a store-and-forward design cannot be built without a bound on frame
    length, which the spec did not state. R6 was added and the harness now
    drives the bound with a coverage floor. Latitude the interface could not
    express -- found by trying to USE the clause, not by reading it.

harness_defects_found:
  - by: the reference itself
    defect: >
      The routing check keyed on frames FULLY ACCEPTED, which forbids
      cut-through; L2 permits it and the anchor does it. Re-keyed onto frames
      STARTED.
  - by: instrumenting a rate that read wrong
    defect: >
      Every per-cycle tally used `x <= x + 1` inside a port loop -- a
      non-blocking assignment evaluated N times against the same old value, so
      the counter capped at ONE PER CYCLE however many ports transferred. A
      switch delivering four beats a cycle measured 0.93, which is exactly what
      a fully serialised design produces, so the C1 check would have PASSED the
      capability-reduced control. Fixed by accumulating in blocking temporaries
      and applying once.
  - by: sweeping all 8 configurations
    defect: >
      C1's floor failed the reference at 2x2, where the ceiling is the floor.
      Now enforced only where it can discriminate, and reported elsewhere with
      an explicit statement that it is not capability evidence.

orfs:
  config: orfs/config.mk
  sdc: orfs/constraint.sdc
  synthesises_at_scored_config_by_default: >
    The shim's parameter defaults ARE S0 -- S_COUNT=4, M_COUNT=4, DATA_W=32 --
    so nothing in config.mk pins the geometry. If a shim default ever drifts
    from `scored_configuration:` above, the PPA number silently stops being the
    scored one. Both must move together.
  closure_note: >
    config.mk names FOUR vendored files: priority_encoder, arbiter,
    axis_register, axis_switch. That is SHORTER than `reference.closure` above,
    which also lists axis_demux, axis_fifo and axis_arb_mux -- those are what
    Verilator's -y search pulled in, not what axis_switch instantiates.
    Verified by running the same read_slang the synthesis gate uses, with
    exactly this list: exit 0, 0 errors.
  synthesis_verified:
    stage: 1_synth only (place-and-route not run -- Agent 1's)
    area_um2: 18410.16
    worst_slack_ns: +5.72
    tns_ns: 0.00
    at_period_ns: 10.0
    reading: >
      The constraint is loose: the post-synthesis critical path is about 4.3 ns
      against a 10 ns period. Left loose deliberately -- place-and-route, clock
      tree and wire delay all spend that margin, and a starting constraint that
      already fails at synthesis tells the flow nothing.

ppa: ABSENT
ppa_note: >
  Agent 1 owns PPA. Tier-B pins a fixed clock period rather than sweeping fmax;
  the period, the resolved-config hash and the task-text hash are Agent 1's to
  record. No find_fmax. The ORFS config above is validated through synthesis
  only -- it builds and meets timing at its starting constraint, so a full run
  will not die on a config error, but no place-and-route number exists yet.

skipped_under_tier_b: [find_fmax, mutant_set, formal_EC_per_task]

scored_metrics:
  # As d_dsp03: names are the EMITTED keys, checked against a run record.
  # beats_delivered against beats_cycles is the throughput this switch achieves;
  # liveness_worst_wait is the longest any input waited, which a design can trade
  # buffering against. Neither is fixed by the specification.
  - {metric: beats_delivered,       label: "beats",    role: capability}
  - {metric: beats_cycles,          label: "cycles"}   # denominator of throughput
  - {metric: liveness_worst_wait,   label: "wait.max"} # stimulus-driven

# =============================================================================
capability_controls:
  stimulus_variation:
    status: CLEAN
    measured: "8 of 8 contract inputs vary"
    tool: scripts/check_stimulus_variation.py
  concurrency:
    control: controls/nc_b_outputs_serialised.sv
    covers: C1
    verdict: "FAIL at 4x4, PASS at 2x2"
    failing_checks: 1
    measured: "aggregate rate 514 beats / 601 cycles = 0.855, against a 2.0 floor"
    reference: "PASS at both, so the floor admits correct hardware (rule 24)"
    polarity: >
      NOT INVERTED. S_COUNT and M_COUNT are real task configurations, so the TASK
      varies and the control passes at the small one and fails at the large. C1
      is deliberately enforced only at 4x4 -- at 2x2 the ceiling IS 2.0 beats per
      cycle, so a 2.0 floor would fail correct hardware, and the rate is reported
      there rather than gated. A pass at the small configuration is not
      capability evidence.
  buffering_ceiling:
    control: controls/nc_h_overbuffered.sv
    covers: B1
    status: ENFORCED
    verdict: "FAIL at 4x4 AND at 2x2, 1 failing check each -- B1 alone"
    finding: F80
    the_transition: >
      THIS IS THE EVIDENCE THE CHECK WORKS, and it is why the control was built
      before the check. Before the ceiling phase existed nc_h PASSED BOTH
      configurations with zero per-step failures; after it, nc_h FAILS both with
      exactly one failing check, and both conforming designs still pass with
      zero. A check never seen to flip a known-bad design is a check nobody has
      tested.
    measurement: >
      d_ca04's capacity phase run as a CEILING rather than a floor: hold every
      output not-ready, offer frames on every input, count beats accepted before
      the design stops accepting. Everything is observed on s_valid/s_ready in
      the INPUT domain, so nothing races and this is not the cross-domain
      occupancy the checker documents as unmeasurable.
    validated_before_gating:
      note: "rule 24 -- the bound was set AFTER measuring known-good answers"
      beats_held_4x4: {reference: 8, second_source: 40, nc_h: 144}
      beats_held_2x2: {reference: 4, second_source: 16, nc_h: 72}
      bound: "16 * M_COUNT -- 64 at 4x4, 32 at 2x2"
      margin: >
        Both conforming designs clear it at both configurations, the tightest
        being the second source at 40 against 64. The control exceeds it by
        2.25x at the tighter configuration. The bound is B1'"'"'S OWN ARITHMETIC --
        2 frames per output, 8 beats per frame by R6 -- and is not fitted to any
        implementation.
    polarity: >
      NO CROSSOVER, unlike every other control here. B1'"'"'s ceiling is a CONSTANT,
      not a parameter, so eight buffers exceeds it at every configuration and the
      verdict is the same at both. The two configurations are run to show the
      result is not a configuration artefact.
    unaffected: "nc_a still fails on delivery (23 checks), nc_b still fails on C1 (1)"

# ---------------------------------------------------------------------------
# CONTROL DECLARATION -- inbox/CONTROL_ENUMERATION.contract.md, revision 2.
# DECLARED, NOT GLOBBED: the directory is where they live, this is what they are.
# `measured_by` is mandatory on this side because most of these verdicts are hand
# runs, and a hand run is a measurement whose instrument was never wired -- the
# defect the contract exists to close. It is stated per control rather than per
# task so a mixed set cannot read as uniform.
# ---------------------------------------------------------------------------
controls:
  - file: controls/nc_a_reset_polarity.sv
    kind: negative
    expect: fail
    clause: any
    measured_by: hand_run
    result: "0/8 -- phase 1: input 0 never delivered a frame to output 0"
  - file: controls/nc_b_outputs_serialised.sv
    kind: negative
    expect: PER_CONFIG            # SCHEMA GAP -- see controls_schema_gap below
    fails_at:  ["S_COUNT=4 M_COUNT=4"]
    passes_at: ["all other configurations"]
    clause: C1
    exclusive: false          # WAS true, and it was never verifiable -- see below
    measured_by: scored_path
    result: >
      0/8 as of 2026-08-25, failing on R1 at every configuration:
      "R1: output 0 withdrew m_valid while the beat was unaccepted". It was
      recorded as 6/8 failing exactly and only where C1 is enforced.
    the_verdict_changed_and_the_control_did_not: >
      NOTHING IN THIS CONTROL MOVED. What changed is that R1's output side is now
      CHECKED. nc_b serialises the outputs by holding an output's turn, and in
      doing so it WITHDRAWS m_valid_o from a beat it had already offered -- a
      genuine R1 violation, present since the control was written, invisible
      because no check could see it.
      .
      SO `exclusive: true` WAS NEVER TRUE. It was UNVERIFIABLE, which is a
      different thing and reads identically. The claim was that this control
      fails on C1 and nothing else; what could be observed was that it failed on
      C1 and nothing else THAT WAS CHECKED.
    the_general_form_worth_carrying: >
      AGENT-VERIF-A2's warning was that a control which PASSES may be inert and
      nothing distinguishes the two. This is its mirror: AN `exclusive` CLAIM IS
      ONLY AS STRONG AS THE SET OF CHECKS THAT EXIST TO VIOLATE. Adding a check
      can retroactively falsify an isolation claim made in good faith, and the
      claim will have read as verified the whole time. Every `exclusive: true` in
      this repository is a claim about the checks that existed when it was
      measured, not about the control.
    what_it_still_shows: >
      Its C1 evidence is unaffected -- 486 beats / 601 cycles against a floor of
      2.0, at the two S_COUNT=M_COUNT=4 configurations where C1 is enforced. It is
      still the control that demonstrates C1 discriminates. It is no longer a
      control that demonstrates C1 discriminates IN ISOLATION.
    action: >
      NOT REPAIRED HERE. Making it R1-clean means changing how it yields the turn,
      which is the same edit whose first attempt made it fail C2 instead of C1 --
      recorded in build_note. A control repaired in haste to restore an isolation
      claim is how the claim became wrong in the first place. Referred.
    note: >
      Its first version held an output's turn until the frame completed, which
      deadlocked under backpressure and made it fail C2 instead of C1. A CONTROL
      THAT TRIPS THE WRONG CHECK VALIDATES NEITHER -- which is assertion 3 in the
      contract, found here before the contract existed.
  - file: controls/nc_r1_evades_antecedent.sv
    kind: suppressing
    expect: fail
    clause: R1
    exclusive: true
    antecedent_counter: r1_hits
    expect_count: 0
    measured_by: scored_path
    result: >
      0/8, and the ONLY distinct failure across all eight configurations is
      "R1 was never exercised -- m_valid_o was never high while m_ready_i was
      low". It does not fail R1's stability check and it does not fail anything
      else.
    note: >
      THE THIRD INSTANCE OF F86, AND THE FIRST FOUND BY THE SWEEP RATHER THAN BY
      ACCIDENT. The sweep flagged R1 as a candidate because its antecedent is
      design-controlled -- m_valid_o is an output -- and predicted a missing
      MIRROR clause. It found a missing CHECK as well: R1's output side was not
      verified at all before this.
      .
      Unlike d_dsp03's L4, which PERMITS the identical construction with a stated
      reason, nothing on this task permits or forbids it. R1 is UNFALSIFIABLE
      here, confirmed by measurement rather than by reading.
      .
      THE MIRROR CLAUSE IS NOT LANDED. It moves the task hash and that is not
      mine to spend; text is prepared and referred. See r1b_proposed below.

  - file: controls/nc_h_overbuffered.sv
    kind: negative
    expect: fail
    clause: B1
    measured_by: hand_run
    result: >
      FAIL at 4x4 and 2x2, 1 check each. It PASSED BOTH before B1 was enforced --
      144 and 72 beats held against a ceiling of 16 per output. The flip from
      PASS/PASS to FAIL/FAIL is what shows B1 acquired force.

controls_schema_gap:
  field: "expect: PER_CONFIG with passes_at / fails_at"
  status: PROPOSED EXTENSION -- not in contract revision 2
  why: >
    The contract's `expect:` is scalar, pass or fail. FOUR OF THE TWENTY-FIVE
    DESIGN CONTROLS HAVE A CONFIG-DEPENDENT VERDICT BY CONSTRUCTION, because that
    is what a CAPABILITY-REDUCED control is: it is correct at the setting whose
    capability it lacks and wrong at the setting that needs it.
      d_ai01 nc_g_height_blind_depth   PASS at HEIGHT=4,  FAIL at HEIGHT=8
      d_ca03 nc_g_itlb_one_entry       PASS at ITLB=16,   FAIL at ITLB=1
      d_dsp03 nc_b_two_lanes           PASS at WIDTH=32,  FAIL at WIDTH=64
      d_nw03 nc_b_outputs_serialised   FAILS only at S_COUNT=M_COUNT=4
    Declaring any of them `expect: fail` makes the runner report a false mismatch
    on every configuration where the control is CORRECT. Declaring `expect: pass`
    inverts it. Neither is the fact.
  why_it_matters_beyond_bookkeeping: >
    A capability-reduced control's whole evidentiary value is the SPLIT -- it
    passes where the capability is not needed and fails where it is, and that pair
    is what proves the capability is scored. A schema that cannot express the
    split cannot express the evidence.
  sent_to: AGENT-VERIF-A2, for contract revision 3

r1b_landed:
  status: LANDED 2026-08-25 -- see handshake_mirror_decision
  task_text_hash_before: 514a316a4889dd72
  task_text_hash_after:  62e627b4957c0e2c
  behavioural: false
  why_not_behavioural: >
    No behaviour required of a submission changes. R1b forbids a construction and
    the reference does not use it -- reference still 8/8 with R1b's check and the
    condition floor both live. The hash moves because the SHIPPED TEXT moves, and
    the hash is what asserts "same question".
  candidates_require_re_solicitation: true
  the_sweep_found_this_one: >
    THE THIRD F86 INSTANCE AND THE FIRST THE SWEEP FOUND RATHER THAN ACCIDENT,
    which is evidence the instrument works and not only that the finding is real.
    d_dsp02's H3 was found by a control that surprised its author; d_ca01's R1 was
    named from a reading and measured afterwards. This one was produced by the
    filter, from the property "the antecedent is design-controlled", and then
    measured.
  and_the_reading_understated_it: >
    The sweep predicted a MISSING MIRROR CLAUSE. It found a MISSING CHECK as well:
    R1's output side was not verified at all -- grepping the testbench for R1,
    "stays asserted" and "held stable" returned nothing -- so a design withdrawing
    an offered beat under backpressure was never caught. Both are now closed: the
    check exists with a gated firing count, and R1b closes the antecedent.
  both_terms_latched_and_the_precedent_is_why: >
    The check latches valid AND ready. Comparing a latched valid against a FRESH
    ready reports a legally accepted beat as a violation, which is exactly how
    d_dsp02's repaired H3 checker failed its own reference the first time it ran.
    Not rediscovered here -- carried across.
  superseded_field: r1b_proposed
  measured_basis: >
    controls/nc_r1_evades_antecedent.sv gates m_valid_o combinationally on
    m_ready_i, is otherwise the reference verbatim, and fails 0/8 on the
    condition floor and nothing else. R1's antecedent is emptied rather than its
    consequent violated, and no clause on this task objects.
  text: |
    R1b. `m_valid_o` MUST NOT depend combinationally on `m_ready_i`. A sink may
         hold `m_ready_i` low indefinitely, and a design that waits for it before
         asserting `m_valid_o` deadlocks against a sink that waits for
         `m_valid_o` before asserting `m_ready_i`.

         R1's stability sentence is otherwise satisfiable by NEVER OFFERING: a
         beat never presented to a stalled sink cannot be withdrawn from one.
         R1 constrains what happens once a beat is offered; R1b is what makes R1
         reachable.
  consistency_with_the_other_two:
    d_dsp02: H1b, landed 2026-08-25
    d_ca01:  R1b, landed 2026-08-25
    d_dsp03: >
      L4 DELIBERATELY PERMITS the identical construction on both sides, with the
      reason stated -- the harness drives neither from the other, and a fully
      combinational unit is conformant. That is a DECISION and not a gap, and it
      means the four tasks are not uniform. Landing R1b here should be decided
      alongside whether d_dsp03's L4 stays as it is.
  cost_if_landed: >
    task_text_hash moves; probe/PASTE.md regenerates; the candidate set for this
    task requires re-solicitation.

# ---------------------------------------------------------------------------
# HANDSHAKE MIRROR DECISION -- taken ACROSS FOUR TASKS AT ONCE, 2026-08-25.
# Recorded identically in all four so a reader of any one sees the whole shape.
# ---------------------------------------------------------------------------
handshake_mirror_decision:
  decided_on: 2026-08-25
  the_question: >
    A stability clause of the form "once valid is asserted it stays asserted
    until the transfer completes" is satisfiable by NEVER OFFERING -- a beat or
    result never presented to a stalled consumer cannot be withdrawn from one. So
    a design may empty the antecedent instead of honouring the consequent. Does
    the contract forbid that, permit it, or say nothing?
  why_it_was_decided_together: >
    SILENCE IS THE ONE STATE THAT IS NOT A DECISION. Before this, d_dsp02 and
    d_ca01 had the gap, d_dsp03 had made the opposite decision deliberately, and
    d_nw03 was simply silent. Deciding task by task would have produced four
    positions that looked like an inconsistency; deciding once produces three
    that forbid it and one that permits it FOR A STATED REASON, which is an
    intentional asymmetry a reader can check.
  outcome:
    d_dsp02: FORBIDS -- clause H1b, landed 2026-08-25
    d_ca01:  FORBIDS -- clause R1b, landed 2026-08-25
    d_nw03:  FORBIDS -- clause R1b, landed 2026-08-25
    d_dsp03: PERMITS -- clause L4, THE DELIBERATE EXCEPTION, unchanged
  d_dsp03_is_the_exception_and_here_is_its_reason: >
    QUOTED RATHER THAN SUMMARISED, because the point is that it was decided and
    not overlooked. d_dsp03's L4 reads:
    .
      "L4. `in_ready_o` MAY DEPEND COMBINATIONALLY ON `in_valid_i`, and
           `out_valid_o` may depend combinationally on `out_ready_i`. The harness
           drives neither from the other, so a design that gates either way
           cannot deadlock against it. A fully combinational unit is conformant."
    .
    The reason is task-specific and sound: d_dsp03's reference binds
    NumPipeRegs=0 and is purely combinational, so requiring a registered valid
    would exclude the reference's own shape. The other three tasks all have
    buffering designs where the deadlock L4 rules out is reachable.
  the_consequence_d_dsp03_carries: >
    STATED SO IT IS NOT REDISCOVERED AS A DEFECT. L4 licenses the construction
    that EMPTIES d_dsp03's own output stability clause, so on that task the
    stability sentence is decorative rather than wrong -- a design gating
    out_valid_o on out_ready_i never has valid high while ready is low, and it is
    CONFORMING. Two coherent resolutions remain open and neither is taken here:
    narrow L4 to the input side, or drop the output stability sentence as
    non-normative. Doing neither leaves a clause that reads as a requirement and
    is not one.
  evidence_base: >
    Every one of the three FORBIDS clauses cites a control that PASSED the
    contract as it stood while driving the clause's firing count to zero:
    nc_h3_evades_antecedent (d_dsp02), nc_r1_evades_antecedent (d_ca01, 0/16),
    nc_r1_evades_antecedent (d_nw03, 0/8). None was declared unfalsifiable by
    reading; F86's own founding instance was, and that is recorded in F86.
  enforceability_caveat: >
    ALL THREE CLAUSES FORBID A COMBINATIONAL DEPENDENCY, which no testbench here
    can observe directly -- it sees valid low and cannot distinguish "gated on
    ready" from "nothing ready yet". The condition floor catches the construction
    but reports it as "the clause was never exercised", not as a violation of the
    mirror clause. Enforceable by inspection and by control, only partially by
    the harness. This is in each task's candidates README where a grader meets it.
