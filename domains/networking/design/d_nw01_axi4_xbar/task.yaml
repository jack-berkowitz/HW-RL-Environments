# =============================================================================
capability_controls:
  stimulus_variation:
    status: CLEAN
    measured: "4 of 5 contract inputs vary; addr_map constant and CORRECT"
    addr_map_note: >
      A frozen input is a defect only when no other varying input can reach the
      clause it governs. addr_map is static configuration, and D2's decode-error
      clause is reached anyway because the ADDRESSES vary -- the testbench drives
      UNMAPPED = 0x8000_0000 deliberately, and mutants mD2 and mD3 are keyed on
      that path. See F72.
    tool: scripts/check_stimulus_variation.py
  outstanding_capacity:
    covers: C1
    status: ENFORCED, and well
    detail: >
      A dedicated capacity phase holds r_ready and b_ready low, lets the slave
      side accept, and counts what each master got in before the crossbar stopped
      accepting. Floor is ceil(MAX_TRANS/2), not MAX_TRANS, and the gap is stated
      tolerance rather than slack: observable capacity depends on pipeline depth
      as well as queue depth, so requiring the full parameter would fail a correct
      crossbar for being less pipelined. Backed by a CAPABILITY-class mutant.
  response_buffering_ceiling:
    control: controls/nc_i_overbuffered_r.sv
    covers: C3 (the ceiling at spec line 177)
    status: NOT ENFORCED
    verdict: "PASSES at MAX_TRANS=8 and MAX_TRANS=2, zero failures"
    finding: F80
    detail: >
      The vendored reference verbatim with a 64-deep FIFO on each master's R
      channel -- sixteen times C3's allowance. Ports full width, every
      transaction routed, ordered and returned to its issuer, per-ID order
      preserved because a FIFO cannot reorder. Nothing in tb/ counts beats held:
      grepping for an occupancy counter finds only a comment inside C1's FLOOR
      about pipeline-depth tolerance.
      .
      THE PREDICTION THAT IT WOULD PASS is in the control's header, written
      before it ran.
      .
      THIS IS F62'S OWN TASK. C3 is the clause written in response to a
      submission here that buffered 2 x 256 x ~40 bits and came out at 14x the
      reference's area. That design is no longer on disk -- chat.sv was
      re-solicited after C3 was added -- but nothing would stop it being
      resubmitted.
    owed: >
      ENFORCEMENT ATTEMPTED AND BLOCKED, not deferred. Four approaches measured;
      see F80 instance 2. The blocker is not C3 and not the design: the slave
      model drops r_valid via a rate counter while a beat is pending, which real
      AXI forbids -- once RVALID is asserted it must hold until RREADY -- and the
      anchor's rr_arb_tree asserts on exactly that assumption. So SUSTAINED
      RESPONSE BACKPRESSURE IS ILLEGAL STIMULUS AGAINST THIS HARNESS.
      .
      A throttled stall at ~1 beat in 8 discriminates cleanly -- reference 0,
      control 36 against a bound of 16, one failing check, isolated -- but the
      assertion trips on a configuration-dependent subset and retuning only moves
      which configuration trips. Reverted rather than landed: tuning a throttle
      until the assertion happens not to fire is fitting to noise.
      .
      A PROTOCOL-CORRECT RESPONDER WAS BUILT AND TESTED, AND IT DOES NOT FIX
      THIS. The R channel was rewritten to mirror the B channel exactly -- a
      presented flag set when a beat is offered, cleared only on handshake, the
      rate counter gating when the NEXT beat is presented. Without a sustained
      stall the reference passes with zero assertions, so the rewrite is sound.
      With a sustained total stall it trips the same rr_arb_tree lock assertion
      at ALL FOUR configurations, worse than the throttled attempt which tripped
      on a subset. Reverted, not landed.
      .
      THE BLOCKER IS NOT PROVEN TO BE THE ANCHOR, AND THAT DISTINCTION IS KEPT
      DELIBERATELY -- encoding an anchor's behaviour as a property of the world
      is the A8 mistake, one task over. Checked: LockIn's own documentation says
      it exists for the not-granted-same-cycle case, so backpressure is its
      designed-for condition; doc/axi_demux.md states no constraint on R
      backpressure or r_valid stability; the nearest open upstream issue is a
      W-FIFO pipelining deadlock, a different mechanism. The stimulus is legal
      and the assertion fires on RELEASE rather than during the stall, with a
      staggered one-master-per-20-cycles release tripping it identically -- so
      the simultaneous-release artefact is ruled out. A genuine anchor defect is
      the reading most consistent with the evidence and it is NOT established.
      Proving it needs a minimal reproducer against axi_demux alone.
      .
      *** SUPERSEDED 2026-08-25. THE REPRODUCER WAS BUILT AND DOES NOT
      REPRODUCE. See l3_c3_state below: the reading above is no longer the one
      most consistent with the evidence, and L3/C3's untestability is OURS TO
      EXPLAIN rather than parked on the anchor. The paragraph is kept because it
      is what was believed and on what grounds. ***
      .
      SO THE BLOCKER IS NOT THE HARNESS. rr_arb_tree at LockIn=1
      carries an ASSUME beside its ASSERT -- "it is disallowed to deassert
      unserved request signals when LockIn is enabled" -- and in
      axi_demux_simple the arbiter's req_i is mst_r_valids with gnt_i the
      downstream r_ready. Those requests are INTERNAL TO THE ANCHOR. Holding
      r_ready low is legal AXI, ready having no stability requirement; it locks
      the arbiter, and something inside the anchor then deasserts an unserved
      request.
      .
      CONSEQUENCE FOR THE TASK: sustained response backpressure is not
      deliverable against this anchor at all. L3 cannot be tested in the
      condition it names, and C3's ceiling cannot be enforced by backpressure.
      Both are now properties of the ANCHOR rather than of the rig, which is a
      different and larger decision than a harness fix -- it bears on whether
      this anchor can carry a clause about response backpressure at all.
      .
      The F81 harness defect is still real and still worth repairing, and the
      rewrite above is the repair. It just buys neither L3 nor C3.
  stimulus_legality:
    status: VIOLATION -- see F81
    where: "tb/axi4_xbar_tb.sv:299 and tb/axi4_xbar_liveness_tb.sv:135"
    what: >
      slv_resp[s].r_valid = (s_rbeats[s] != 0) && (s_rdelay[s] == 0). r_valid
      DROPS while a beat is still pending, which AXI forbids and which this
      task's own H3 requires of submissions -- "a crossbar output holding valid
      with ready low must keep valid high". The harness breaks the rule it
      imposes.
    consequence: >
      The anchor's rr_arb_tree asserts that a locked decision stays stable while
      its output is not ready, so sustained response backpressure is ILLEGAL
      STIMULUS against this harness and the assertion reports the harness's
      defect in the design's name. L3 -- liveness under RESPONSE BACKPRESSURE --
      has therefore never been tested in the condition it names, only at ~25%
      random stall. C3's ceiling check is blocked behind the same defect.
    still_valid: >
      nc_i_overbuffered_r's pass was measured on runs that completed without
      protocol error, so F80 instance 2 stands: C3 is unchecked. What is blocked
      is the fix, not the finding.

  spec_defect:
    issue: "two clauses numbered C3"
    where: "spec/axi4_xbar_iface.sv:177 (buffering ceiling) and :216 (holds at every combination)"
    consequence: >
      A duplicate identifier makes "fails C3" ambiguous in exactly the place a
      submission needs precision. Reported, not renumbered -- renumbering moves
      task_text_hash and belongs in a deliberate boundary.
    rides: >
      THE HARNESS-REWORK BOUNDARY, not a bump of its own. The C3 enforcement
      bump it was going to ride did not happen, so it waits for the
      protocol-correct slave responder that unblocks L3 and C3 together.
    verified_safe_to_renumber: >
      RECORDED SO IT DOES NOT HAVE TO BE RE-DERIVED. Every C3 reference in the
      tree points at the CEILING at line 177, none at line 216: spec lines 44,
      317 and 334; task.yaml under response_buffering_ceiling; and the whole
      header of controls/nc_i_overbuffered_r.sv. So renaming LINE 216 to C4
      breaks nothing. Do not renumber the ceiling instead -- and leave C1 and C2
      alone, they carry 44 and 30 references respectively while C3 carries 17.
      Line 258's "C1-C3" range becomes "C1-C4" in the same edit.
    position_is_deliberate: >
      The ceiling sits between C1 and C2 on purpose, not by accident of
      numbering: its text contrasts with C1 directly -- "C1 says how much the
      design must be able to do at once; this says how much it may SPEND doing
      it." Keep the position when renumbering.

# ---------------------------------------------------------------------------
# CONTROL DECLARATION -- inbox/CONTROL_ENUMERATION.contract.md, revision 2.
# DECLARED, NOT GLOBBED. `measured_by` is mandatory on this side because most of
# these verdicts are hand runs, and a hand run is a measurement whose instrument
# was never wired -- the defect the contract exists to close.
# ---------------------------------------------------------------------------
controls:
  - file: controls/nc_i_overbuffered_r.sv
    kind: negative
    expect: fail
    clause: C3
    measured_by: scored_path
    expectation_is_currently_violated: true
    liveness: MEASURED -- peak_r_occupancy = 64 over 4 masters, C3's ceiling is 4
    liveness_note: >
      A CONTROL THAT PASSES MAY BE INERT, and this was the only control in the
      design set that never failed anywhere -- so its pass was the only one whose
      meaning depended entirely on the control doing what its name claims. If the
      64-deep queue had never exceeded C3's ceiling it would have passed for the
      same reason a CONFORMING design passes, and "C3 is unenforced" would have
      rested on nothing.
      .
      Measured rather than assumed: the queue FILLS TO 64, sixteen times the
      ceiling, and the run still passes. The finding stands and now stands on a
      number. AGENT-VERIF-A2's warning, from two v_ca06 perturbations whose R
      channel had never been slow because a double drive left the gate connected
      to nothing -- both passed every run for as long as they existed.
    why_the_other_24_are_not_at_this_risk: >
      An inert control is invisible only where it PASSES. Every other control in
      the design set either FAILS somewhere -- which is proof it is live -- or is
      an axis control carrying a measured ratio, which is the same proof by
      another route: nc_b_serial_response's 2.58x cycles and nc_c_bloat_storage's
      +4096 flops are liveness evidence, not just axis evidence.
    it_had_never_run_through_the_scored_path: >
      SEPARATELY AND WORSE: check_transport.py rejected this control outright,
      because a COMMENT in it named the scoring testbench by filename and the
      scanner matches that token in comments exactly as in code. So the recorded
      verdict was not merely a hand run -- the scored path REFUSED the file. The
      comment is reworded and it now runs: 16/16, sixteen configurations, not the
      "both MAX_TRANS configs" the old record claimed.
    result: >
      IT PASSES, AND THAT IS THE FINDING. The reference verbatim plus a 64-deep R
      FIFO per master -- far beyond C3's ceiling of 4 R beats per master port --
      and it passes BOTH MAX_TRANS configurations. C3 IS NOT ENFORCED.
    note: >
      DECLARED expect: fail BECAUSE THAT IS WHAT THE CONTRACT REQUIRES, not what
      the harness does. A runner reading this will report a mismatch on every run,
      and it should: the mismatch IS the open defect. Silencing it by declaring
      expect: pass would record the gap as intended behaviour, which is how an
      unenforced clause becomes a permanent one.
      .
      This is the only control in the design set whose declaration and whose
      measurement disagree, and the disagreement is deliberate.
