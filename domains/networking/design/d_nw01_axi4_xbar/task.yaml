title: AXI4 crossbar
id: d_nw01
module: axi4_xbar
domain: networking
type: design
catalog: TASK_CATALOG.md

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/axi
  sha: 4da15979747f326bde2f9869c64e587ce599772c
  licence: SHL-0.51
  mode: vendor
  file: refs/axi/src/axi_xbar.sv
  shim: ref/axi4_xbar_ref.sv
  shim_note: >
    Type binding plus struct pack/unpack. axi_xbar takes 14 type parameters plus
    a struct Cfg and an address map -- the shape that blocked ai_v01 -- and it
    bridges cleanly. Verified at all four geometries. The one non-trivial mapping
