    fmax_bracket_ns: [8.625, 9.0]      # 0.375 wide, within the 0.5 resolution
    fmax_record: fmax_results/d_nw01_ss_fmax.json
    # RECORDED at both periods; elasticity computed from records only.
    area_um2_at_own_fmax: 294555      # RECORDED, wns +0.00366, DRC 0
    power_w_at_own_fmax: 4.27e-02     # RECORDED
    area_um2_at_12ns: 272415          # RECORDED, wns +0.46, DRC 0
    power_w_at_12ns: 3.04e-02         # RECORDED
    elasticity_closing_range_pct: 8.1
    elasticity_note: >
      THE FIRST ELASTICITY FIGURE IN THIS PROJECT COMPUTED FROM TWO RECORDED,
      GATED RUNS. Both endpoints carry run records and both passed their own
