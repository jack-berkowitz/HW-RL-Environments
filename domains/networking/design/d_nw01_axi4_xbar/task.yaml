title: AXI4 crossbar
id: d_nw01
module: axi4_xbar
domain: networking
type: design
catalog: TASK_CATALOG.md

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/axi
  sha: 4da15979747f326bde2f9869c64e587ce599772c
  licence: SHL-0.51
  mode: vendor
  file: refs/axi/src/axi_xbar.sv
  shim: ref/axi4_xbar_ref.sv
  shim_note: >
    Type binding plus struct pack/unpack. axi_xbar takes 14 type parameters plus
    a struct Cfg and an address map -- the shape that blocked ai_v01 -- and it
    bridges cleanly. Verified at all four geometries. The one non-trivial mapping
    is the widened id field, resized because the spec fixes it at SLV_ID_W+2
    while upstream computes SLV_ID_W+clog2(NoSlvPorts).

spec: [spec/axi4_xbar_iface.sv, spec/axi4_xbar_pkg.sv]

configs:
  # NUM_MST x NUM_SLV x MAX_TRANS x MAX_BURST_LEN = 16
  - {NUM_MST: 2, NUM_SLV: 2, MAX_TRANS: 2, MAX_BURST_LEN: 3}
  - {NUM_MST: 2, NUM_SLV: 2, MAX_TRANS: 2, MAX_BURST_LEN: 255}
  - {NUM_MST: 2, NUM_SLV: 2, MAX_TRANS: 8, MAX_BURST_LEN: 3}
  - {NUM_MST: 2, NUM_SLV: 2, MAX_TRANS: 8, MAX_BURST_LEN: 255}
  - {NUM_MST: 2, NUM_SLV: 4, MAX_TRANS: 2, MAX_BURST_LEN: 3}
  - {NUM_MST: 2, NUM_SLV: 4, MAX_TRANS: 2, MAX_BURST_LEN: 255}
  - {NUM_MST: 2, NUM_SLV: 4, MAX_TRANS: 8, MAX_BURST_LEN: 3}
  - {NUM_MST: 2, NUM_SLV: 4, MAX_TRANS: 8, MAX_BURST_LEN: 255}
  - {NUM_MST: 4, NUM_SLV: 2, MAX_TRANS: 2, MAX_BURST_LEN: 3}
  - {NUM_MST: 4, NUM_SLV: 2, MAX_TRANS: 2, MAX_BURST_LEN: 255}
  - {NUM_MST: 4, NUM_SLV: 2, MAX_TRANS: 8, MAX_BURST_LEN: 3}
  - {NUM_MST: 4, NUM_SLV: 2, MAX_TRANS: 8, MAX_BURST_LEN: 255}
  - {NUM_MST: 4, NUM_SLV: 4, MAX_TRANS: 2, MAX_BURST_LEN: 3}
  - {NUM_MST: 4, NUM_SLV: 4, MAX_TRANS: 2, MAX_BURST_LEN: 255}
  - {NUM_MST: 4, NUM_SLV: 4, MAX_TRANS: 8, MAX_BURST_LEN: 3}
  - {NUM_MST: 4, NUM_SLV: 4, MAX_TRANS: 8, MAX_BURST_LEN: 255}

capability_blind_spot: >
  NO CAPABILITY CHECK DISCRIMINATES AT MAX_TRANS=2. C1's floor is
  ceil(MAX_TRANS/2)=1 there and cannot be raised -- the NO_LATENCY anchor, a
  correct crossbar, also delivers exactly 1 -- and C2 is blind at that depth
  too. The capability mutant mX1 survives all eight MAX_TRANS=2 configs. Those
  configs still bind the whole data contract, liveness and decode behaviour, but
  A PASS AT MAX_TRANS=2 IS NOT CAPABILITY EVIDENCE. Adding MAX_TRANS=4 is the
  route to low-depth discrimination; raising the floor is not available.

illegal_configs: >
  NUM_MST > 4 is a HARD CAP -- the widened id field supplies exactly 2
  master-index bits, so at 8 masters two would share an index and their
  responses would misroute as an apparent ordering bug. Enforced by an
  elaboration-time $error in the shim and by the checker's parameter guard.
  NUM_SLV outside {2,4} and MAX_TRANS outside {2,8} are also illegal.

sim_timeout_s: 900
simulators_verified: [verilator-5.046]
# VERILATOR ONLY -- do not claim dual-simulator coverage for this task.
# tb/axi4_xbar_tb.sv uses `automatic` inside procedural blocks, which Icarus
# rejects outright ("sorry: Overriding the default variable lifetime is not yet
# supported"). This is not a regression from the capability audit: the
# pre-audit checker fails identically. The reference additionally depends on
# vendored axi/common_cells sources that use `type` parameters, which Icarus
# also cannot parse.
simulators_unsupported: [icarus-13.0]

second_source: true
second_source_file: tb/audit/axi4_xbar_second_source.sv
second_source_result: 16/16 on the tightened spec
second_source_differences:
  - one flat routing matrix, not a per-master demux + per-slave mux hierarchy
  - rotating-priority mask arbiter written out, not rr_arb_tree
  - flat per-(master,ID) counters, not id_queue structures
  - NO channel registers, so exactly MAX_TRANS observable outstanding rather
    than the anchor's MAX_TRANS+1
second_source_note: >
  A FALSIFIER, NOT AN ORACLE -- its only job is to fail, and if it fails the
  checker is over-constrained. It earned its place twice: the exactly-MAX_TRANS
  capacity is the number that would have exposed C1 as pinned to the anchor's
  buffering, and it scored 218 cross-ID reorderings at MAX_TRANS=2 where the
  vendored reference scores 0, which is what proved the reordering coverage
  floor was gating a legal design choice rather than measuring stimulus.

negative_controls:
  liveness:
    procedure: FINDINGS.md standing rules
    correct_reference: PASS, neither check fires
    deadlock_mutant: mL1 -> LM_STALL fires
    starvation_mutant: mL2 -> LM_STARVE fires, LM_STALL does NOT
    slow_but_fair: SLOW_SLAVE 0/5/20 all PASS, throughput drops 14x, monitor silent
  ordering:
    correct_reference: PASS with 2283 cross-ID switches
    reorder_mutant: mD1 -> killed by the per-(master,ID) comparison

mutants:
  # "witness" records HOW non-equivalence was demonstrated. Witnessing through
  # the checker -- it passes the reference and fails the mutant under identical
  # stimulus -- is NOT weaker than a direct diff; it is the same proof observed
  # through the checker. The differential harness cannot cover mutants of a
  # SHARED VENDORED MODULE, since both instances resolve to the same file.
  #
  # DIFF RATE IS DEMOTED and deliberately absent from this table. It rated the
  # CAPABILITY mutant (100%) and a crude one identically, and rated a killable
  # mutant at 0%. See FINDINGS.md. Mutant quality is a posterior and is deferred
  # to the cross-model run.
  - {id: mCAP1, class: CAPABILITY,           kill: "C1 capacity, 4 checks, nothing else", witness: "differential, cycle 0"}
  - {id: mX1,   class: capacity-mixed-id,    kill: "C1 capacity (MAX_TRANS=8 only)",      witness: "differential, cycle 0"}
  - {id: mC2,   class: concurrency,          kill: "C2, at exactly 100% speedup",         witness: "checker"}
  - {id: mL1,   class: liveness-deadlock,    kill: "LM_STALL",                            witness: "checker"}
  - {id: mL2,   class: liveness-starvation,  kill: "LM_STARVE, not LM_STALL",             witness: "checker"}
  - {id: mD1,   class: ordering-per-id,      kill: "per-(master,ID) data mismatch",       witness: "checker"}
  - {id: mD2,   class: decode-beatcount,     kill: "RLAST on wrong beat",                 witness: "checker"}
  - {id: mD3,   class: decode-liveness,      kill: "LM_STALL -- data bug caught by liveness", witness: "checker"}

capability_mutant_note: >
  mCAP1 is not hand-written. It is a real model submission recovered from git
  6337d3f that passed EVERY correctness configuration of the checker as it then
  stood -- right data, right order, right beat counts, no deadlock, no
  starvation -- while carrying one eighth of the required capacity and half the
  aggregate throughput. MAX_TRANS appears exactly once in its 732 lines: the
  parameter declaration. It is why the CAPABILITY class exists.

# RULE 18 -- ONE SCORED CONFIGURATION. The two-point envelope is withdrawn.
scored_configuration:
  platform: sky130hd
  geometry: {NUM_MST: 2, NUM_SLV: 2}
  LATENCY_MODE: CUT_ALL_AX
  # MAX_TRANS and MAX_BURST_LEN were NOT pinned here, and rule 18 requires the
  # scored configuration to identify ONE measurement. Without them, four of the
  # sixteen correctness configs match, and the capability metrics differ by a
  # factor of four across them -- so "the scored configuration" did not name a
  # metric row at all. Found while building the reader-facing table.
  MAX_TRANS: 8
  MAX_BURST_LEN: 255

  # ---- F49 AMENDMENT: DOES THE SCORED POINT DISCRIMINATE? MEASURED. --------
  # Rule 18 as amended requires that the scored configuration be shown to
  # discriminate, not merely chosen for engineering reasons. `capability_blind_spot`
  # above records that MAX_TRANS=2 does not. Nobody had asked the question at 8.
  #
  # Measured 2026-08-19 through the UNMODIFIED checker, at the scored geometry
  # NUM_MST=2 NUM_SLV=2 MAX_BURST_LEN=255:
  #
  #   design                        MT=2  outstd  verdict   MT=8  outstd  verdict
  #   reference (CUT_ALL_AX)               3      PASS             27     PASS
  #   second source (correct)              2      PASS              8     PASS
  #   mCAP1 (one outstanding per master)   1      PASS              1     FAIL
  #   mX1  (no cross-ID interleaving)      1      PASS              1     FAIL
  #
  # AT MAX_TRANS=2 EVERYTHING PASSES -- confirming the blind spot directly rather
  # than inheriting it. AT MAX_TRANS=8 BOTH capability mutants are killed and both
  # correct designs pass. The scored point discriminates.
  #
  # AND IT DISCRIMINATES ON THE RIGHT AXIS, which is the part F13 makes
  # mandatory to check. Both mutants die on C1, the CAPACITY floor:
  #   "master 0 accepted only 1 outstanding reads with no response drained;
  #    floor is 4 for MAX_TRANS=8 (C1)"
  # Neither dies on reordering. The reordering metric still prints
  # `cross_id_reorderings=0 (DUT choice -- reported, never gated)`. F13 removed a
  # reordering floor because reordering is an optimisation on an axis the
  # contract never named, and the vendored reference legitimately declines to
  # reorder at low depth. That floor is not reintroduced here, and the
  # discrimination does not depend on it.
  capability_discrimination:
    scored_setting_discriminates: true
    scored_setting: {MAX_TRANS: 8, MAX_BURST_LEN: 255, NUM_MST: 2, NUM_SLV: 2}
    non_discriminating_setting: 2
    discriminating_clause: C1 (outstanding-capacity floor, ceil(MAX_TRANS/2)=4)
    mutants_killed_at_scored_point: [mCAP1_one_outstanding_per_master, mX1_no_cross_id_interleaving]
    reordering_gated: false      # F13 -- reported as a DUT choice, never gated
    measured: 2026-08-19, unmodified checker
  metric_config_rationale: >
    MAX_TRANS=8 because this task's own capability_blind_spot note records that
    NO capability check discriminates at MAX_TRANS=2 -- C1's floor is
    ceil(2/2)=1 there, which a correct NO_LATENCY crossbar also delivers, and
    the capability mutant mX1 survives every MAX_TRANS=2 config. Scoring
    capability at the depth where capability is invisible would measure nothing.
    MAX_BURST_LEN=255 because aggregate throughput is what long bursts exercise;
    at 3 the per-burst overhead dominates and the measurement is about the
    handshake rather than the datapath.
  rationale: >
    A deployed AXI crossbar registers its address channels. The AW/AR paths run
    through address decode and arbitration into every slave port, and leaving
    them uncut is what makes a crossbar the critical path of an SoC -- cutting
    them is standard practice, not an optimisation. NO_LATENCY is a
    minimum-area corner used for studies, not a configuration anyone ships.

    It is also the faster of the two by a wide margin (190.48 vs 126.98 MHz),
    so it closes with margin at periods a plausible alternative can also hit,
    and it is the configuration that exercises the buffering the task is
    partly about.

    NOT chosen because the harness defaulted to it. That default was recorded
    in this file as "only because the harness and history use it", which is
    convenience and was not a rationale; this is.
  authority: >
    AMBA AXI does not mandate channel registers, so this is a DESIGN DECISION
    recorded as such (rule 15), on the reasoning above.

scored_metrics:
  # Names are the EMITTED keys, verified against a run record. The first draft
  # named `outstanding_master`, which the checker never emits -- it emits one
  # key PER MASTER. A metric named here that no run produces reports ABSENT,
  # which is how that draft was caught.
  - {metric: outstanding_master0,           label: "outstd0", role: capability}
  - {metric: disjoint_one_pair,             label: "1pair", role: capability}
  - {metric: disjoint_two_pairs,            label: "2pair", role: capability}
  - {metric: aggregate_bursts_per_1000cyc,  label: "agg/1k", role: capability}
  - {metric: scored_beats_per_1000cyc,      label: "beat/1k"}

scored_metrics_gap: >
  THE CONCURRENCY RATIO IS NOT EMITTED. Both of its terms are --
  disjoint_two_pairs and disjoint_one_pair -- and C2 computes the ratio
  internally to gate on it, but the ratio itself never reaches a METRIC line.
  Reported here as a gap rather than derived in the collector: deriving it would
  put a second, independent implementation of C2's arithmetic in the reporting
  path, and the two could disagree without anything noticing.

scored_point:
  config: CUT_ALL_AX
  fmax_mhz: 190.48
  fmax_period_ns: 5.25
  fmax_converged: true
  fmax_bracket_ns: [4.875, 5.25]
  area_um2_at_own_fmax: 154245      # RECORDED + validated, rebuild of 2026-08-16
  power_w_at_own_fmax: 8.75e-02     # RECORDED
  wns_ns_at_own_fmax: 0.04          # RECORDED
  note: >
    THESE NUMBERS SURVIVE THE CHANGE UNALTERED. They were measured at
    CUT_ALL_AX, which is now the scored configuration, so nothing needs
    rebuilding or relabelling.

historical_not_a_baseline:
  # NO LONGER A BASELINE POINT. Retained as record only. MUST NOT appear in any
  # comparison -- it is a different configuration from the scored one, and
  # subtracting across configurations without naming the axis is F24.
  - config: NO_LATENCY
    fmax_mhz: 126.98
    fmax_period_ns: 7.875
    area_um2_at_own_fmax: 100277    # provisional, corroborated
    status: HISTORICAL
    why_retained: >
      It is the measurement that showed the spec left latency mode free, and
      the capability audit reasoned from it -- C1's floor of ceil(MAX_TRANS/2)
      exists because the NO_LATENCY anchor delivers MAX_TRANS-1. Deleting it
      would remove the evidence for a normative check.

ppa_internal_control:
  what: second source, tb/audit/axi4_xbar_second_source.sv
  authored_by: this project
  role: over-constraint control
  status: PENDING -- Fmax sweep running
  is_baseline: false
  never_use_for: candidate scoring, dominance counts, Pareto claims
  why_separate: >
    The second source is OURS, and it is only as good as our engineering. If it
    joined the baseline, candidates would be judged partly against our own
    implementation quality -- exactly the criticism we would level at anyone
    using a self-authored oracle. It cuts both ways: a weak second source would
    flatter every candidate, a strong one would penalise them, and in neither
    case would the number be about the candidate.

    Plotted as a distinctly labelled third point, never as an envelope member.
    If it lands INSIDE the envelope that is worth saying -- confirmation the
    contract is achievable by more than one design. If it lands OUTSIDE on some
    axis that is interesting and gets recorded, but IT DOES NOT MOVE THE BAR.

    Structural rather than a note, for the same reason the run records are
    immutable: if two things can be confused, eventually they will be.

