id: v_nw01
module: arp_engine
domain: networking
type: verification
catalog: TASK_CATALOG.md
tier: B

oracle_class: A
reference:
  refs_lock_repo: alexforencich/verilog-ethernet
  licence: MIT
  mode: vendor
  file: refs/verilog-ethernet/rtl/arp.v
  closure: [refs/verilog-ethernet/rtl/arp_cache.v, refs/verilog-ethernet/rtl/arp_eth_rx.v,
            refs/verilog-ethernet/rtl/arp_eth_tx.v, refs/verilog-ethernet/rtl/lfsr.v]
  golden: dut/arp_engine.sv
  note: >
    SHIPS NO RTL. The task ships spec/arp_engine_iface.sv (port map) and
    spec/arp_engine_spec.md only. dut/ holds the anchor VERBATIM plus a Class A
    port shim, used for scoring and never given to a submission. The anchor
    copies keep their upstream MIT headers unaltered, and are vendored under .sv
    names because the harness globs dut/*.sv -- a .v file would be silently left
    out of the compile.
  provenance_caveat: >
    The files are present at the paths refs.manifest.yaml names, in a repo
    refs.lock pins. Their CONTENTS have not been verified against upstream at
    that SHA -- that needs network, egress is closed. Attests local state only.

harness:
  golden_top: arp_engine
  tb_module: arp_engine_tb
  conformant_prefix: ae_c
  mutant_prefix: ae_m
  golden_file: dut/arp_engine.sv
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  sim_timeout_s: 120

spec: [spec/arp_engine_spec.md, spec/arp_engine_iface.sv]

scored_configuration:
  pinned_inside_the_shim:
    DATA_WIDTH: 8
    CACHE_ADDR_WIDTH: 2          # 4 entries
    REQUEST_RETRY_COUNT: 4
    REQUEST_RETRY_INTERVAL: 64
    REQUEST_TIMEOUT: 256
  rationale: >
    THE TIMERS ARE PINNED SMALL AND THAT IS THE POINT. At the anchor's defaults
    a retry interval is 250 million cycles and a timeout 3.75 billion; neither
    boundary is reachable in simulation, so neither could be stated as a
    checkable bound and the retry and timeout clauses would be untestable.
    Four cache entries make displacement reachable -- at the anchor's default of
    512 a testbench could never fill it. Eight-bit data keeps an ARP frame 28
    single-byte beats, so the frame format is checkable byte by byte.

second_dut:
  status: WIRED
  file: dut2/arp_engine_alt.sv
  note: >
    The SAME artefact as the policy-divergent perturbation of Tier-B step 5c,
    generated from it so the two cannot drift. It does NOT instantiate the
    golden. It shares the anchor's frame serialiser and deserialiser, which are
    mechanical byte packing that clause F fixes completely and which carry none
    of the contract's substance -- stated plainly rather than claimed as full
    independence. The protocol engine, the cache and the retry logic are its own.
  differences:
    - "cache policy (clause L1): fully associative with round-robin replacement,
       against the golden's direct-mapped hash. A different set of older entries
       survives an insert."
    - "error payload (clause L2): drives a recognisable pattern on resp_mac_o when
       resp_error_o is high; the golden leaves whatever it last held."
    - "timing (clause L3): a cache hit is answered the cycle after the lookup, and
       retries go out on a different phase inside the window Q4 allows."
  nonequivalence_witness: >
    Retries are spaced 70 cycles on the alt against the golden's 65, and a cache
    hit is answered a different number of cycles after acceptance. Both sit
    inside the windows Q4 and X3 fix, so both are legal and observably different.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpremised_reliance: must PASS the policy-divergent perturbation and dut2
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10
  reference_ceiling_licensed_by: >
    Observed run of scripts/sim_verification.sh on 2026-08-23: golden PASS,
    gate-mutant rejected, all ten guarded mutants killed. The previous value
    8 of 8 was the OLD total-mutant set's ceiling and survived the rebuild.

conformant_perturbations:
  - id: ae_c1_assoc_cache_rr
    licence: "L1, L2 and L3"
    kind: POLICY-DIVERGENT, Tier-B step 5c
    change: an independent protocol engine and cache; shares only the frame codec
    reference_tb_verdict: PASS
  policy_independence: >
    All ten guarded defects re-derived on the policy-divergent engine
    (mutants/policy/) -- a fully associative round-robin cache instead of the
    anchor's direct-mapped hash, and different timing inside the windows Q4 and
    Q5 allow -- and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    RULE 24: licensed by an observed run of
    mutants/check_policy_independence.sh on 2026-08-23 (22 lines "as expected",
    "OK: every defect is caught on BOTH bases"). The previous policy set was
    STALE -- eight files under the old total-mutant names, left behind when the
    guarded set replaced them. It was regenerated, not re-labelled.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a wrong behaviour paired with a rare
    predicate over contract-level state, so it is caught only by a testbench
    that CONSTRUCTS the named configuration and is still checking when it
    arrives. A total defect fires on the first transaction of its class and
    measures coverage rather than checking.
  guards_are_contract_level: >
    Lookups accepted, lookups answered with an error, frames received since the
    last clear, frames transmitted, request frames sent for the current lookup,
    whether one of our own lookups is outstanding -- all counted from this
    module's own PORTS, never from a private register of the design.
  - {id: ae_m1_three_requests_from_second_lookup, violates: "Q4",
     guard: "the second unanswered lookup, and every one after it",
     defect: "only THREE request frames are transmitted instead of four",
     witness: "FAIL Q4: the SECOND unanswered lookup transmitted 3 request(s); exactly 4 are required, on every lookup alike"}
  - {id: ae_m2_last_request_wrong_target, violates: "Q3",
     guard: "the LAST of the four requests",
     defect: "it asks for an address one off from the one looked up",
     witness: "FAIL Q3: retry 3: asked for c0a80108, expected c0a80109"}
  - {id: ae_m3_cached_mac_wrong_when_full, violates: "Q1",
     guard: "four or more frames learned since the last clear -- the cache is full",
     defect: "the MAC answered from the cache has its low byte corrupted",
     witness: "FAIL Q1: an address taught just before the clear: answered 010203040507, expected the cached 010203040506"}
  - {id: ae_m4_insert_dropped_when_full, violates: "C2",
     guard: "four frames have already been learned since the last clear",
     defect: "the insert silently fails, so the address stays unknown",
     witness: "FAIL Q1/X3: an address taught just before the clear: no response within 40 cycles"}
  - {id: ae_m5_requests_not_learned_after_two, violates: "C1",
     guard: "two or more frames have already been learned since the last clear",
     defect: "a received ARP REQUEST does not insert its sender pair; replies still do",
     witness: "FAIL Q1/X3: the address of a station that asked us: no response within 40 cycles"}
  - {id: ae_m6_reply_target_wrong_while_busy, violates: "A1",
     guard: "one of our own lookups is outstanding when the request arrives",
     defect: "the reply names the wrong target hardware address",
     witness: "FAIL A1: reply THA 000000000000 while a lookup was outstanding, expected the requester's SHA"}
  - {id: ae_m7_answers_foreign_target_while_busy, violates: "A2",
     guard: "one of our own lookups is outstanding when the request arrives",
     defect: "a request whose TPA is not local_ip_i is answered anyway",
     witness: "FAIL A2: a request for another station's address produced 1 reply frame(s) while a lookup was outstanding"}
  - {id: ae_m8_ethtype_low_nibble_ignored, violates: "A3",
     guard: "the eth_type differs from 0x0806 only in its low nibble, after two frames",
     defect: "a frame that is not ARP is processed as ARP",
     witness: "FAIL A3: a frame with eth_type 0800 produced 1 frame(s); it must be ignored"}
  - {id: ae_m9_clear_ignored_when_full, violates: "C3",
     guard: "the cache holds four entries when the clear arrives",
     defect: "clear_cache_i does not reach the cache, so every entry survives it",
     witness: "FAIL C3: after clear_cache a previously cached address was still answered from the cache"}
  - {id: ae_m10_five_requests_on_third_lookup, violates: "Q4",
     guard: "the third lookup since reset, and every one after it",
     defect: "FIVE request frames are transmitted instead of four",
     witness: "FAIL Q4: an unanswered lookup transmitted 5 request(s); exactly 4 are required"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  depth: >
    The reference killed SIX of these as first guarded. Three of the four it
    missed needed one thing the run never did: an incoming ARP frame arriving
    while one of our OWN lookups was outstanding. Every request above was fed to
    an idle engine.
  a_guard_that_defeated_itself: >
    ae_m9 gates the cache's clear on the cache being full, and the occupancy it
    reads was itself reset on the first cycle of the clear pulse -- so the
    remaining cycles of a four-cycle pulse cleared the cache normally and the
    defect never appeared. The gate now holds across the whole pulse.
  reference_reachability: >
    The reference kills all ten. A mutant it cannot reach is unverified, not
    difficult.
policy_derivation:
  method: in_source_rederivation
  what_was_done: >
    Each of the ten defects was written INTO THE DIVERGENT IMPLEMENTATION'S OWN
    SOURCE as an edit to its logic, in that design's own terms -- not as a
    wrapper reused from the golden side. mutants/policy/*.sv each contain the
    independent implementation carrying one defect.
  strength: STRONG
  what_it_establishes: >
    Both halves. The defects are contract-level rather than latitude-sensitive,
    AND each guard was restated against an independent reading of the contract.
    The second half is a test the construction can FAIL: a guard that depends on
    something only the anchor has cannot be expressed here, and shows up as a
    mutant the divergent base does not catch.
  evidence_it_can_fail: >
    It has failed and been fixed. On v_ai02, sr_m4 passed on the divergent base
    because that design makes every beat wait for the sink, so a stall taken
    before the line produced anything left pop_valid_o low -- nothing offered,
    nothing held off, and the guard was unreachable there. The reference was
    corrected to make the stall real under either reading of L1.
  comparability: >
    NOT comparable with a wrapper_pointed 22/22. See that method's own caveat.

negative_controls:
  known_bad_dut:
    status: PASS
    detail: >
      negctl/stuck_dut.sv (all 14 outputs tied low, generated from the port map)
      and negctl/reset_polarity_dut.sv (rst_i treated as active low) are both
      caught naming clauses X3, Q2 and Q6. The stuck DUT was initially caught
      only by the watchdog with ZERO violations, because the testbench waited
      unbounded for the design to accept a lookup or a frame byte; those waits
      are now bounded and X3 was widened to cover forward progress in both
      directions.
  null_testbench:
    status: PASS -- rejected
    detail: >
      negctl/null_tb.sv drives nothing and never instantiates the DUT. The
      harness runs a gate-mutant with every output tied high and requires a
      submission to reject it; the null testbench is reported INVALID and
      EXCLUDED FROM SCORING.

watchdog:
  tb_sim_time_limit: 8ms
  harness_sim_timeout_s: 120

stimulus_rebaseline:
  date: 2026-08-24
  trigger: >
    A frozen-input sweep reported the engine's own identity -- local_ip_i,
    local_mac_i, subnet_mask_i, gateway_ip_i -- held at one value. I cleared it
    first and was WRONG, and the way it was wrong is the part worth keeping.
  the_argument_that_failed: >
    I established that Q3 branches on subnet membership and that the varying
    req_ip_i CROSSES the boundary -- start_lookup(8.8.8.8) against a
    192.168.1.0/24 local subnet -- so both branches are reached. True, and a
    different claim from the one needed. REACHING BOTH BRANCHES IS NOT TESTING
    THAT THE BOUNDARY SITS WHERE THE CONFIGURATION SAYS IT IS: a design that
    hardcodes /24 and 192.168.1.1, ignoring the ports entirely, reaches both
    branches correctly at this configuration.
  the_checker_half: >
    The identity was wired to localparams at the instantiation AND the checkers
    compared against those same symbols, so port and expectation were one name.
    A VARIATION SWEEP CANNOT SEE THIS: the symbol varies in neither place, so
    the tool reports a constant port with nothing behind it to disagree with.
    The stimulus half was findable by measurement; this half was not.
  the_clause: >
    The spec settles it in a sentence: local_mac_i, local_ip_i, gateway_ip_i and
    subnet_mask_i "are inputs, not constants; hold them steady while the engine
    is running". A clause, reachable only by those inputs, and one that
    explicitly permits changing them while the engine is stopped.
  change: >
    STIMULUS ONLY, so no task_text_hash bump. The four are variables now, not
    localparams, and are REPROGRAMMED inside the reset window step 8 already
    had -- 10.0.5.7/16 with gateway 10.0.0.1, replacing 192.168.1.1/24 with
    gateway 192.168.1.254. The MASK WIDTH differs deliberately: 10.0.9.9 is
    inside /16 and outside /24, so the two configurations answer Q3 differently
    for the same lookup and a hardcoded /24 asks the gateway where a conforming
    design asks directly. Step 8b then exercises Q3 both ways under the new
    mask, A1 for the new local IP, and A2 for the OLD one -- a design holding
    the old value answers the wrong one of that pair and is silent on the other,
    and each half alone would let one of those through. A coverage floor on
    cov_identities fails the run if only one configuration is ever driven.
  result: >
    Frozen inputs 8 of 20 -> FOUR, and all four are declared below. Kill table:
    every verdict IDENTICAL, before and after -- ten of ten killed, gate-mutant
    rejected, conformant PASS, dut2 PASS, ACCEPTED, 5c OK on both bases with
    both clean controls passing. NO kill count moved. The BEFORE table was taken
    from the COMMITTED testbench extracted from git rather than from a run
    started before the edit, because a build that reads a file mid-edit is
    neither before nor after.

declared_constants:
  WHY_THIS_EXISTS: >
    The variation check's own rule: a constant that IS legitimate must be
    declared with the clause permitting it, because nothing in the source
    distinguishes a deliberate constant from an overlooked one. Raised by Agent 3.
  - id: m_hdr_ready_i
    held: 1
    licensed_by: >
      X3, which states the liveness bound "with the response channel held
      ready". Holding it ready is the condition the clause is measured under.
  - id: m_payload_ready_i
    held: 1
    licensed_by: X3, same sentence -- each byte of a payload accepted within the bound
  - id: resp_ready_i
    held: 1
    licensed_by: >
      X3, same sentence -- a lookup accepted and answered within 32 cycles with
      the response channel held ready.
  - id: s_payload_user_i
    held: 0
    licensed_by: >
      The spec excludes it BY NAME: it "says nothing about frames whose payload
      is shorter or longer than 28 bytes, nor about s_payload_user_i".
  caveat_that_belongs_with_it: >
    X3 sanctions holding these ready FOR THE LIVENESS BOUND. It does not settle
    the general question of whether backpressure on those channels should be
    exercised at all -- a frozen ready governs no clause here and still gates
    the REACHABILITY of others, and that question is open and reserved. Reading
    this block as "backpressure is out of scope" would be reading more into X3
    than X3 says.

readies_criterion:
  date: 2026-08-25
  verdict: LICENSED and flagged
  frozen: [m_hdr_ready_i, m_payload_ready_i, resp_ready_i]
  licensed_by: >
    X3 states its liveness bound "with the response channel held ready". Holding
    them ready is the condition the clause is measured under, so the constant is
    the clause's own premise.
  test_applied: >
    No check has an antecedent requiring any of them low, measured mechanically,
    and no clause speaks about stability under stall.
  the_licence_is_specific: >
    X3 licenses holding them ready FOR THE LIVENESS BOUND. It settles nothing
    about whether backpressure should be exercised at all. Reading this block as
    "backpressure is out of scope here" would read more into X3 than X3 says.

must_fire:
  reference: [v_nw01.cov_busy_request, v_nw01.cov_clear, v_nw01.cov_hits, v_nw01.cov_identities, v_nw01.cov_lookups, v_nw01.cov_misses, v_nw01.cov_nonarp, v_nw01.cov_notforus, v_nw01.cov_offsubnet, v_nw01.cov_replies_in, v_nw01.cov_requests_in, v_nw01.cov_reset, v_nw01.cov_second_timeout, v_nw01.cov_timeouts]
must_fire_note: >
  Artefacts whose evidentiary value depends on their trigger occurring. Each
  prints `FIRED <name> <count>` once per run; check_fired.py REFUSES on zero and
  refuses ABSENT separately, because absent is not zero (rule 20). Keyed BY
  VARIANT: a negative-control run contains no conformant perturbations and vice
  versa, so a flat per-task list would refuse on every run that is not the union
  of all of them. Declared rather than globbed, so a deleted artefact is a
  refusal instead of a shorter list.
