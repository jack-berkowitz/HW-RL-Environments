oracle_class: A
reference:
  refs_lock_repo: pulp-platform/axi
  refs_lock_sha: 4da15979747f326bde2f9869c64e587ce599772c
  licence: SHL-0.51
  mode: vendor
  file: refs/axi/src/axi_atop_filter.sv
  closure: [refs/axi/src/axi_pkg.sv, refs/common_cells/src/cf_math_pkg.sv,
            refs/common_cells/src/stream_register.sv, refs/common_cells/src/spill_register.sv,
