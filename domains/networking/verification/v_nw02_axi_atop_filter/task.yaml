title: AXI atomic-op filter
id: v_nw02
module: atop_filter
domain: networking
type: verification
catalog: TASK_CATALOG.md
tier: B

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/axi
  refs_lock_sha: 4da15979747f326bde2f9869c64e587ce599772c
  licence: SHL-0.51
  mode: vendor
  file: refs/axi/src/axi_atop_filter.sv
  closure: [refs/axi/src/axi_pkg.sv, refs/common_cells/src/cf_math_pkg.sv,
            refs/common_cells/src/stream_register.sv, refs/common_cells/src/spill_register.sv,
            refs/common_cells/src/spill_register_flushable.sv, refs/common_cells/src/fifo_v3.sv,
            refs/common_cells/src/counter.sv, refs/common_cells/src/delta_counter.sv,
            refs/axi/include/axi/typedef.svh, refs/axi/include/axi/assign.svh,
            refs/common_cells/include/common_cells/registers.svh,
            refs/common_cells/include/common_cells/assertions.svh]
  golden: dut/atop_filter.sv
  note: >
    SHIPS NO RTL. The task ships spec/atop_filter_iface.sv (port map) and
