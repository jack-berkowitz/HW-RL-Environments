harness:
  golden_top: atop_filter
  tb_module: atop_filter_tb
  conformant_prefix: af_c
  mutant_prefix: af_m
  golden_file: dut/atop_filter.sv
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  include_dirs: domains/networking/verification/v_nw02_axi_atop_filter/dut/include
  sim_timeout_s: 60

spec: [spec/atop_filter_spec.md, spec/atop_filter_iface.sv]

# ---- rule 18: ONE scored configuration, named, with its rationale ------------
scored_configuration:
  ID_W: 4
  ADDR_W: 32
  DATA_W: 32
  USER_W: 1
  rationale: >
    ID_W=4 gives sixteen ids, enough that a manufactured response carrying a
    STALE id is distinguishable from one carrying the right id -- at ID_W=1 the
    two coincide half the time. DATA_W=32 makes wstrb a real four-bit sideband.
    USER_W=1 keeps the user field present, at minimum width, as a thing the
    contract leaves unconstrained on manufactured responses (clause L2).
  pinned_inside_the_shim: [MAX_WRITE_TXNS=4]
  pinned_rationale: >
    Not exposed as a parameter. Clauses W2/W3 are properties of a specific
    bound; exposing it would let a submission build the golden at a different
    bound and fail the validity gate for a configuration error rather than a
    verification error. Four is the smallest bound at which an off-by-one is
    distinguishable from both "never stalls" and "stalls immediately".

second_dut:
  status: WIRED
  file: dut2/atop_filter_alt.sv
  note: >
    The SAME artefact as the policy-divergent perturbation of Tier-B step 5c,
    generated from it so the two cannot drift. Independently written from the
    spec; it does not instantiate the golden.
  differences:
    - "manufactured-response ORDER: emits the B first and holds every R beat until
       the B is taken. The golden emits the R beats first (measured: R at cycles
       5-8, B at cycle 12). This is clause L1, and it is the difference that
       matters -- a testbench fitted to the golden's order fails here."
    - "manufactured-response FIELDS: drives a non-zero pattern on rdata/ruser/buser
       where the golden drives zero (clause L2)."
    - "W-before-AW: refuses a W beat until its AW has been accepted; the golden
       accepts early W beats and tracks them with an underflow counter."
    - "atomic concurrency: admits one atomic write at a time; the golden's AW
       admission is governed by its write-debt counter instead."

watchdog:
  tb_sim_time_limit: 4ms
  reference_wall_measured_s: 0.32
  harness_sim_timeout_s: 60           # 187x margin
  full_sweep_wall_s: 59                # 11 DUT builds

scoring:
  validity_gate: submission must PASS the golden DUT
  unpremised_reliance: must PASS the policy-divergent perturbation and dut2
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10

conformant_perturbations:
  - id: af_c1_b_before_r
    licence: "L1 and L2"
    kind: POLICY-DIVERGENT, Tier-B step 5c
    change: >
      An INDEPENDENT implementation, not a wrapper -- it does not instantiate
      the golden. Emits the manufactured B FIRST and holds every R beat until
      the B is taken; the golden emits the R beats first. Also drives a non-zero
      pattern on rdata/ruser/buser of a manufactured response where the golden
      drives zero.
    witness: >
      golden emits R at cycles 5-8 and B at cycle 12; this one emits B first.
      Each channel is independent of the other's backpressure in the golden
      (B completed at 51 with R stalled; R flowed at 93-96 with B stalled), so
      the ordering is free rather than forced.
    reference_tb_verdict: PASS
  policy_independence: >
    All ten defects were re-derived on top of this divergent implementation
    (mutants/policy/) and re-run: the clean policy implementation passes and
    every one of the ten is caught on it. 11 of 11.

    THE SPLIT MATTERS. mutants/check_policy_independence.sh covers the POLICY
    BASE ONLY -- eleven checks, not twenty-two. The golden-base half (golden
    PASS, ten mutants killed) comes from scripts/sim_verification.sh. Both
    halves hold, but by two instruments; this file used to say "caught on BOTH
    bases" over a script that never checked one of them.

    RULE 24: the 11 of 11 is licensed by an observed run on 2026-08-23.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a pair -- a wrong behaviour AND a rare
    predicate over contract-level state that has to hold before it fires. A
    total defect shows up on the first transaction of its class, so any
    testbench that exercises the class at all catches it; what such a mutant
    measures is coverage, not checking. A guarded defect is caught only by a
    testbench that CONSTRUCTS the named configuration and is still checking when
    it arrives.
  fairness: >
    Each guard names a condition the spec states as a checkable bound at a named
    boundary, so the catching act is derivable from the spec text alone. No
    mutant violates an unstated expectation.
  - {id: af_m1_admits_fifth_once_full_has_aged, violates: "W2",
     guard: "the debt has sat at its bound for eight cycles",
     defect: "a fifth outstanding write is admitted",
     witness: "cycle 154, s_awready (the write-admission bound)"}
  - {id: af_m2_debt_frees_on_b_when_deep, violates: "W4",
     guard: "three or more writes are outstanding",
     defect: "the debt falls on a B arriving rather than on a W burst completing",
     witness: "cycle 152, s_awready (the write-admission bound)"}
  - {id: af_m3_rresp_class_on_bit4_multibeat, violates: "C2/F5",
     guard: "the filtered write is multi-beat",
     defect: "the read-response obligation is read from atop[4] instead of atop[5]",
     witness: "cycle 57, slave R: golden valid=1 id=4 resp=10 last=0 / mutant valid=0"}
  - {id: af_m4_rbeats_short_on_long_bursts, violates: "F4",
     guard: "the burst is four beats or longer",
     defect: "it receives one beat too few; shorter bursts are exact",
     witness: "cycle 59, slave R: golden last=0 / mutant last=1, same id and resp"}
  - {id: af_m5_rlast_early_from_second_atomic, violates: "F4",
     guard: "the second filtered write onward",
     defect: "rlast is also asserted on the first injected beat",
     witness: "cycle 57, slave R: golden last=0 / mutant last=1, same id and resp"}
  - {id: af_m6_rresp_okay_on_final_beat, violates: "F4",
     guard: "the final beat of an injected burst",
     defect: "it carries OKAY; every earlier beat of the same burst is correct",
     witness: "cycle 34, slave R: golden resp=10 / mutant resp=00, both last=1"}
  - {id: af_m7_last_absorbed_w_leaks, violates: "F2",
     guard: "the final W beat of a filtered write",
     defect: "it reaches the master port; the rest are absorbed correctly",
     witness: "cycle 11, master W: golden valid=0 / mutant valid=1, data=d0000000 last=1"}
  - {id: af_m8_stale_id_when_atomics_close, violates: "F3/F4",
     guard: "a filtered write follows the previous one within twelve cycles",
     defect: "the id is not captured, so the response carries a stale one",
     witness: "cycle 12, slave B: golden id=2 / mutant id=0, both resp=10"}
  - {id: af_m9_b_okay_on_first_atomic, violates: "F3",
     guard: "the first filtered write after reset",
     defect: "the manufactured B carries OKAY",
     witness: "cycle 12, slave B: golden resp=10 / mutant resp=00, both id=2"}
  - {id: af_m10_extra_rbeat_on_two_beat_burst, violates: "F4",
     guard: "the burst is exactly two beats",
     defect: "it receives three beats; every other length is exact",
     witness: "cycle 92, slave R: golden last=1 / mutant last=0, same id and resp"}
  depth: >
    None falls to a single atomic through an idle filter. Reaching them needs
    burst lengths driven to specific values rather than left at one; a second
    and third filtered write, close together and far apart; the outstanding-write
    debt driven to its bound AND held there; and the injected R burst checked
    beat by beat rather than at its last beat. Attribution is by s_rid_o, never
    by arrival order -- clause F4 lets R beats precede both the B and the
    write's own W burst.
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_harness: mutants/nonequiv_tb.sv
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  reference_reachability: >
    The reference testbench kills all ten. That is the binding constraint on how
    far a guard can be narrowed: a mutant the reference does not reach is not
    difficult, it is unverified, and it would be scored against submissions on
    evidence the task itself cannot produce.

negative_controls:
  known_bad_dut:
    status: PASS
    detail: >
      negctl/stuck_dut.sv (all 45 outputs tied low, generated from the port map)
      and negctl/reset_polarity_dut.sv (rst_ni treated as active high) are both
      caught by the reference testbench, each naming a clause. Both were
      initially caught only by the simulation watchdog -- the reference
      testbench waited unbounded for w_ready and ar_ready. Fixed; X4 widened to
      cover forward progress in both directions.
  null_testbench:
    status: PASS -- rejected, after a harness fix
    detail: >
      negctl/null_tb.sv drives nothing, observes nothing and never instantiates
      the DUT. When this task was built the harness reported it as "VALID, with
      gaps in fault detection ... Caught 0 of 8" and counted it in "2 of 2
      submission(s) passed the validity gate" -- the validity gate was satisfied
      vacuously. Reported rather than worked around, since scripts/ is outside
      this task's boundary. The harness now runs a gate-mutant with every output
      tied high and requires a submission to REJECT it; the null testbench is
      reported INVALID and EXCLUDED FROM SCORING. Re-verified on this task.
