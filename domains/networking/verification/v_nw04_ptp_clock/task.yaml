title: PTP time base
id: v_nw04
module: ptp_time_base
domain: networking
type: verification
catalog: TASK_CATALOG.md
tier: B

oracle_class: A
reference:
  refs_lock_repo: alexforencich/verilog-ethernet
  licence: MIT
  mode: vendor
  file: refs/verilog-ethernet/rtl/ptp_clock.v
  closure: []          # zero dependencies -- a single self-contained file
  golden: dut/ptp_time_base.sv
  note: >
    SHIPS NO RTL. The task ships spec/ptp_time_base_iface.sv (port map) and
    spec/ptp_time_base_spec.md only. dut/ holds the anchor VERBATIM plus a
    Class A port shim, used for scoring and never given to a submission. The
    anchor copy keeps its upstream MIT header unaltered. It is vendored under a
    .sv name because the harness globs dut/*.sv -- a .v file would be silently
    left out of the compile.
  provenance_caveat: >
    The file is present at the path refs.manifest.yaml names, in a repo
    refs.lock pins. Its CONTENTS have not been verified against upstream at
    that SHA -- that needs network, egress is closed. Attests local state only.

harness:
  golden_top: ptp_time_base
  tb_module: ptp_time_base_tb
  conformant_prefix: pt_c
  mutant_prefix: pt_m
  golden_file: dut/ptp_time_base.sv
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  sim_timeout_s: 60

spec: [spec/ptp_time_base_spec.md, spec/ptp_time_base_iface.sv]

# ---- rule 18: ONE scored configuration, named, with its rationale ------------
scored_configuration:
  note: the module takes no parameters; the whole configuration is pinned inside the shim
  pinned_inside_the_shim:
    PERIOD_NS: "4'h6"
    PERIOD_FNS: "16'h6666"      # 6.4 ns -> 156.25 MHz
    FNS_WIDTH: 16
    DRIFT_ENABLE: 1
    DRIFT_NS: "4'h0"
    DRIFT_FNS: "16'h0002"
    DRIFT_RATE: "16'h0005"
    PIPELINE_OUTPUT: 0
  rationale: >
    6.4 ns is a period whose fractional part is not representable in whole
    nanoseconds, so a design that drops fractional bits is wrong from the first
    increment rather than only over a long horizon. A default drift of 2 fns
    every 5 cycles keeps a second, independently-phased contributor in the
    increment at all times, so a testbench cannot model the rate as a single
    constant. PIPELINE_OUTPUT=0 keeps the output path direct, so response
    latency is not a second free variable on top of the one L1 already names.
  pinned_rationale: >
    Not exposed as parameters at all. The clauses about the nominal rate, the
    drift period and the one-second wrap are properties of specific numbers;
    exposing them would let a submission build the golden at a different
    configuration and fail the validity gate for a configuration error rather
    than a verification error.

second_dut:
  status: WIRED
  file: dut2/ptp_time_base_alt.sv
  note: >
    The SAME artefact as the policy-divergent perturbation of Tier-B step 5c,
    generated from it so the two cannot drift. Independently written from the
    spec; it does not instantiate the golden.
  differences:
    - "control latency (clause L1): acts on every control input in the SAME cycle
       its valid is asserted. The golden registers first -- a new period is
       reflected two cycles later, and adj_active_o rises one cycle later."
    - "increment phase (clause L2): drives both time bases from the same increment
       on the same cycle, with adj_active_o exactly in phase with the increments
       it marks. The golden hands ts96_o its increment one cycle after ts64_o, so
       the drift lands on different cycles in the two bases."
    - "structure: a single flat accumulator with a direct comparison against one
       second, against the anchor's pipelined borrow-lookahead scheme."
  nonequivalence_witness: >
    Measured on the golden: ts96_o and ts64_o receive the drift on different
    cycles (ts64 419430 fns while ts96 takes 419432, and the reverse two cycles
    later); the alt gives both the same increment on the same cycle. A testbench
    that requires the two bases to move together fails the alt, and one that
    arms its counters after driving a valid miscounts the alt by one.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpremised_reliance: must PASS the policy-divergent perturbation and dut2
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10

conformant_perturbations:
  - id: pt_c1_zero_latency
    licence: "L1 and L2"
    kind: POLICY-DIVERGENT, Tier-B step 5c
    change: >
      An INDEPENDENT implementation, not a wrapper. Zero control latency, and
      both time bases driven by the same increment on the same cycle.
    reference_tb_verdict: PASS
  policy_independence: >
    All ten defects re-derived on the divergent implementation
    (mutants/policy/) and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    RULE 24: this number is licensed by an observed run of
    mutants/check_policy_independence.sh on 2026-08-23, which printed 22 lines
    of "as expected". It was previously carried over from an earlier run and
    edited into this file by string substitution without re-measuring.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a pair -- a wrong behaviour AND a rare
    predicate over contract-level state that has to hold before it fires. A
    total defect shows up on the first transaction of its class, so any
    testbench that exercises the class at all catches it; what such a mutant
    measures is coverage, not checking. A guarded defect is caught only by a
    testbench that CONSTRUCTS the named configuration and is still checking when
    it arrives.
  fairness: >
    Each guard names a condition the spec states as a checkable bound at a named
    boundary, so the catching act is derivable from the spec text alone. No
    mutant violates an unstated expectation.
  - {id: pt_m1_drift_skipped_one_in_eight, violates: "D2",
     guard: "one drift window in every eight",
     defect: "that application is skipped; the other seven are exact",
     witness: "cycle 37, ts64: golden 17153238 / mutant 17153236 (delta -2 fns)"}
  - {id: pt_m2_adjust_short_when_long, violates: "A2",
     guard: "the adjustment is eight increments or longer",
     defect: "it is applied one short; shorter adjustments are exact",
     witness: "cycle 209, adj_active_o: golden 1 / mutant 0"}
  - {id: pt_m3_adj_active_long_from_second, violates: "A3",
     guard: "the second adjustment onward",
     defect: "adj_active_o runs one cycle past the adjustment",
     witness: "cycle 63, adj_active_o: golden 0 / mutant 1"}
  - {id: pt_m4_wrap_early_when_fraction_carried, violates: "W1",
     guard: "the boundary is crossed mid-nanosecond",
     defect: "the wrap happens one nanosecond early",
     witness: "cycle 162, ts96 ns: golden 1 / mutant 2"}
  - {id: pt_m5_pps_two_cycles_on_later_wraps, violates: "W3",
     guard: "the third wrap onward",
     defect: "pps_o lasts two cycles",
     witness: "cycle 255, pps_o: golden 0 / mutant 1"}
  - {id: pt_m6_fns_truncated_on_drift_cycles, violates: "I1/F3",
     guard: "the increments that carry the drift",
     defect: "the 96-bit base drops four fractional bits",
     witness: "cycle 2, ts96 fns: golden 26216 / mutant 26208 (delta -8 fns)"}
  - {id: pt_m7_adjust_unsigned_for_small_magnitudes, violates: "A5",
     guard: "a negative adjustment under one nanosecond",
     defect: "it is treated as unsigned",
     witness: "cycle 66, ts64: golden 32478584 / mutant 33527160 (delta 1048576 fns)"}
  - {id: pt_m8_reset_keeps_reprogrammed_period, violates: "R2",
     guard: "a period has been programmed twice",
     defect: "reset no longer restores the default period -- the FIRST reset is correct",
     witness: "cycle 357, ts64: golden 419432 / mutant 598018 (delta 178586 fns)"}
  - {id: pt_m9_fourth_window_after_rate_change, violates: "D2",
     guard: "the fourth drift window after a rate change",
     defect: "that window is one cycle long; the windows around it are exact",
     witness: "cycle 22, ts64: golden 9227472 / mutant 9227470 (delta -2 fns)"}
  - {id: pt_m10_drift_dropped_when_adjustment_active, violates: "I1",
     guard: "an adjustment and a drift fall on the SAME increment",
     defect: "only the adjustment is applied",
     witness: "cycle 47, ts64: golden 22439182 / mutant 22439180 (delta -2 fns)"}
  depth: >
    None falls to a short run at the default configuration. Reaching them needs
    adjustments on both sides of the eight-increment boundary, a second and
    third adjustment, three one-second wraps rather than one, two resets with a
    reprogrammed period between them, and a drift window counted across a rate
    change. The witness harness itself had to be extended twice to reach the
    last two.
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_harness: mutants/nonequiv_tb.sv
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  reference_reachability: >
    The reference testbench kills all ten. That is the binding constraint on how
    far a guard can be narrowed: a mutant the reference does not reach is not
    difficult, it is unverified, and it would be scored against submissions on
    evidence the task itself cannot produce.

policy_derivation:
  method: in_source_rederivation
  what_was_done: >
    Each of the ten defects was written INTO THE DIVERGENT IMPLEMENTATION'S OWN
    SOURCE as an edit to its logic, in that design's own terms -- not as a
    wrapper reused from the golden side. mutants/policy/*.sv each contain the
    independent implementation carrying one defect.
  strength: STRONG
  what_it_establishes: >
    Both halves. The defects are contract-level rather than latitude-sensitive,
    AND each guard was restated against an independent reading of the contract.
    The second half is a test the construction can FAIL: a guard that depends on
    something only the anchor has cannot be expressed here, and shows up as a
    mutant the divergent base does not catch.
  evidence_it_can_fail: >
    It has failed and been fixed. On v_ai02, sr_m4 passed on the divergent base
    because that design makes every beat wait for the sink, so a stall taken
    before the line produced anything left pop_valid_o low -- nothing offered,
    nothing held off, and the guard was unreachable there. The reference was
    corrected to make the stall real under either reading of L1.
  comparability: >
    NOT comparable with a wrapper_pointed 22/22. See that method's own caveat.

negative_controls:
  known_bad_dut:
    status: PASS
    detail: >
      negctl/stuck_dut.sv (all 5 outputs tied low, generated from the port map)
      and negctl/reset_polarity_dut.sv (rst_i treated as active low) are both
      caught at cycle 9, each naming clause I1, not by the watchdog.
  null_testbench:
    status: SEE v_nw02 NOTES -- harness-level, being fixed by another agent
    detail: >
      negctl/null_tb.sv drives nothing and never instantiates the DUT. The
      harness reports 0 of 8 and names every miss, but does not reject it; the
      validity gate is satisfied vacuously. Reported from v_nw02; the fix is in
      scripts/, outside this task's boundary.

watchdog:
  tb_sim_time_limit: 3ms
  reference_wall_measured_s: 0.01
  harness_sim_timeout_s: 60

stimulus_rebaseline:
  date: 2026-08-24
  trigger: >
    A frozen-input sweep reported drift_ns_i pinned at zero. It is a DEFECT by
    the standing rule -- a frozen input is one when no other varying input can
    reach the clause it governs. D3 makes {drift_ns_i, drift_fns_i} a SIGNED
    20-bit quantity and the sign bit is drift_ns_i's MSB, so NEGATIVE drift was
    unreachable and drift_fns_i, being the low 16 bits, could not get there. The
    anchor implements it: $signed({drift_ns_reg, drift_fns_reg}).
  what_made_it_sharp: >
    adj_ns_i DID vary -- steps 5 and 6 drive it to 4'hF and 4'hE. The identical
    signed-concatenation pattern was exercised on the ADJUSTMENT side and not on
    the DRIFT side, inside one testbench. An inconsistency, not a judgement call
    about depth.
  change: >
    STIMULUS ONLY, so no task_text_hash bump. Three drift steps added: +1 ns,
    -2000 fns and -2 ns, at a period of 3.75 ns so the accumulators never run
    backwards. Two coverage FLOORS added beside them, mirroring the one the
    adjustment side has had all along -- cov_neg_drifts and cov_ns_drifts.
  result: >
    Frozen inputs 1 of 17 -> ZERO of 17, confirmed by re-running the same tool.
    Kill table: every verdict IDENTICAL, before and after. Ten of ten killed,
    5c 22 of 22, gate-mutant rejected, conformant PASS, dut2 PASS, ACCEPTED.
    NO kill count moved, so nothing needed explaining.
  apparatus_hardened_at_the_same_time: >
    The generator now WIPES mutants/policy/ before writing and the 5c runner
    REFUSES on a size mismatch -- the two defects found on v_ca07. Applied here
    because a re-baseline run through a runner with a known count hole is not a
    re-baseline. Regeneration is byte-identical, so this changed the guarantees
    and not the content. The runner's header also said "the same eight defects"
    where there are ten; it now derives the count.

emittability_closed:
  date: 2026-08-25
  was: >
    15 candidate clauses; four of them real gaps. `grep -c ts_step_o tb/` was 1
    -- the port map. A4 and S3 describe an output the testbench connected and
    never read (measured: high on 35 cycles across 4 set windows, so not a dead
    signal). S1 and S2 were worse: set_ts96/set_ts64 drove the set and raised
    `settle`, which suppresses the increment checker, so a design that set the
    base to ANY value passed provided it kept incrementing legally afterwards.
  now:
    A4: >
      An equality, cycle for cycle: outside a set's window ts_step_o must EQUAL
      adj_active_o. Not correlated, not counted.
    S3: >
      Checked PER SET, not per run. The global identity
      steps == adj_active cycles + sets is satisfied by a design that raises two
      steps for one set and none for the next, so it is not the clause.
    S1_S2: >
      The base is compared against the value written, allowing only the
      increments reachable in the sampling window. A wrong value misses that
      interval by orders of magnitude, not by a beat.
  controls_that_must_fail:
    ts_step_tied_low:   FAIL -- 24 x A4
    ts_step_tied_high:  FAIL -- 24 x A4
    set_never_delivered:
      result: FAIL -- 3 x S1, 3 x S3, and 1 x W1
      exclusive_as_of: null
      exclusive_note: >
        DELIBERATELY NOT EXCLUSIVE, and not merely undated. The W1 is collateral:
        this control's blast radius exceeds one clause, so it licenses "the
        checker refuses" and NOT "it refuses on this clause alone". A date would
        imply the narrower claim was made and measured; it was not made.
    ts_step_controls_exclusive_as_of: >
      2026-08-25 -- ts_step tied low and tied high each fail on A4 and nothing
      else. Read as "exclusive with respect to the checks this task had on that
      date": adding a check can retroactively falsify an isolation claim made in
      good faith, and the claim reads as verified the whole time.
    why_needed: >
      No mutant in this task exercises any of the four. A checker whose refusal
      is unverified has not been shown to fire, and a passing run cannot tell
      the difference.
    measured_by: hand_run
  measured: >
    golden PASS, dut2 PASS, conformant PASS, gate rejected, 10/10 killed.
    Emittability candidates 15 -> 11. tb/ is not in task_text_hash: no hash
    moved.

must_fire:
  reference: [nw04.set_windows, nw04.ts_step, v_nw04.cov_adjusts, v_nw04.cov_drifts, v_nw04.cov_neg_adjusts, v_nw04.cov_neg_drifts, v_nw04.cov_ns_drifts, v_nw04.cov_periods, v_nw04.cov_reset_mid, v_nw04.cov_sets, v_nw04.cov_step_windows, v_nw04.cov_wrap_driven]
must_fire_note: >
  Artefacts whose evidentiary value depends on their trigger occurring. Each
  prints `FIRED <name> <count>` once per run; check_fired.py REFUSES on zero and
  refuses ABSENT separately, because absent is not zero (rule 20). Keyed BY
  VARIANT: a negative-control run contains no conformant perturbations and vice
  versa. Declared rather than globbed, so a deleted artefact is a refusal
  instead of a shorter list.
must_fire_prefix_note: >
  Two prefixes on purpose, and it was nearly a defect. The ts_step and
  set_windows emitters were hand-written as `nw04.` before the mechanical sweep
  added `v_nw04.` ones. The sweep keyed its declaration off the FIRST name in
  the log, read `nw04`, matched no task, and wrote this task an EMPTY list with
  a note saying it has no floors -- which is false and describes v_ca05. Caught
  by the count disagreeing with the run. Left as two prefixes with this note
  rather than renamed, because a rename would move names a declaration already
  points at, and the disagreement is the thing worth recording.
