spec: [spec/frame_arb_mux_spec.md, spec/frame_arb_mux_iface.sv]
task_statement: probe/PASTE.md
task_statement_note: >
  Was probe/BLIND_TB_TASK.md, which DOES NOT EXIST in this task and never
  has. The prompt document on disk is probe/PASTE.md, and that is what
  task_text_hash.py hashes -- it accepts either name, so the hash was
  always right and only the pointer was wrong. A record naming an
  artefact that is not there, which nothing read and nothing caught.

# ---- rule 18: ONE scored configuration, named, with its rationale ------------
scored_configuration:
  S_COUNT: 4
  DATA_WIDTH: 32
  USER_WIDTH: 1
  rationale: >
    S_COUNT=4 is the smallest count at which round-robin service order is
    distinguishable from any fixed order and at which a single starved input is
    a minority rather than half the machine; S_COUNT=2 makes a starvation mutant
    and an alternating policy hard to tell apart. DATA_WIDTH=32 gives KEEP_WIDTH
    4, so tkeep is a real four-bit sideband rather than the single bit it
    degenerates to at DATA_WIDTH=8. USER_WIDTH=1 keeps the per-beat sideband
    present as an integrity axis at minimum width.
  pinned_inside_the_shim: [ARB_TYPE_ROUND_ROBIN=1, ARB_LSB_HIGH_PRIORITY=1, LAST_ENABLE=1]
  pinned_rationale: >
    Not exposed as parameters at all. See the header of dut/frame_arb_mux.sv:
    S5 bounded fairness is a property of ARB_TYPE_ROUND_ROBIN=1 (measured: at 0,
    406 of 406 frames went to input 0), and S3 frame atomicity is a property of
    LAST_ENABLE=1. Exposing either would let a submission build the golden
    off-spec and fail the validity gate for a configuration error.

negative_controls:
  date: 2026-08-28
  why: >
    This task shipped NO negative controls. Every clause check rested on the
    mutant set, so nothing showed any of them could fire independently of the
    defects that happen to ship with it. Eight of the eleven verification tasks
    carried controls; this was one of the three that did not.

    The motivating case is v_ca03's F1(a): a correctly written check for a clause
    the golden actually violated, kept silent by stimulus that never exercised
    it, undetected until two submissions happened to concentrate on it. A
    negative control is the standing version of that detection -- a DUT that MUST
    fail, on one named clause.
  control: negctl/s12_beat_survives_reset.sv
  targets: "S12"
  verified: >
    With the perturbation: RESULT: FAIL (1 failure), clauses fired: S12 only -- a beat accepted before reset replayed once after release.
    Differential, perturbation replaced by a constant as the file's first line
    declares: RESULT: PASS. That makes the perturbation NECESSARY for the
    failure rather than merely present during it, which a FIRED counter alone
    cannot establish.
  s3_still_uncontrolled: >
    S3 was the first choice and is not reachable from the ports. It has a SINGLE
    check site, which makes it the clause with no redundancy behind it, but the
    testbench infers a beat's source from its payload tag and compares m_tlast
    under S4, so every port-level way to fake a mid-frame switch also corrupts a
    field S4 owns. An S3-only violation needs the arbiter to interleave
    correctly-ordered beats from two inputs, which is internal behaviour a
    wrapper cannot reach. 'S3 has one site and no control' remains true, and the
    reason is the testbench's attribution rather than an omission.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpromised_reliance: must PASS every conformant perturbation
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10
  independent_submission_best: 9 of 10 (misses fm_m9_marginal_starvation)
  ceiling_caveat: >
    Weaker evidence than the same number on v_ca05. There the mutants found two
    genuine holes in the reference testbench on first use. Here the reference
    killed all six on its first run, because one author wrote the spec, the
    checker and the mutants in one sitting. The set has not been challenged by
    anything its author did not anticipate. See NOTES.md section 7.

policy_derivation:
  method: wrapper_pointed
  what_was_done: >
    Each mutant is a wrapper that reads its guards from the PORTS and delegates
    to an implementation. The re-derivation is the SAME WRAPPER pointed at the
    divergent implementation instead of the anchor. mutants/policy/*.sv each
    instantiate the independent design and carry the identical guard logic.
  strength: WEAKER -- read the caveat before quoting the number
  what_it_establishes: >
    One half only. The defects are contract-level: they remain detectable
    against a design with different latency, different structure and different
    scheduling, so the reference's detection is not relying on the anchor's
    timing. That is real and it is what 5c exists to check.
  what_it_does_NOT_establish: >
    That the guards were stress-tested against an independent reading of the
    contract. The guard logic is LITERALLY THE SAME CODE on both bases, so there
    is nothing anchor-specific for the check to catch and the property holds BY
    CONSTRUCTION. This method cannot fail the way in_source_rederivation can.
  comparability: >
    A 22/22 here is NOT equivalent to a 22/22 from in_source_rederivation, and a
    results table that prints them in one column is comparing two different
    claims. Report the method alongside the number.

watchdog:
  tb_sim_time_limit: 20ms
  tb_sim_time_measured: ~21us          # ~950x margin
  harness_sim_timeout_s: 25
  harness_wall_measured_s: 0.21        # cold; <0.01 warm. >=119x margin

conformant_perturbations:
  - {id: fm_c1, licence: "S6, latitude 3",  change: ready withheld on a rolling 1-in-4 schedule,
     witness: "value differs at beat 0; transfer cycle differs at beat 1 (golden 4, variant 5)"}
  - {id: fm_c2, licence: "S9, latitude 1",  change: inputs served in the opposite rotation,
     witness: "value differs at beat 0 -- a different input served first"}
  - {id: fm_c3, licence: "S11, latitude 2", change: one extra output register stage,
     witness: "transfer cycle differs at beat 0 (golden 3, variant 4)"}
  - {id: fm_c4, licence: "latitude 4",      change: LFSR noise on the data lines while m_tvalid_o low,
     witness: "values and cycles identical over 400 beats; idle-line changes 0 vs 4 -- its whole effect is where the contract is silent"}
  - {id: fm_c5, licence: "latitude 5",      change: one forced idle cycle after every frame,
     witness: "transfer cycle differs at beat 5 (golden 8, variant 9)"}
  enumeration: conformant/README.md    # every clause marked pinned or perturbed
  all_survive: true

policy_independence_5c:
  policy_independence: >
    All ten guarded defects re-derived on the policy-divergent implementation in
    dut2/ -- an INDEPENDENT design written from the spec, not a wrapper around
    the anchor -- and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    HOW THE RE-DERIVATION IS DONE. Every mutant in this task wraps an
    implementation and reads its guards from the PORTS only, so the re-derived
    defect is the same wrapper pointed at the other design. The wrapper cannot
    depend on either implementation's internals because it never sees them --
    which is the reason guards were restricted to contract-level state in the
    first place.

    RULE 24: licensed by an observed run on 2026-08-23; the output is recorded
    in mutants/RULE24.md alongside the witness-runner controls.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Each defect is a wrong behaviour paired with a rare
    predicate over contract-level state -- which frame it is, how deep into the
    frame, how many inputs are contending, how many resets have completed. All
    counted from the port handshakes, never from inside the golden.
  - {id: fm_m1_drops_high_payload, violates: "S4",
     guard: "the fifth frame forwarded, and every one after it",
     defect: "the top half of tdata is zeroed",
     witness: "FAIL [S4] input 0 tdata: expected ab750060 got 00000060 (t=225000)"}
  - {id: fm_m2_priority_arbitration, violates: "S10",
     guard: "three or more inputs are offering in the same cycle",
     defect: "fixed priority replaces the rotation -- two-way contention is still fair",
     witness: "FAIL [S10] input 1 has started no frame in 109 completed output frames (window 16) (t=2835000)"}
  - {id: fm_m3_frame_interleaved, violates: "S3",
     guard: "the fifth frame onward, at its third beat or later",
     defect: "an in-progress frame is re-aimed at the other half of the inputs",
     witness: "FAIL [S3] mid-frame switch: frame from input 3 interrupted by input 1 (t=395000)"}
  - {id: fm_m4_tuser_crossed, violates: "S4",
     guard: "the fifth frame onward",
     defect: "tuser is taken from the next input along",
     witness: "FAIL [S4] input 1 tuser: expected 1 got 0 (t=265000)"}
  - {id: fm_m5_early_tlast, violates: "S4",
     guard: "the third frame onward",
     defect: "tlast is also asserted on a frame's FIRST beat",
     witness: "FAIL [S4] input 2 tlast: expected 0 got 1 (t=135000)"}
  - {id: fm_m6_reset_ignored, violates: "S12",
     guard: "the SECOND reset, and every one after it",
     defect: "rst_i does not reach the design",
     witness: "FAIL [S12] m_tvalid_o high on the first cycle after reset release (t=20175000)"}
  - {id: fm_m7_tuser_wrong_on_last, violates: "S4",
     guard: "the final beat of a frame four beats or longer",
     defect: "tuser is inverted there",
     witness: "FAIL [S4] input 0 tuser: expected 0 got 1 (t=105000)"}
  - {id: fm_m8_tkeep_full_on_last, violates: "S4",
     guard: "the final beat of a frame four beats or longer",
     defect: "tkeep is forced to all ones",
     witness: "FAIL [S4] input 2 tkeep: expected c got f (t=165000)"}
  - {id: fm_m9_marginal_starvation, violates: "S10",
     guard: "a 300-cycle window out of every 320",
     defect: "the last input is not admitted -- it is served in the remaining 20",
     witness: "FAIL [S10] input 3 has started no frame in 113 completed output frames (window 16) (t=2695000)"}
  - {id: fm_m10_deep_beat_corruption, violates: "S4",
     guard: "the fourth beat onward of a frame, from the fifth frame",
     defect: "one payload bit is flipped",
     witness: "FAIL [S4] input 0 tdata: expected d5ca0090 got e9ba0060 (t=285000)"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_runner: mutants/witness.sh
  depth: >
    Every frame the reference drove was one to five beats long, so S3 atomicity
    was only ever checked on short frames. It now drives frames of six to ten
    beats under full contention, with mid-frame backpressure so the re-aim
    window is actually open.
  a_guard_measured_before_it_was_kept: >
    fm_m3 was first keyed on the fifth beat of a frame. Instrumenting showed the
    reference reached that depth 112 times and produced ZERO mid-frame switches
    -- the depth was reachable and the switch was not. Re-keyed onto frame
    ordinal plus beat depth, which the reference provably reaches.
  reference_reachability: >
    The reference kills all ten. A mutant it cannot reach is unverified, not
    difficult.
second_dut:
  status: WIRED
  file: dut2/frame_arb_mux_alt.sv
  differences:
    - "selection: a single rotating pointer, against the anchor's masked-priority tree"
    - "no input registers: s_tready_o high ONLY for the selected input -- the OPPOSITE
       choice from the anchor on S6/latitude 3, and the one that matters"
    - "output depth: one register with combinational ready, against the anchor's
       two-deep output datapath and registered ready"
  nonequivalence_witness: >
    Under identical stimulus over 200 cycles the golden asserts s_tready_o on more
    than one input simultaneously on 2 cycles; the alt on 0. Difference 2 is real
    and externally observable, so a pass against it is not a pass against a
    paraphrase.
  result: passes the reference testbench, zero rule-5 adjudications
  UNWIRED: >
    sim_verification.sh gates on this DECLARATION -- it refuses when a non-ABSENT
    status has no dut2/ -- but it never compiles the file and never adds a row for
    it. Every result above came from running the reference testbench by hand.
    NOTHING RUNS THIS AS A GATE. Do not assume it working.

readies_criterion:
  date: 2026-08-25
  verdict: NO FROZEN READY -- nothing to adjudicate
  measured: >
    all 8 inputs vary, m_tready_i included. Measured here rather than taken from the sweep that
    reported this task clean: three of that sweep's rows were wrong when read
    against my own tasks, and a clean row is the one nobody rechecks.


must_fire:
  reference: [v_nw03.cov_frames_phaseC, v_nw03.cov_hi_payload, v_nw03.cov_long_frames, v_nw03.cov_partial_keep, v_nw03.cov_resets, v_nw03.cov_single_frames, v_nw03.cov_stall_midframe]
must_fire_note: >
  Artefacts whose evidentiary value depends on their trigger occurring. Each
  prints `FIRED <name> <count>` once per run; check_fired.py REFUSES on zero and
  refuses ABSENT separately, because absent is not zero (rule 20). Keyed BY
  VARIANT: a negative-control run contains no conformant perturbations and vice
  versa, so a flat per-task list would refuse on every run that is not the union
  of all of them. Declared rather than globbed, so a deleted artefact is a
  refusal instead of a shorter list.
