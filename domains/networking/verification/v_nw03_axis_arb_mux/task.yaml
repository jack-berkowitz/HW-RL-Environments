id: v_nw03
module: frame_arb_mux
domain: networking
type: verification
catalog: TASK_CATALOG.md

oracle_class: A
reference:
  refs_lock_repo: alexforencich/verilog-axis
  refs_lock_sha: 48ff7a7e2ef782cf778d47910cf85835c64b1bce
  licence: MIT
  mode: vendor
  file: refs/verilog-axis/rtl/axis_arb_mux.v
  closure: [refs/verilog-axis/rtl/arbiter.v, refs/verilog-axis/rtl/priority_encoder.v]
  golden: dut/frame_arb_mux.sv
  note: >
    SHIPS NO RTL. The task ships spec/frame_arb_mux_iface.sv (port map) and
    spec/frame_arb_mux_spec.md only. dut/ holds the anchor VERBATIM plus a
    port shim, used for scoring and never given to a submission -- so there is
    no decontaminated derivative, nothing to recognise, and no notice to retain.
    The anchor copies keep their upstream MIT headers unaltered.
  provenance_caveat: >
    The files are present at the paths refs.manifest.yaml names, in a repo
    refs.lock pins. Their CONTENTS have not been verified against upstream at
    that SHA -- that needs network, egress is closed. Attests local state only.

harness:
  golden_top: frame_arb_mux
  tb_module: frame_arb_mux_tb
  conformant_prefix: fm_c
  mutant_prefix: fm_m
  golden_file: dut/frame_arb_mux.sv
  support_files: [dut/axis_arb_mux.sv, dut/arbiter.sv, dut/priority_encoder.sv]
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  sim_timeout_s: 25

spec: [spec/frame_arb_mux_spec.md, spec/frame_arb_mux_iface.sv]
task_statement: probe/BLIND_TB_TASK.md

# ---- rule 18: ONE scored configuration, named, with its rationale ------------
scored_configuration:
  S_COUNT: 4
  DATA_WIDTH: 32
  USER_WIDTH: 1
  rationale: >
    S_COUNT=4 is the smallest count at which round-robin service order is
    distinguishable from any fixed order and at which a single starved input is
    a minority rather than half the machine; S_COUNT=2 makes a starvation mutant
    and an alternating policy hard to tell apart. DATA_WIDTH=32 gives KEEP_WIDTH
    4, so tkeep is a real four-bit sideband rather than the single bit it
    degenerates to at DATA_WIDTH=8. USER_WIDTH=1 keeps the per-beat sideband
    present as an integrity axis at minimum width.
  pinned_inside_the_shim: [ARB_TYPE_ROUND_ROBIN=1, ARB_LSB_HIGH_PRIORITY=1, LAST_ENABLE=1]
  pinned_rationale: >
    Not exposed as parameters at all. See the header of dut/frame_arb_mux.sv:
    S5 bounded fairness is a property of ARB_TYPE_ROUND_ROBIN=1 (measured: at 0,
    406 of 406 frames went to input 0), and S3 frame atomicity is a property of
    LAST_ENABLE=1. Exposing either would let a submission build the golden
    off-spec and fail the validity gate for a configuration error.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpromised_reliance: must PASS every conformant perturbation
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10
  independent_submission_best: 9 of 10 (misses fm_m9_marginal_starvation)
  ceiling_caveat: >
    Weaker evidence than the same number on v_ca05. There the mutants found two
    genuine holes in the reference testbench on first use. Here the reference
    killed all six on its first run, because one author wrote the spec, the
    checker and the mutants in one sitting. The set has not been challenged by
    anything its author did not anticipate. See NOTES.md section 7.

watchdog:
  tb_sim_time_limit: 20ms
  tb_sim_time_measured: ~21us          # ~950x margin
  harness_sim_timeout_s: 25
  harness_wall_measured_s: 0.21        # cold; <0.01 warm. >=119x margin

conformant_perturbations:
  - {id: fm_c1, licence: "S6, latitude 3",  change: ready withheld on a rolling 1-in-4 schedule,
     witness: "value differs at beat 0; transfer cycle differs at beat 1 (golden 4, variant 5)"}
  - {id: fm_c2, licence: "S9, latitude 1",  change: inputs served in the opposite rotation,
     witness: "value differs at beat 0 -- a different input served first"}
  - {id: fm_c3, licence: "S11, latitude 2", change: one extra output register stage,
     witness: "transfer cycle differs at beat 0 (golden 3, variant 4)"}
  - {id: fm_c4, licence: "latitude 4",      change: LFSR noise on the data lines while m_tvalid_o low,
     witness: "values and cycles identical over 400 beats; idle-line changes 0 vs 4 -- its whole effect is where the contract is silent"}
  - {id: fm_c5, licence: "latitude 5",      change: one forced idle cycle after every frame,
     witness: "transfer cycle differs at beat 5 (golden 8, variant 9)"}
  enumeration: conformant/README.md    # every clause marked pinned or perturbed
  all_survive: true

mutants:
  - {id: fm_m1, class: capability, defect: "tdata above bit 15 silently dropped -- behaves as DATA_WIDTH=16",
     violates: S4,  witness: "beat 0: golden 1443000036, mutant 0000000036", killed_by: S4}
  - {id: fm_m2, class: starvation, defect: "fixed priority instead of rotation",
     violates: S10, witness: "beat 5: golden 1d9c80004e, mutant 3c46801418",  killed_by: S10}
  - {id: fm_m3, class: atomicity,  defect: "two half-muxes with a beat-level mux between them; frames interleave",
     violates: S3,  witness: "beat 0: golden 1443000036, mutant 07fc0000a6",  killed_by: "S3 first, S10 later"}
  - {id: fm_m4, class: sideband,   defect: "tuser taken from the neighbouring input",
     violates: S4,  witness: "beat 4: golden 3c33001031, mutant 3c33001033",  killed_by: S4}
  - {id: fm_m5, class: boundary,   defect: "tlast also asserted on the first beat of every multi-beat frame",
     violates: S4,  witness: "beat 0: golden 1443000036, mutant 1443000037",  killed_by: S4}
  - {id: fm_m6, class: reset,      defect: "golden never sees rst_i; beats held at reset survive it",
     violates: S12, witness: "beat 101, immediately after the mid-stream reset", killed_by: S12}
  all_have_nonequivalence_witnesses: true
  witness_harness: mutants/nonequiv_tb.sv
  isolation: >
    Five of six trip exactly one clause. fm_m3 trips S3 first and S10 later --
    one defect with two symptoms, recorded rather than called clean isolation.

second_dut:
  status: WIRED
  file: dut2/frame_arb_mux_alt.sv
  differences:
    - "selection: a single rotating pointer, against the anchor's masked-priority tree"
    - "no input registers: s_tready_o high ONLY for the selected input -- the OPPOSITE
       choice from the anchor on S6/latitude 3, and the one that matters"
    - "output depth: one register with combinational ready, against the anchor's
       two-deep output datapath and registered ready"
  nonequivalence_witness: >
    Under identical stimulus over 200 cycles the golden asserts s_tready_o on more
    than one input simultaneously on 2 cycles; the alt on 0. Difference 2 is real
    and externally observable, so a pass against it is not a pass against a
    paraphrase.
  result: passes the reference testbench, zero rule-5 adjudications
  UNWIRED: >
    sim_verification.sh gates on this DECLARATION -- it refuses when a non-ABSENT
    status has no dut2/ -- but it never compiles the file and never adds a row for
    it. Every result above came from running the reference testbench by hand.
    NOTHING RUNS THIS AS A GATE. Do not assume it working.
