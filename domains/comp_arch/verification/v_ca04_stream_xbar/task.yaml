title: stream crossbar
id: v_ca04
module: route_xbar
domain: comp_arch
type: verification
catalog: TASK_CATALOG.md
tier: B

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/common_cells
  licence: SHL-0.51
  mode: vendor
  file: refs/common_cells/src/stream_xbar.sv
  closure: [refs/common_cells/src/stream_demux.sv, refs/common_cells/src/rr_arb_tree.sv,
            refs/common_cells/src/lzc.sv, refs/common_cells/src/spill_register.sv,
            refs/common_cells/src/spill_register_flushable.sv,
            refs/common_cells/src/cf_math_pkg.sv,
            refs/common_cells/include/common_cells/assertions.svh,
            refs/common_cells/include/common_cells/registers.svh]
  golden: dut/route_xbar.sv
  note: >
    SHIPS NO RTL. The task ships spec/route_xbar_iface.sv (port map) and
    spec/route_xbar_spec.md only. dut/ holds the anchor VERBATIM plus a Class A
    port shim, used for scoring and never given to a submission. The anchor
    copies keep their upstream SHL-0.51 headers unaltered.
  provenance_caveat: >
    The files are present at the paths refs.manifest.yaml names, in a repo
    refs.lock pins. Their CONTENTS have not been verified against upstream at
    that SHA -- that needs network, egress is closed. Attests local state only.
  assertion_suppression: >
    dut/aa_asserts_off.sv defines COMMON_CELLS_ASSERTS_OFF and is named to sort
    FIRST in the harness's lexicographic glob of dut/*.sv. The anchor carries
    built-in protocol assertions that abort the simulation with $stop and print
    the ANCHOR'S FILENAME AND MODULE PATH to stdout when a submission's stimulus
    slips. That is two problems: the run produces no RESULT line, so the
    submission fails on the GOLDEN and reads as "rejected correct hardware" when
    the fault is its own stimulus; and the abort names the design the task is
    built on. The assertions check only source-side obligations, which clause H2
    states as obligations on the submission.

harness:
  golden_top: route_xbar
  tb_module: route_xbar_tb
  conformant_prefix: xb_c
  mutant_prefix: xb_m
  golden_file: dut/route_xbar.sv
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  include_dirs: domains/comp_arch/verification/v_ca04_stream_xbar/dut/include
  sim_timeout_s: 60

spec: [spec/route_xbar_spec.md, spec/route_xbar_iface.sv]

scored_configuration:
  N_IN: 4
  N_OUT: 4
  DATA_W: 32
  SEL_W: 2
  IDX_W: 2
  rationale: >
    Four inputs is the smallest count at which round-robin service is
    distinguishable from any fixed order and at which a starved input is a
    minority rather than half the machine. Four outputs makes the two-bit
    selector fully covered, so no selector value is out of range and no clause
    has to describe an undefined case. DATA_W=32 leaves room to encode both the
    source input and a per-input sequence number in every payload, which is what
    makes R3 checkable against something other than the design's own claim.
  pinned_inside_the_shim: [OutSpillReg=0, ExtPrio=0, AxiVldRdy=1, LockIn=1]
  pinned_rationale: >
    Not exposed as parameters. Fairness is a property of round-robin arbitration
    at a specific port count and A3 is a property of a locked-in decision;
    exposing either would let a submission build the golden off-spec and fail
    the validity gate for a configuration error rather than a verification one.

second_dut:
  status: WIRED
  file: dut2/route_xbar_alt.sv
  note: >
    The SAME artefact as the policy-divergent perturbation of Tier-B step 5c,
    generated from it so the two cannot drift. Independently written from the
    spec; it does not instantiate the golden.
  differences:
    - "rotation direction (clause L2): rotates DOWNWARD -- after serving input k
       the next favoured contender is k-1. The golden rotates upward. Both meet
       the A2 window; they differ in the order within it."
    - "output registration (clause L3): every output is REGISTERED, so a beat is
       always delivered the cycle after it is accepted. The golden's outputs are
       combinational, so a beat can be accepted and delivered in the same cycle."
    - "structure: a per-output held-beat register with an explicit scan, against
       the anchor's demux-plus-arbiter-tree with a lock register."
  nonequivalence_witness: >
    Measured: the golden serves a tied set in the order 0 1 2 3 and can deliver
    in the accepting cycle; the alt serves 3 2 1 0 and never delivers before the
    following cycle. A testbench that assumes either the rotation direction or
    the zero-latency path fails it.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpremised_reliance: must PASS the policy-divergent perturbation and dut2
  fault_detection: reported PER MUTANT, never as a rate
  reference_ceiling: 10 of 10

conformant_perturbations:
  - id: xb_c1_registered_down_rotation
    licence: "L1, L2 and L3"
    kind: POLICY-DIVERGENT, Tier-B step 5c
    change: an INDEPENDENT crossbar, not a wrapper; downward rotation and registered outputs
    reference_tb_verdict: PASS
  policy_independence: >
    All ten defects re-derived on the divergent implementation
    (mutants/policy/) and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    RULE 24: this number is licensed by an observed run of
    mutants/check_policy_independence.sh on 2026-08-23, which printed 22 lines
    of "as expected" and "OK: every defect is caught on BOTH bases". It was
    previously carried over from an earlier run and edited into this file by
    string substitution without re-measuring; that is what this re-run replaces.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a pair -- a wrong behaviour AND a rare
    predicate over contract-level state that has to hold before it fires. A
    total defect (fixed priority, a dropped selector bit) shows up on the first
    transaction of its class, so any testbench that exercises the class at all
    catches it; what such a mutant measures is coverage, not checking. A guarded
    defect is caught only by a testbench that CONSTRUCTS the named configuration
    and is still checking when it arrives.
  fairness: >
    Each guard names a condition the spec states as a checkable bound at a named
    boundary, so the catching act is derivable from the spec text alone. No
    mutant violates an unstated expectation.
  - {id: xb_m1_fairness_freeze_at_three, violates: A2,
     guard: "exactly three inputs contend for one output",
     defect: "the rotation freezes; four-way contention is perfect, and so is two-way",
     witness: "cycle 186, output 0: golden data=5a10003d idx=1 / mutant data=5a00003d idx=0"}
  - {id: xb_m2_rotation_skips_on_fourth_wrap, violates: A2,
     guard: "the fourth complete wrap of the rotation",
     defect: "the rotation lands one place past input 0, skipping its turn",
     witness: "cycle 5, output 0: golden data=5a000000 idx=0 / mutant data=5a100001 idx=1"}
  - {id: xb_m3_lock_released_after_long_stall, violates: A3,
     guard: "the output has been stalled eight consecutive cycles",
     defect: "an already-offered beat is re-aimed at a different input",
     witness: "cycle 185, output 0: golden data=5a00003d idx=0 / mutant data=5a10003d idx=1"}
  - {id: xb_m4_starves_input_two_every_eleventh_turn, violates: A2,
     guard: "one rotation in every eleven",
     defect: "input 2 loses its turn -- inside any short window the service order is correct",
     witness: "cycle 23, output 0: golden data=5a200005 idx=2 / mutant data=5a300005 idx=3"}
  - {id: xb_m5_idx_stale_after_long_idle, violates: R3,
     guard: "the output has been idle eight cycles",
     defect: "out_idx_o names the PREVIOUS source while the payload is correct",
     witness: "cycle 42, output 3: golden data=5a30000a idx=3 / mutant data=5a30000a idx=0"}
  - {id: xb_m6_swap_pair_under_backpressure, violates: R5,
     guard: "two beats from one input to one output separated by a stall",
     defect: "they are delivered in the opposite order",
     witness: "cycle 46, output 0: golden data=5a00000b / mutant data=5a00000a, same idx"}
  - {id: xb_m7_drop_every_sixty_fourth, violates: R4,
     guard: "the sixty-fourth beat delivered on an output",
     defect: "it is silently dropped -- a count defect, not a payload defect",
     witness: "cycle 72, out_valid_o: golden 1111 / mutant 1110"}
  - {id: xb_m8_duplicate_on_stall_release, violates: R4,
     guard: "the beat released after a stall of four or more cycles",
     defect: "it is delivered twice",
     witness: "cycle 185, in_ready_o (masked by in_valid_i): golden 0001 / mutant 0000"}
  - {id: xb_m9_misroute_under_full_collision, violates: R1,
     guard: "all four inputs target one output simultaneously",
     defect: "a beat lands on the next output along",
     witness: "cycle 1, out_valid_o: golden 0001 / mutant 0010"}
  - {id: xb_m10_ready_glitch_when_all_stalled, violates: I2,
     guard: "every output stalled at once",
     defect: "input 0 is accepted for one cycle although nothing can take its beat",
     witness: "cycle 492, in_ready_o (masked by in_valid_i): golden 0000 / mutant 0001"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_harness: mutants/nonequiv_tb.sv
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  depth: >
    None falls to a single beat through an idle crossbar, and none falls to
    short fixed stimulus either. Reaching them needs the contender count driven
    to a specific value rather than left at whatever the driver happens to
    offer; stalls held long enough to cross a threshold; an output left idle
    rather than kept busy; and enough traffic to pass a count in the dozens. The
    witness harness itself had to be rewritten to reach them -- its three
    forty-cycle phases found only the total defects of the previous set.
  reference_reachability: >
    The reference testbench kills all ten. That is the binding constraint on how
    far a guard can be narrowed: a mutant the reference does not reach is not
    difficult, it is unverified, and it would be scored against submissions on
    evidence the task itself cannot produce.

policy_derivation:
  method: in_source_rederivation
  what_was_done: >
    Each of the ten defects was written INTO THE DIVERGENT IMPLEMENTATION'S OWN
    SOURCE as an edit to its logic, in that design's own terms -- not as a
    wrapper reused from the golden side. mutants/policy/*.sv each contain the
    independent implementation carrying one defect.
  strength: STRONG
  what_it_establishes: >
    Both halves. The defects are contract-level rather than latitude-sensitive,
    AND each guard was restated against an independent reading of the contract.
    The second half is a test the construction can FAIL: a guard that depends on
    something only the anchor has cannot be expressed here, and shows up as a
    mutant the divergent base does not catch.
  evidence_it_can_fail: >
    It has failed and been fixed. On v_ai02, sr_m4 passed on the divergent base
    because that design makes every beat wait for the sink, so a stall taken
    before the line produced anything left pop_valid_o low -- nothing offered,
    nothing held off, and the guard was unreachable there. The reference was
    corrected to make the stall real under either reading of L1.
  comparability: >
    NOT comparable with a wrapper_pointed 22/22. See that method's own caveat.

negative_controls:
  known_bad_dut:
    status: PASS
    detail: >
      negctl/stuck_dut.sv (all 4 outputs tied low, generated from the port map)
      and negctl/reset_polarity_dut.sv (rst_ni treated as active high) are both
      caught, each naming clauses I1 and I2, not by the watchdog.
  null_testbench:
    status: PASS -- rejected
    detail: >
      negctl/null_tb.sv drives nothing and never instantiates the DUT. The
      harness runs a gate-mutant with every output tied high and requires a
      submission to reject it; the null testbench is reported INVALID and
      EXCLUDED FROM SCORING.

watchdog:
  tb_sim_time_limit: 2ms
  harness_sim_timeout_s: 60

condition_floor:
  date: 2026-08-25
  clause: A3
  defect: >
    The floor for A3 counted cov_lockin_probe, which my own probe SETS. It
    reported "A3 is untested" when I forgot to run the probe and never when the
    design declined to enter the state. A3's antecedent is out_valid_o high while
    out_ready_i is low -- out_valid_o is a DESIGN output, so a conforming design
    that offers only into a ready sink keeps the antecedent false for the whole
    run and A3 is never judged.
  fix: >
    The antecedent is now counted IN THE CHECKER, where it can be seen:
    cov_a3_held increments on every cycle pv[j] && !pr[j] holds. The stimulus
    floor stays and claims only what it counts -- "the A3 probe was not driven".
  control: negctl/a3_offers_only_when_ready_dut.sv
  measured: >
    The SAME control PASSES against the committed testbench and FAILS against
    this one, with cov_a3_held == 0. It suppressed and it passed: both halves
    measured, neither assumed.
  verdict: >
    A3 is UNFALSIFIABLE. The evasion is conforming -- nothing in the contract
    forbids out_valid_o depending on out_ready_i -- so the floor makes it
    VISIBLE WITHOUT MAKING IT NON-CONFORMING. A submission failing this way can
    correctly argue it satisfies A3, and the failure is the harness saying it
    cannot tell. The mirror clause is the fix and it moves the hash, so it is
    not landed here. Same clause shape as d_dsp02's H3 on a different bus.
  rebaseline: >
    Ten of ten killed, gate-mutant rejected, conformant PASS, dut2 PASS,
    ACCEPTED. Every verdict identical to the committed baseline.

readies_criterion:
  date: 2026-08-25
  verdict: NO FROZEN READY -- nothing to adjudicate
  measured: >
    all 6 inputs vary, out_ready_i included. Measured here rather than taken from the sweep that
    reported this task clean: three of that sweep's rows were wrong when read
    against my own tasks, and a clean row is the one nobody rechecks.

