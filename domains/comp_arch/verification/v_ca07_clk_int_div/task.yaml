  refs_lock_repo: pulp-platform/common_cells
  licence: SHL-0.51
  mode: vendor
  file: refs/common_cells/src/clk_int_div.sv
  also: refs/tech_cells_generic (tc_clk_gating)
  golden: dut/clk_ratio_div.sv
  note: >
    SHIPS NO RTL. The task ships spec/clk_ratio_div_iface.sv (port map) and
