title: tag tracker (out-of-order queue)
id: v_ca05
module: tag_tracker
domain: comp_arch
type: verification
catalog: TASK_CATALOG.md

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/common_cells
  licence: SHL-0.51
  mode: vendor
  file: refs/common_cells/src/id_queue.sv
  golden: dut/tag_tracker.sv
  note: >
    SHIPS NO RTL. Under the decision recorded in TASK_CATALOG.md, a verification
    task ships a port map and a pinned specification only. The golden DUT below
    is used for scoring and is never given to a submission, so decontamination,
    licence retention in a shipped derivative, and recognition exposure do not
    arise. dut/ retains a decontaminated copy because it predates that decision
    and is what the scoring harness runs.

# ---- harness parameters. sim_verification.sh REFUSES if any is missing, and
# ---- reads them from here rather than hardcoding v_ca05's names.
harness:
  golden_top: tag_tracker          # module the submission instantiates
  tb_module: tag_tracker_tb        # module the submission must declare
  conformant_prefix: tt_c          # perturbations that must be ACCEPTED
  mutant_prefix: tt_m              # faults that must be CAUGHT
  golden_file: dut/tag_tracker.sv
  support_files: [dut/math_utils_pkg.sv, dut/lead_zero_ctr.sv, dut/onehot_encoder.sv]
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  # Include dirs for the compile. v_ca05's DUT needs none, but the harness must
  # support them: the next verification anchor (fpnew_noncomp) includes
  # common_cells/registers.svh, and without this the compile simply fails.
  include_dirs: refs/common_cells/include
  sim_timeout_s: 25                # measured: reference TB 0.02-0.30 s, a real
                                   # submission 0.26 s -- 80x to 1000x margin, so
                                   # this stays a liveness check and never
                                   # becomes a performance check

spec: [spec/tag_tracker_spec.md]
task_statement: probe/PASTE.md
task_statement_note: >
  Was probe/BLIND_TB_TASK.md, which DOES NOT EXIST in this task and never
  has. The prompt document on disk is probe/PASTE.md, and that is what
  task_text_hash.py hashes -- it accepts either name, so the hash was
  always right and only the pointer was wrong. A record naming an
  artefact that is not there, which nothing read and nothing caught.

scoring_ceiling:
  reference: 10 of 10
  licensed_by: >
    Observed run of scripts/sim_verification.sh on 2026-08-23: golden PASS, all
    four conformant perturbations PASS, all ten guarded mutants killed. No
    ceiling was recorded here before; an absent ceiling reads as "not measured"
    and this one had been.
  caveat: >
    The reference killed FIVE of ten as first guarded. It checked every clause,
    but each one once, in the easiest configuration available. The other five
    came from re-testing the same clauses at occupancies the earlier phases
    never constructed.

negative_controls:
  date: 2026-08-28
  why: >
    This task shipped NO negative controls. Every clause check rested on the
    mutant set, so nothing showed any of them could fire independently of the
    defects that happen to ship with it. Eight of the eleven verification tasks
    carried controls; this was one of the three that did not.

    The motivating case is v_ca03's F1(a): a correctly written check for a clause
    the golden actually violated, kept silent by stimulus that never exercised
    it, undetected until two submissions happened to concentrate on it. A
    negative control is the standing version of that detection -- a DUT that MUST
    fail, on one named clause.
  control: negctl/r15_store_not_emptied_by_reset.sv
  targets: "R15"
  verified: >
    With the perturbation: RESULT: FAIL, clauses fired: R15 only, driving two sites -- 'empty low after reset' and 'empty_o low after a reset asserted on a NON-EMPTY store'. All four of this task's R15 sites were among the 14 of 27 that never fire, so no shipped defect drove R15 at all.
    Differential, perturbation replaced by a constant as the file's first line
    declares: RESULT: PASS. That makes the perturbation NECESSARY for the
    failure rather than merely present during it, which a FIRED counter alone
    cannot establish.
  wrapper_hazard: >
    tb/tag_tracker_spec_tb.sv reads `dut.linked_data_free`, internal to the
    golden. It sits under `ifdef PROBE so ordinary builds do not reach it, but
    ANY wrapper for this task -- this control and the mutants alike -- fails to
    compile under -DPROBE. The reference is the only DUT satisfying that
    reference.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpromised_reliance: must PASS all 4 conformant perturbations
  fault_detection: reported PER MUTANT, never as a rate
  note: >
    A kill from a submission that FAILED the golden carries no information -- a
    testbench that rejects everything appears to catch everything (rule 16). And
    a HANG is not a catch: the submission did not detect the fault, it stopped,
    and a correct-but-slow design hangs it identically.

conformant_perturbations:
  - {id: c1, licence: R11, change: match_gnt_o free-runs}
  - {id: c2, licence: R10, change: pop_data_o garbage when pop_data_valid_o low}
  - {id: c3, licence: R6,  change: push_gnt_o withheld on alternate cycles}
  - {id: c4, licence: "latitude 6", change: pop_gnt_o delayed one cycle}

policy_independence_5c:
  policy_independence: >
    All ten guarded defects re-derived on the policy-divergent implementation in
    dut2/ -- an INDEPENDENT design written from the spec, not a wrapper around
    the anchor -- and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    HOW THE RE-DERIVATION IS DONE. Every mutant in this task wraps an
    implementation and reads its guards from the PORTS only, so the re-derived
    defect is the same wrapper pointed at the other design. The wrapper cannot
    depend on either implementation's internals because it never sees them --
    which is the reason guards were restricted to contract-level state in the
    first place.

    RULE 24: licensed by an observed run on 2026-08-23; the output is recorded
    in mutants/RULE24.md alongside the witness-runner controls.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a wrong behaviour paired with a rare
    predicate over contract-level state, so it is caught only by a testbench
    that CONSTRUCTS the named configuration and is still checking when it
    arrives. The previous set was boundary-shaped but TOTAL: each defect held on
    every transaction of its class and fired on the first one driven.
  guards_are_contract_level: >
    Occupancy, per-tag occupancy, completed pushes, pops and searches, and how
    many times the store has filled -- all counted from the PORT handshakes
    alone. Nothing inside the golden is read, so each guard can be restated
    against an independent implementation.
  - {id: tt_m1_capacity_off_by_one, violates: "R1/R5",
     guard: "the store has already been filled and drained once",
     defect: "it accepts only SLOTS-1 entries, and full_o rises one entry early",
     witness: "[FAIL] R14 : after push 8: full=0 with 8 entries (t=130000)"}
  - {id: tt_m2_lifo_within_tag, violates: "R2",
     guard: "the tag being popped holds three or more entries",
     defect: "the NEWEST entry of that tag is returned instead of the oldest",
     witness: "[FAIL] R8 : tag 5: pop_data=a0000007 expected a0000000 (t=215000)"}
  - {id: tt_m3_half_capacity, violates: "R1",
     guard: "three or more distinct tags are present",
     defect: "the store holds SLOTS/2 -- every transaction is still correct",
     witness: "[FAIL] R14 : after push 8: full=0 with 8 entries (t=130000)"}
  - {id: tt_m4_tag0_starved, violates: "R1/R6",
     guard: "the store is at least half full",
     defect: "tag 0 is never granted -- starvation, not deadlock",
     witness: "[FAIL] R1 : entry 4 on tag 0 refused with 4 of 8 slots free (t=5090000)"}
  - {id: tt_m5_match_ignores_high_byte, violates: "R12",
     guard: "the eighth completed search onward",
     defect: "the masked compare silently drops bits 31:24 of the mask",
     witness: "[FAIL] R12 : data=71b2c3d4 mask=ff000000 hit=1 expected 0 (t=4755000)"}
  - {id: tt_m6_empty_wrong_at_one, violates: "R14",
     guard: "the store has been full at some point since reset",
     defect: "empty_o is high at exactly one stored entry",
     witness: "[FAIL] R14 : after pop 7: empty=1 with 1 entries (t=300000)"}
  - {id: tt_m7_per_tag_cap, violates: "R1",
     guard: "two or more distinct tags are present",
     defect: "a per-tag cap of SLOTS/2 is imposed while total capacity is correct",
     witness: "[FAIL] R1 : entry 5 on tag 0 refused with 3 of 8 slots free (t=5100000)"}
  - {id: tt_m8_peek_removes_last, violates: "R9",
     guard: "the store holds four or more entries",
     defect: "a peek REMOVES the entry when its tag holds exactly one",
     witness: "[FAIL] R8 : tag 7: pop_data_valid=0 expected 1 (t=4635000)"}
  - {id: tt_m9_zero_mask_no_hit, violates: "R13",
     guard: "the store holds four or more entries",
     defect: "a mask of all zeros reports no hit",
     witness: "[FAIL] R12 : data=00000000 mask=00000000 hit=0 expected 1 (t=185000)"}
  - {id: tt_m10_full_asserts_late, violates: "R14",
     guard: "the SECOND time the store becomes full, and every time after",
     defect: "full_o rises one cycle late",
     witness: "[FAIL] R14 : full for the SECOND time: full=0 with 8 entries (t=4650000)"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_runner: mutants/witness.sh
  depth: >
    The reference killed FIVE of these as first guarded. It exercised each
    clause once, in the easiest configuration available: an empty store, one
    tag, a first fill, a handful of searches. It now drives a half-full store,
    more than SLOTS/2 entries on a single tag with another tag present, a peek
    of a single-entry tag while the store is busy, a SECOND fill to capacity,
    and the discriminating high-byte search after ten other searches.
  reference_reachability: >
    The reference kills all ten. A mutant it cannot reach is unverified, not
    difficult.
second_dut:
  status: WIRED
  file: dut2/tag_tracker_alt.sv
  differences:
    - "storage and ordering: a flat array of SLOTS entries with a monotonic sequence
       number, oldest-for-tag found by scan, against the anchor's per-tag linked
       lists with head/tail pointers and a free list"
    - "push_gnt_o is REQUEST-GATED -- asserted only when push_req_i is high. THE
       ANCHOR DOES THE OPPOSITE: its grant is a space-available flag high with no
       request pending, which is the single fact R4 exists to state and the clause
       the pilot identified as load-bearing. R6 licenses both."
    - "same-cycle push and pop of one tag: at FULL_RATE=0 this design denies the
       push and lets the pop proceed. Arbitration policy, unconstrained by latitude 1."
  nonequivalence_witness: >
    Measured, not declared. Over 82 cycles with a long idle stretch, push_gnt_o is
    high with NO request pending on 79 cycles for the anchor and 0 for the alt.
    Difference 2 is real and externally observable, and it is exactly the R4 axis.
  result: passes the reference testbench -- 1305 checks, 0 failures, zero rule-5 adjudications
  UNWIRED: >
    sim_verification.sh gates on this DECLARATION only and never compiles or runs
    dut2/. The result above came from running tb/tag_tracker_spec_tb.sv against it
    by hand. Do not assume it working as a gate.
policy_derivation:
  method: wrapper_pointed
  what_was_done: >
    Each mutant is a wrapper that reads its guards from the PORTS and delegates
    to an implementation. The re-derivation is the SAME WRAPPER pointed at the
    divergent implementation instead of the anchor. mutants/policy/*.sv each
    instantiate the independent design and carry the identical guard logic.
  strength: WEAKER -- read the caveat before quoting the number
  what_it_establishes: >
    One half only. The defects are contract-level: they remain detectable
    against a design with different latency, different structure and different
    scheduling, so the reference's detection is not relying on the anchor's
    timing. That is real and it is what 5c exists to check.
  what_it_does_NOT_establish: >
    That the guards were stress-tested against an independent reading of the
    contract. The guard logic is LITERALLY THE SAME CODE on both bases, so there
    is nothing anchor-specific for the check to catch and the property holds BY
    CONSTRUCTION. This method cannot fail the way in_source_rederivation can.
  comparability: >
    A 22/22 here is NOT equivalent to a 22/22 from in_source_rederivation, and a
    results table that prints them in one column is comparing two different
    claims. Report the method alongside the number.

readies_criterion:
  date: 2026-08-25
  verdict: NOT MEASURABLE by the variation instrument -- stated, not assumed clean
  why: >
    check_stimulus_variation.py reads the input port list from spec/*_iface.sv.
    THIS TASK HAS NONE: its port map lives in probe/PASTE.md, which is correct
    for a submission -- the hash covers it and a submitter sees it -- and
    invisible to the tool. So v_ca05 has been reported as SKIPPED every time the
    sweep has run, and will be, and that is not the same as clean.
  what_would_fix_it: >
    Either the tool learns to read a port list out of PASTE.md, or this task
    ships a spec/*_iface.sv alongside it. The second moves the hash; the first
    is AGENT-PPA's file. Neither is decided here, and until one happens this
    task's readies -- and every other input -- are UNMEASURED rather than clean.
  the_general_point: >
    A task the instrument cannot read is reported in the same column as a task
    with nothing wrong. "SKIPPED" and "none frozen" are different answers and a
    reader scanning a table of eleven rows will not distinguish them.
  status_2026_08_25: >
    PRE-EMPTION, NOT A LIVE DEFECT, and recorded that way on AGENT-PPA's
    correction rather than left to look closed. There is no "none frozen" column
    in the results table yet, so nothing is currently rendering the wrong answer.
    The wording is agreed for when the column exists -- NOT MEASURABLE with the
    reason, never a blank and never a zero. Their lean is that the TOOL should
    learn to read a port list out of PASTE.md, because that does not move this
    task's hash and a task whose port map lives where the submitter sees it is
    not doing anything wrong. Jack's call, and not started.


must_fire:
  reference: [v_ca05.cov_peek, v_ca05.cov_pop_absent, v_ca05.cov_zero_mask, v_ca05.cov_order, v_ca05.cov_reset_nonempty]
must_fire_note: >
  Artefacts whose evidentiary value depends on their trigger occurring. Each
  prints `FIRED <name> <count>` once per run; check_fired.py REFUSES on zero and
  refuses ABSENT separately, because absent is not zero (rule 20).
  WAS AN EXPLICIT EMPTY LIST, and the empty list was correct: this testbench had
  no coverage counter and no floor anywhere in it. That is now closed.

antecedent_floors:
  date: 2026-08-25
  was: >
    No cov_ counter and no fail("FLOOR") anywhere in the file. Six clause ids
    emittable of fifteen stated, and FOUR MORE grouped: R2, R9 and R10 report
    under R8, R13 under R12. For a grouped clause the antecedent is the only
    thing standing between it and being unexercised, and nothing was watching
    any of the four.
  why_that_pair_is_worse_than_either: >
    Grouping hides WHICH clause was tested; an unguarded antecedent hides
    WHETHER ANYTHING was. The floor that would read zero sits on the other
    clause and is satisfied, so the two defects cover for each other. This is
    v_nw01's C2 shape, four times over in one task.
  now:
    cov_peek: "R9 -- a pop with pop_en_i low on a PRESENT entry"
    cov_pop_absent: "R10 -- a pop of a tag with no entries"
    cov_zero_mask: "R13 -- an all-zero mask against a NON-EMPTY store"
    cov_order: "R2 -- a pop from a tag holding two or more"
  gated_on_the_stimulus_half_only: >
    Each counts an event this testbench chooses to drive and reads no design
    output, so none can reject correct hardware.
  measured: >
    peek=6, pop-absent=401, zero-mask=1, multi-deep pop=14. Golden PASS, dut2
    PASS, 4/4 conformant, gate rejected, 10/10 killed.
  zero_mask_is_one: >
    R13's antecedent is reached EXACTLY ONCE in the whole run. The floor now
    makes an edit that removes that single do_match(0, 0, ...) call fail, which
    is what it is for -- but R13 rests on one observation and that is worth
    knowing rather than inferring from a green row.
  mutants_already_covered_two_of_the_four: >
    tt_m8_peek_removes_last (R9) and tt_m9_zero_mask_no_hit (R13) both die, so
    those antecedents were being reached. A mutant dying is evidence AFTER THE
    FACT that the stimulus happened to exist; the floor is the guarantee that it
    still will. Nothing keyed on R2's or R10's antecedent either way.
  spec_annotation_held: >
    R2 -> R8, R9 -> R8, R10 -> R8, R13 -> R12 are NOT annotated in the spec yet.
    That is a clause-text edit and would move this task's hash, and v_ca05's hash
    is not otherwise moving. Held for the next build per the agreed sequence;
    the floors are tb/ only and cost nothing.

r15_was_emittable_emitted_and_vacuous:
  date: 2026-08-25
  status: CLOSED
  clause: >
    R15 -- "while rst_ni is low the store shall be emptied; after release,
    empty_o shall be high and full_o low."
  what_was_wrong: >
    Both halves were CHECKED. Lines 201-202 read empty_o and full_o immediately
    after the initial reset and report under R15. The check was VACUOUS: the only
    reset in this testbench happened on a store that had never held anything, so
    a design that ignores rst_ni entirely passed it for the life of the task.
  why_this_one_is_the_sharpest_of_the_five: >
    R15 IS IN THE EMITTABLE SET. The emittability scan reports it as fine, and it
    is fine in the only sense that scan can measure -- a fail() exists that can
    name it. What the scan cannot see is that the observation behind it is empty.
    A CLAUSE CAN BE EMITTABLE, EMITTED, AND UNEXERCISED, and the first two are
    what make the third invisible.
  found_by: >
    Measuring mid-run reset assertions across all eleven rather than hand-checking
    two. v_ca03 and v_ca06 were established by hand; the other nine were never
    measured. v_ca05 is the only additional one, and it was found only because
    AGENT-DESIGN-43a92055 found a fourth instance on d_ai01 by making the same
    omission and saying so.
  fix: >
    A phase appended after the final drain -- no existing measurement moves.
    Fill the store, ASSERT IT IS NON-EMPTY, reset four cycles, release, then
    require empty_o high, full_o low, and a pop of a previously-present tag to
    return nothing. Step 1 is the gate: if the store is not actually non-empty
    the phase reports "R15 WAS NEVER EXERCISED" and FAILS rather than passing,
    which is the state it sat in until now.
  control_that_must_fail:
    what: a design that sees the initial reset and ignores every later one
    result: FAIL -- R15 "the store was not emptied", and R8 "pop_data_valid=1 expected 0"
    exclusive_as_of: null
    exclusive_note: >
      DELIBERATELY NOT EXCLUSIVE. The R8 is intended: the phase pops a
      previously-present tag to establish the entries are GONE rather than merely
      uncounted, so a design that ignores reset fails both the status check and
      the removal check. Two clauses, both correct, and no isolation claim is
      made over it.
    measured_by: hand_run
  measured: >
    cov_reset_nonempty=1. golden PASS, dut2 PASS, 4/4 conformant, gate rejected,
    10/10 killed.
