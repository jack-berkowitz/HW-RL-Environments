task_statement: probe/PASTE.md

scored_configuration:
  SLV_ID_W: 4
  MST_ID_W: 2
  ADDR_W: 32
  DATA_W: 32
  MAX_UNIQ_IDS: 4
  MAX_TXNS_PER_ID: 2
  rationale: >
    MAX_UNIQ_IDS (4) <= 2**MST_ID_W (4) selects the REMAP path inside the
    anchor rather than the serialize path; the two are different designs and one
    contract cannot describe both. SLV_ID_W=4 against MST_ID_W=2 makes the
    conversion lossy -- 16 slave IDs onto 4 master IDs -- so the allocation table
    is the whole difficulty. MAX_UNIQ_IDS=4 puts the table boundary within easy
    reach of a testbench, which is where the discriminating mutants live.

second_dut:
  status: BUILT
  file: dut2/id_width_conv_alt.sv
  differences:
    - "allocation policy: a ROTATING pointer -- the next master id after the one
       most recently allocated -- against the reference implementation's
       LOWEST-FREE via leading-zero count"
    - "table organisation: a directory keyed by SLAVE id holding {mapped, master
       id, count} plus a reverse array, against a table keyed by master id"
    - "no buffering: address and response channels are combinational
       pass-throughs, so the master request appears in the cycle the slave
       request is accepted; the reference registers its path (latitude 2)"
  nonequivalence_witness: >
    MEASURED, and the first probe was wrong. Allocate two ids, retire the first,
    allocate a new one: the reference reuses the just-freed master id (0 1 0),
    the alternative takes the next in rotation (0 1 2), and again on the next
    (0 1 0 2 against 0 1 2 3). 2 of 4 address handshakes differ in master id
    choice. The policies are genuinely different, so the reference testbench has
    accepted two different allocation disciplines rather than one written twice.
  witness_caveat: >
    The FIRST attempt at this measurement reported "same choices throughout --
    paraphrase risk". That was a defect in the probe, not the DUT: with the
    table full only one master id is ever free, so no CHOICE exists to differ
    on. A choice requires two or more free ids with the rotating pointer past
    the lowest. The probe now provokes that state deliberately.
  result: passes the reference testbench, zero rule-5 adjudications

policy_independence_5c:
  policy_independence: >
    All ten guarded defects re-derived on the policy-divergent implementation in
    dut2/ -- an INDEPENDENT design written from the spec, not a wrapper around
    the anchor -- and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    HOW THE RE-DERIVATION IS DONE. Every mutant in this task wraps an
    implementation and reads its guards from the PORTS only, so the re-derived
    defect is the same wrapper pointed at the other design. The wrapper cannot
    depend on either implementation's internals because it never sees them --
    which is the reason guards were restricted to contract-level state in the
    first place.

    RULE 24: licensed by an observed run on 2026-08-23; the output is recorded
    in mutants/RULE24.md alongside the witness-runner controls.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a wrong behaviour paired with a rare
    predicate over contract-level state, so it is caught only by a testbench
    that CONSTRUCTS the named configuration and is still checking when it
    arrives. The previous set of five was boundary-shaped but TOTAL: each held
    on every transaction of its class.
  structure: >
    Each mutant WRAPS the unmodified golden and hooks it in two places -- the
    slave-side handshake, gated so valid in and ready out move together, and
    the slave-side RESPONSE channels, intercepted on the way out. The occupancy
    tracker reads the slave port handshakes and the golden's own response
    stream, never anything inside its table, so no mutant inherits the golden's
    blind spots and every guard can be restated against another design.
  - {id: iw_m1_blocks_one_early_on_long_bursts, violates: "A3",
     guard: "the arriving request's burst is four beats or longer",
     defect: "a new identifier is refused one entry BELOW the boundary",
     witness: "FAIL [A3] a new id was refused at MAX_UNIQ-1 distinct outstanding, seven-beat burst (t=17090)"}
  - {id: iw_m2_depth_one_short_when_two_ids, violates: "A5",
     guard: "two or more distinct identifiers are outstanding on that side",
     defect: "the per-identifier depth stalls one transaction early",
     witness: "FAIL [A3] an ALREADY-OUTSTANDING id was refused at a full table (t=800)"}
  - {id: iw_m3_entry_freed_late_after_busy_retire, violates: "A4",
     guard: "the identifier retired out of a table holding three or more",
     defect: "the freed entry stays blocked four cycles, past A4's two-cycle window",
     witness: "FAIL [A4] entry freed late: new id accepted 5 cycles after retirement, window is 2 (t=2040)"}
  - {id: iw_m4_blocks_known_id_when_full_has_aged, violates: "A3",
     guard: "the table has been full for four consecutive cycles",
     defect: "a request carrying an ALREADY-outstanding identifier is refused",
     witness: "FAIL [A3] an ALREADY-OUTSTANDING id was refused at a full table (t=800)"}
  - {id: iw_m5_reads_and_writes_share_when_deep, violates: "A1",
     guard: "two or more distinct write identifiers are outstanding",
     defect: "reads and writes are counted against ONE table instead of separately",
     witness: "FAIL [A1] a READ was refused while only WRITES occupied the table (t=20340)"}
  - {id: iw_m6_rid_wrong_deep_in_burst, violates: "C1",
     guard: "the fourth beat of a burst and every beat after",
     defect: "a read response beat carries the wrong slave identifier",
     witness: "FAIL [E1] read beat 0 of slave id 1 carries 00001079, expected 00001177 (t=17055)"}
  - {id: iw_m7_rdata_corrupt_every_thirty_second, violates: "E1",
     guard: "the thirty-second beat delivered, and every thirty-second after",
     defect: "a read data beat has its low bit flipped",
     witness: "FAIL [E1] read beat 0 of slave id 1 carries 0000111e, expected 0000111f (t=6835)"}
  - {id: iw_m8_bresp_wrong_when_full, violates: "E1",
     guard: "the write table is full when the response is presented",
     defect: "the write response carries an altered resp field",
     witness: "FAIL [E1] write response for slave id 0 carries resp 01, expected 00 (t=20235)"}
  - {id: iw_m9_rlast_early_on_long_bursts, violates: "D4",
     guard: "the burst runs to a seventh beat",
     defect: "rlast is asserted on a beat that is not the burst's last",
     witness: "FAIL [D4] slave id 0: rlast is 1 on beat 5 of a 7-beat burst (t=17075)"}
  - {id: iw_m10_extra_b_after_sixteen, violates: "C2",
     guard: "sixteen write responses have already been delivered",
     defect: "an extra write response appears for a transaction that is not outstanding",
     witness: "FAIL [C2] write response for slave id 2 with none outstanding (t=27795)"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  depth: >
    The reference killed THREE of these when the set was first generated. It was
    read-only, single-beat and never issued a write, so C1, E1, D4 and the whole
    write side went unobserved -- the master-side responder returned one beat
    with constant data, which cannot distinguish a correct beat from any other.
    It now honours arlen, derives each beat's data from the address the
    transaction was issued with, checks every beat rather than only the last,
    drives writes, and runs long enough to pass a count in the dozens.
  reference_reachability: >
    The reference kills all ten, and all five conformant perturbations still
    pass. A mutant the reference cannot reach is unverified, not difficult.

conformant_perturbations:
  - {id: iw_c1_permuted_allocation, licence: "D3, section 8.1",
     witness: "master id at request 0: golden 0, perturbation 2 -- all 40 differ"}
  - {id: iw_c2_extra_latency, licence: "section 8.2",
     witness: "master request cycle at 0: golden 1, perturbation 2 -- all 40 differ"}
  - {id: iw_c3_ready_withheld, licence: "section 8.3",
     witness: "acceptance cycle at 0: golden 1, perturbation 2 -- 30 of 40 differ"}
  - {id: iw_c4_garbage_when_invalid, licence: "section 8.5",
     witness: "values and cycles identical; idle-line changes 10 vs 130"}
  - {id: iw_c5_channel_arbitration, licence: "section 8.3",
     witness: "master id at request 3: golden 3, perturbation 0 -- 19 differ"}
  enumeration: conformant/README.md
  all_survive: true
  note: >
    iw_c2 and iw_c5 first reported as no-ops. Both were harness gaps -- master
    request timing was not captured, and writes were not driven so the channel
    arbitration was unreachable. Recorded because the alarm was correct and the
    instrument was not.

policy_derivation:
  method: wrapper_pointed
  what_was_done: >
    Each mutant is a wrapper that reads its guards from the PORTS and delegates
    to an implementation. The re-derivation is the SAME WRAPPER pointed at the
    divergent implementation instead of the anchor. mutants/policy/*.sv each
    instantiate the independent design and carry the identical guard logic.
  strength: WEAKER -- read the caveat before quoting the number
  what_it_establishes: >
    One half only. The defects are contract-level: they remain detectable
    against a design with different latency, different structure and different
    scheduling, so the reference's detection is not relying on the anchor's
    timing. That is real and it is what 5c exists to check.
  what_it_does_NOT_establish: >
    That the guards were stress-tested against an independent reading of the
    contract. The guard logic is LITERALLY THE SAME CODE on both bases, so there
    is nothing anchor-specific for the check to catch and the property holds BY
    CONSTRUCTION. This method cannot fail the way in_source_rederivation can.
  comparability: >
    A 22/22 here is NOT equivalent to a 22/22 from in_source_rederivation, and a
    results table that prints them in one column is comparing two different
    claims. Report the method alongside the number.

watchdog:
  tb_sim_time_limit: 4000000        # time units
  tb_sim_time_measured: 15us
  harness_sim_timeout_s: 25
  harness_wall_measured_s: 0.02

scoring_ceiling:
  reference: 10 of 10
  licensed_by: >
    Observed run of scripts/sim_verification.sh on 2026-08-23: golden PASS, all
    five conformant perturbations PASS, all ten guarded mutants killed.
  caveat: >
    The previous value, 5 of 5, carried a caveat that the model had been written
    with those five boundaries in hand -- consistent with the cases it was built
    from rather than complete. That caveat is now WEAKER but not gone. The
    reference killed only THREE of the ten guarded mutants as first generated;
    it was read-only and single-beat, so C1, E1, D4 and the entire write side
    went unobserved. It was rebuilt to reach them. A ceiling raised by extending
    the reference to meet the mutants is still a statement about the cases the
    reference was made to cover.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpromised_reliance: must PASS every conformant perturbation
  fault_detection: reported PER MUTANT, never as a rate
