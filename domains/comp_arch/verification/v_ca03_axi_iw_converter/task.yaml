title: AXI ID-width converter
id: v_ca03
module: id_width_conv
domain: comp_arch
type: verification
catalog: TASK_CATALOG.md

oracle_class: A
reference:
  refs_lock_repo: pulp-platform/axi
  refs_lock_sha: 4da15979747f326bde2f9869c64e587ce599772c
  licence: SHL-0.51
  mode: vendor
  file: refs/axi/src/axi_iw_converter.sv
  golden: dut/id_width_conv.sv
  closure_note: >
    18 vendored files: 10 from pulp-platform/axi and 8 from common_cells, all at
    the SHAs refs.lock pins. axi_demux_id_counters is required and is not
    obvious from reading -- it surfaced only from elaboration.
  anchor_modification: >
    Every `include in dut/ is replaced verbatim by the included file's contents
    (26 directives across 18 files). sim_verification.sh passes no -I and the
    verification half has no sim_flags equivalent, so dut/ must be
    self-contained. A preprocessing step, not a semantic edit.
  provenance_caveat: >
    Files present at the paths refs.manifest.yaml names, in a repo refs.lock
    pins. Contents NOT verified against upstream at that SHA -- needs network,
    egress closed. Attests local state only.

harness:
  golden_top: id_width_conv
  tb_module: id_width_conv_tb
  conformant_prefix: iw_c
  mutant_prefix: iw_m
  golden_file: dut/id_width_conv.sv
  conformant_file: conformant/conformant_perturbations.sv
  mutant_file: mutants/mutants.sv
  sim_timeout_s: 25

spec: [spec/id_width_conv_spec.md, spec/id_width_conv_iface.sv]
task_statement: probe/PASTE.md

scored_configuration:
  SLV_ID_W: 4
  MST_ID_W: 2
  ADDR_W: 32
  DATA_W: 32
  MAX_UNIQ_IDS: 4
  MAX_TXNS_PER_ID: 2
  rationale: >
    MAX_UNIQ_IDS (4) <= 2**MST_ID_W (4) selects the REMAP path inside the
    anchor rather than the serialize path; the two are different designs and one
    contract cannot describe both. SLV_ID_W=4 against MST_ID_W=2 makes the
    conversion lossy -- 16 slave IDs onto 4 master IDs -- so the allocation table
    is the whole difficulty. MAX_UNIQ_IDS=4 puts the table boundary within easy
    reach of a testbench, which is where the discriminating mutants live.

second_dut:
  status: BUILT
  file: dut2/id_width_conv_alt.sv
  differences:
    - "allocation policy: a ROTATING pointer -- the next master id after the one
       most recently allocated -- against the reference implementation's
       LOWEST-FREE via leading-zero count"
    - "table organisation: a directory keyed by SLAVE id holding {mapped, master
       id, count} plus a reverse array, against a table keyed by master id"
    - "no buffering: address and response channels are combinational
       pass-throughs, so the master request appears in the cycle the slave
       request is accepted; the reference registers its path (latitude 2)"
  nonequivalence_witness: >
    MEASURED, and the first probe was wrong. Allocate two ids, retire the first,
    allocate a new one: the reference reuses the just-freed master id (0 1 0),
    the alternative takes the next in rotation (0 1 2), and again on the next
    (0 1 0 2 against 0 1 2 3). 2 of 4 address handshakes differ in master id
    choice. The policies are genuinely different, so the reference testbench has
    accepted two different allocation disciplines rather than one written twice.
  witness_caveat: >
    The FIRST attempt at this measurement reported "same choices throughout --
    paraphrase risk". That was a defect in the probe, not the DUT: with the
    table full only one master id is ever free, so no CHOICE exists to differ
    on. A choice requires two or more free ids with the rotating pointer past
    the lowest. The probe now provokes that state deliberately.
  result: passes the reference testbench, zero rule-5 adjudications

policy_independence_5c:
  policy_independence: >
    All ten guarded defects re-derived on the policy-divergent implementation in
    dut2/ -- an INDEPENDENT design written from the spec, not a wrapper around
    the anchor -- and re-run: every one caught on BOTH bases, both clean
    implementations pass. 22 of 22.

    HOW THE RE-DERIVATION IS DONE. Every mutant in this task wraps an
    implementation and reads its guards from the PORTS only, so the re-derived
    defect is the same wrapper pointed at the other design. The wrapper cannot
    depend on either implementation's internals because it never sees them --
    which is the reason guards were restricted to contract-level state in the
    first place.

    RULE 24: licensed by an observed run on 2026-08-23; the output is recorded
    in mutants/RULE24.md alongside the witness-runner controls.
    Rerun with mutants/check_policy_independence.sh.

mutants:
  design: >
    GUARDED, uniformly. Every defect is a wrong behaviour paired with a rare
    predicate over contract-level state, so it is caught only by a testbench
    that CONSTRUCTS the named configuration and is still checking when it
    arrives. The previous set of five was boundary-shaped but TOTAL: each held
    on every transaction of its class.
  structure: >
    Each mutant WRAPS the unmodified golden and hooks it in two places -- the
    slave-side handshake, gated so valid in and ready out move together, and
    the slave-side RESPONSE channels, intercepted on the way out. The occupancy
    tracker reads the slave port handshakes and the golden's own response
    stream, never anything inside its table, so no mutant inherits the golden's
    blind spots and every guard can be restated against another design.
  - {id: iw_m1_blocks_one_early_on_long_bursts, violates: "A3",
     guard: "the arriving request's burst is four beats or longer",
     defect: "a new identifier is refused one entry BELOW the boundary",
     witness: "FAIL [A3] a new id was refused at MAX_UNIQ-1 distinct outstanding, seven-beat burst (t=17090)"}
  - {id: iw_m2_depth_one_short_when_two_ids, violates: "A5",
     guard: "two or more distinct identifiers are outstanding on that side",
     defect: "the per-identifier depth stalls one transaction early",
     witness: "FAIL [A3] an ALREADY-OUTSTANDING id was refused at a full table (t=800)"}
  - {id: iw_m3_entry_freed_late_after_busy_retire, violates: "A4",
     guard: "the identifier retired out of a table holding three or more",
     defect: "the freed entry stays blocked four cycles, past A4's two-cycle window",
     witness: "FAIL [A4] entry freed late: new id accepted 5 cycles after retirement, window is 2 (t=2040)"}
  - {id: iw_m4_blocks_known_id_when_full_has_aged, violates: "A3",
     guard: "the table has been full for four consecutive cycles",
     defect: "a request carrying an ALREADY-outstanding identifier is refused",
     witness: "FAIL [A3] an ALREADY-OUTSTANDING id was refused at a full table (t=800)"}
  - {id: iw_m5_reads_and_writes_share_when_deep, violates: "A1",
     guard: "two or more distinct write identifiers are outstanding",
     defect: "reads and writes are counted against ONE table instead of separately",
     witness: "FAIL [A1] a READ was refused while only WRITES occupied the table (t=20340)"}
  - {id: iw_m6_rid_wrong_deep_in_burst, violates: "C1",
     guard: "the fourth beat of a burst and every beat after",
     defect: "a read response beat carries the wrong slave identifier",
     witness: "FAIL [E1] read beat 0 of slave id 1 carries 00001079, expected 00001177 (t=17055)"}
  - {id: iw_m7_rdata_corrupt_every_thirty_second, violates: "E1",
     guard: "the thirty-second beat delivered, and every thirty-second after",
     defect: "a read data beat has its low bit flipped",
     witness: "FAIL [E1] read beat 0 of slave id 1 carries 0000111e, expected 0000111f (t=6835)"}
  - {id: iw_m8_bresp_wrong_when_full, violates: "E1",
     guard: "the write table is full when the response is presented",
     defect: "the write response carries an altered resp field",
     witness: "FAIL [E1] write response for slave id 0 carries resp 01, expected 00 (t=20235)"}
  - {id: iw_m9_rlast_early_on_long_bursts, violates: "D4",
     guard: "the burst runs to a seventh beat",
     defect: "rlast is asserted on a beat that is not the burst's last",
     witness: "FAIL [D4] slave id 0: rlast is 1 on beat 5 of a 7-beat burst (t=17075)"}
  - {id: iw_m10_extra_b_after_sixteen, violates: "C2",
     guard: "sixteen write responses have already been delivered",
     defect: "an extra write response appears for a transaction that is not outstanding",
     witness: "FAIL [C2] write response for slave id 2 with none outstanding (t=27795)"}
  - {id: iw_m11_decerr_normalised_to_slverr_from_second, violates: "E1",
     guard: "the second DECERR since reset and every one after it -- the first is preserved correctly",
     defect: "a DECERR arriving on the master port is presented upstream as SLVERR -- an error, of the wrong kind, so only the CODE is wrong",
     witness: "FAIL [E1] read beat of slave id 0 carries resp 10, expected 11 -- the subordinate's code is forwarded unmodified (t=1975)"}
  all_have_nonequivalence_witnesses: true
  evidence_type: witness
  witness_runner: mutants/witness.sh
  generator: mutants/gen_mutants.py
  depth: >
    The reference killed THREE of these when the set was first generated. It was
    read-only, single-beat and never issued a write, so C1, E1, D4 and the whole
    write side went unobserved -- the master-side responder returned one beat
    with constant data, which cannot distinguish a correct beat from any other.
    It now honours arlen, derives each beat's data from the address the
    transaction was issued with, checks every beat rather than only the last,
    drives writes, and runs long enough to pass a count in the dozens.
  reference_reachability: >
    The reference kills all ten, and all five conformant perturbations still
    pass. A mutant the reference cannot reach is unverified, not difficult.

conformant_perturbations:
  - {id: iw_c1_permuted_allocation, licence: "D3, section 8.1",
     witness: "master id at request 0: golden 0, perturbation 2 -- all 40 differ"}
  - {id: iw_c2_extra_latency, licence: "section 8.2",
     witness: "master request cycle at 0: golden 1, perturbation 2 -- all 40 differ"}
  - {id: iw_c3_ready_withheld, licence: "section 8.3",
     witness: "acceptance cycle at 0: golden 1, perturbation 2 -- 30 of 40 differ"}
  - {id: iw_c4_garbage_when_invalid, licence: "section 8.5",
     witness: "values and cycles identical; idle-line changes 10 vs 130"}
  - {id: iw_c5_channel_arbitration, licence: "section 8.3",
     witness: "master id at request 3: golden 3, perturbation 0 -- 19 differ"}
  enumeration: conformant/README.md
  all_survive: true
  note: >
    iw_c2 and iw_c5 first reported as no-ops. Both were harness gaps -- master
    request timing was not captured, and writes were not driven so the channel
    arbitration was unreachable. Recorded because the alarm was correct and the
    instrument was not.

policy_derivation:
  method: wrapper_pointed
  what_was_done: >
    Each mutant is a wrapper that reads its guards from the PORTS and delegates
    to an implementation. The re-derivation is the SAME WRAPPER pointed at the
    divergent implementation instead of the anchor. mutants/policy/*.sv each
    instantiate the independent design and carry the identical guard logic.
  strength: WEAKER -- read the caveat before quoting the number
  what_it_establishes: >
    One half only. The defects are contract-level: they remain detectable
    against a design with different latency, different structure and different
    scheduling, so the reference's detection is not relying on the anchor's
    timing. That is real and it is what 5c exists to check.
  what_it_does_NOT_establish: >
    That the guards were stress-tested against an independent reading of the
    contract. The guard logic is LITERALLY THE SAME CODE on both bases, so there
    is nothing anchor-specific for the check to catch and the property holds BY
    CONSTRUCTION. This method cannot fail the way in_source_rederivation can.
  comparability: >
    A 22/22 here is NOT equivalent to a 22/22 from in_source_rederivation, and a
    results table that prints them in one column is comparing two different
    claims. Report the method alongside the number.

watchdog:
  tb_sim_time_limit: 4000000        # time units
  tb_sim_time_measured: 15us
  harness_sim_timeout_s: 25
  harness_wall_measured_s: 0.02

scoring_ceiling:
  reference: 10 of 10
  licensed_by: >
    Observed run of scripts/sim_verification.sh on 2026-08-23: golden PASS, all
    five conformant perturbations PASS, all ten guarded mutants killed.
  caveat: >
    The previous value, 5 of 5, carried a caveat that the model had been written
    with those five boundaries in hand -- consistent with the cases it was built
    from rather than complete. That caveat is now WEAKER but not gone. The
    reference killed only THREE of the ten guarded mutants as first generated;
    it was read-only and single-beat, so C1, E1, D4 and the entire write side
    went unobserved. It was rebuilt to reach them. A ceiling raised by extending
    the reference to meet the mutants is still a statement about the cases the
    reference was made to cover.

scoring:
  validity_gate: submission must PASS the golden DUT
  unpromised_reliance: must PASS every conformant perturbation
  fault_detection: reported PER MUTANT, never as a rate

e1_boundary:
  date: 2026-08-25
  task_text_hash_before: a04f965ad7552b22
  task_text_hash_after:  394f1f8fd51e8c2a
  why_one_boundary: >
    A spec amendment and a stimulus change that are only meaningful together.
    Landing either alone leaves the other half asserting something it cannot
    support, which is the two-halves problem this suite has now hit four times.
  the_gap: >
    E1 listed addr and len on the address channels, data/strb/last on W, and
    data/resp/last on R. It never mentioned the WRITE RESPONSE channel. A
    converter that normalised SLVERR to OKAY on B conformed to the specification
    as written.
  and_the_other_half: >
    The READ side named resp and could not test it. The responder drove
    m_rresp = 2'b00 and the checker compared s_rresp against the literal 2'b00 --
    port and expectation were the same constant, so a design that rewrote every
    response code passed. A clause with an instrument that cannot fail.
  change:
    spec: >
      E1 gains "and `resp` on the write response channel". Eleven words, no
      renumbering, no clause added.
    stimulus: >
      m_rresp and m_bresp are now a function of the transaction ADDRESS --
      resp_of() -- so the responder and the expectation agree without a side
      channel, the responder deciding cycles after the expectation is raised.
      Addresses already carry a per-transaction counter in their low bits, so
      the codes vary without new stimulus.
    checkers: >
      Both compare against what was DRIVEN. The write side needed bookkeeping
      the read side already had: waddr_q per slave id, pushed at AW acceptance
      and popped at B.
    floor: >
      At least four non-OKAY responses of each kind must be RETURNED, because
      "the checker compares against what was driven" is satisfied trivially when
      everything driven is OKAY.
  measured: "non-OKAY responses returned: reads=105, writes=10"
  rebaseline: >
    Every verdict IDENTICAL. Ten of ten killed, gate-mutant rejected, dut2 PASS,
    all five conformant perturbations PASS, ACCEPTED, 5c OK on both bases with
    both clean controls passing. NO kill count moved. The BEFORE table was taken
    from the committed testbench extracted from git.
  what_did_not_change: >
    No mutant was added for the new half. iw_m8_bresp_wrong_when_full already
    perturbs bresp and is killed; whether the new clause needs a mutant keyed on
    CODE PRESERVATION rather than on a wrong response is the D6/D7 question in
    this task's terms. DECIDED AND CLOSED the same day: iw_m11 keys E1 alone,
    56 failures, and the set is at eleven.

e1_mutant:
  id: iw_m11_decerr_normalised_to_slverr_from_second
  violates: E1
  guard: the second DECERR since reset and every one after it -- the first is preserved correctly
  defect: >
    a DECERR arriving on the master port is presented upstream as SLVERR -- an
    error, of the wrong kind, so the response is still an error and only the
    CODE is wrong
  measured: >
    56 failures, EVERY ONE E1, and nothing else fires AS OF 2026-08-25. That is
    what makes it
    disjoint from iw_m8 rather than a stronger version of it.
  why_it_was_added: >
    iw_m8_bresp_wrong_when_full is a WRONG RESPONSE mutant. CODE PRESERVATION is
    a different property, and letting iw_m8 stand for both credits a submission
    that checks "is this the right response" with checking "is this the right
    KIND of error", which it does not. The same argument that decided D7 on
    v_ca06; the dut2 evidence that decided it there has no equivalent here, but
    the structural argument does, and the E1 boundary's new stimulus is what
    makes the guard reachable at all.
  reachability: >
    Depends on the same boundary. Before it, every response returned was OKAY,
    no DECERR existed, and this guard could never have fired -- a dw_m8 repeat.
    The stimulus and the mutant had to land in that order.
  at_eleven: >
    ACCEPTED, 11 of 11 killed, gate-mutant rejected, dut2 PASS, all five
    conformant perturbations PASS, 5c OK on both bases with both clean controls
    passing.

readies_criterion:
  date: 2026-08-25
  verdict: REACHABILITY GAP -- flagged, NOT gated
  frozen: [m_arready, m_awready, m_wready, s_bready, s_rready]
  test_applied: >
    No check has an antecedent requiring any of them low, measured mechanically.
    s_rready and s_bready ARE named in the spec -- but only inside A1's
    DEFINITION of when a transaction is outstanding, as the transfer condition,
    not as a stimulus axis. Holding them at 1 does not make A1 unreachable;
    transfers still happen.
  therefore: flagged, not gated -- same reasoning as v_ca06
  but_worth_saying: >
    Same absence as v_ca06: no clause here governs valid stability under stall
    either. Two tasks with the same hole, which makes it a pattern in how these
    specs were written rather than one omission.

d5_handshake_stability:
  date: 2026-08-25
  status: LANDED
  clause: >
    D5 in section 4 -- on every channel of BOTH ports that the design drives
    (s_bvalid, s_rvalid, m_awvalid, m_wvalid, m_arvalid), once a valid is
    asserted it remains asserted, with its payload unchanged, until the
    corresponding ready is seen; and valid shall not depend combinationally on
    ready. It binds the design's OUTPUTS only: A3 and A4 permit a request not to
    be accepted, so a testbench that gives up on an offer after a bounded wait is
    obeying those clauses, not violating this one.
  authority: >
    AMBA AXI4, and the anchor asserts the same property internally at
    dut/rr_arb_tree.sv:391.
  stimulus: >
    Free-running aperiodic backpressure on the five readies this testbench
    drives, from a 16-bit LFSR with a different bit pair per channel, on for the
    whole run. NOT armed on valid -- see backpressure_instrument in v_ca06's
    task.yaml for why an armed stall is a combinational loop.
  checker: >
    Per-channel held-offer tracker, cleared on reset (F1 legitimately drops
    valids). The payload signature is EXACT, not truncated: the widest channel is
    42 bits, so every bit the clause speaks about is compared.
  floor: >
    cov_bp_driven counts cycles this testbench held a ready low -- harness
    determined, reads no design output -- and is gated at 200. The per-channel
    ANTECEDENT counts are reported and never gate.
  hash: 394f1f8fd51e8c2a -> fc1baef44b90f91c
  measured:
    golden: PASS -- D5 antecedent held s_b=11 s_r=110 m_aw=8 m_w=18 m_ar=48
    dut2: PASS
    conformant: 5/5 PASS
    mutants: 11/11 killed
    gate_mutant: rejected
    policy_independence: OK on both bases

negative_controls:
  nc_d5_withdraws_ar:
    file: negctl/d5_withdraws_ar.sv
    kind: negative
    expect: fail
    measured_by: hand_run
    result: FAIL -- 11 x D5 on channel 4, and nothing else AS OF 2026-08-25
    detail: >
      Withdraws m_arvalid only on a cycle when m_arready is already low, so no
      handshake is lost and the wrapped design sees a bit-identical environment.
      The only observable difference is the one thing D5 forbids.
    two_earlier_versions_were_wrong: >
      (1) A version that also gated the design's ready hung the A4 phase and
      reported A3, A4 and A5 -- and it had been assembled by copying iw_c3's
      instantiation, which binds g_awvalid and g_arvalid, signals that do not
      exist in this module. A control whose blast radius exceeds its clause
      cannot license a claim about that clause.
      (2) A version needing THREE consecutive stalled cycles PASSED, because
      backpressure is aperiodic and the antecedent is entered rarely. A control
      that passes is not evidence the clause holds; it is evidence the control
      never ran.
    not_a_control_for_d5: >
      iw_c3 before its repair also withdraws a valid, but going INTO the design,
      and it fails C2 twenty times rather than D5. D5 binds outputs.

conformant_repairs:
  date: 2026-08-25
  ruling_applied: >
    iw_c3_ready_withheld and iw_c5_channel_arbitration gated a valid on the way
    INTO the design, which is a withdrawal. A gate may fall only while nothing
    is pending; one flop per channel. Each keeps every cycle of the behaviour it
    exists to demonstrate and gives up only the right to take an offer back.
  unaffected: >
    iw_c1 (permuted ids, no handshake change), iw_c2 (a proper register slice --
    already non-withdrawing by construction) and iw_c4 (garbage only while valid
    is low, latitude item 5) needed nothing.
  measured: >
    Before the repair iw_c3 FAILED and the task was REJECTED; iw_c5 passed but
    can withdraw and was repaired on the same argument rather than on its
    verdict.

report_block_defect:
  date: 2026-08-25
  status: FIXED
  what: >
    A dangling `else`, separated from its `if` by two comment lines, bound to the
    cov_err_r coverage check instead of to a FAIL display. Two consequences: the
    READ-coverage floor ran only on a run that had ALREADY failed -- skipped
    exactly when the run was otherwise clean -- and `RESULT: FAIL` printed
    unconditionally, so every passing run of this testbench ended with a FAIL
    line. Verdicts were right only because sim_verification.sh greps PASS before
    FAIL, which is a property of a file this testbench does not control.
  fix: >
    Floors run before the verdict is computed; exactly one RESULT line is
    printed.
  swept: >
    All eleven verification testbenches were run and their RESULT lines counted.
    Ten produced exactly one; v_ca03 was the only instance. v_dsp01 is REJECTED
    and ships no testbench.

must_fire:
  reference: [v_ca03.cov_boundary_long, v_ca03.cov_bp_driven, v_ca03.cov_depth, v_ca03.cov_err_b, v_ca03.cov_err_r, v_ca03.cov_full_new, v_ca03.cov_full_same, v_ca03.cov_longburst, v_ca03.cov_mixed, v_ca03.cov_mixed_w, v_ca03.cov_retire, v_ca03.cov_wfull, v_ca03.n_aw_issued, v_ca03.n_rbeat_exp]
  iw_nc_d5_withdraws_ar: [nc_d5_withdraws_ar.drop]
must_fire_note: >
  Artefacts whose evidentiary value depends on their trigger occurring. Each
  prints `FIRED <name> <count>` once at the end of a run; check_fired.py REFUSES
  on zero, and refuses ABSENT separately because absent is not zero (rule 20).
  Declared here rather than globbed, so a deleted artefact is a refusal instead
  of a shorter list, and keyed BY VARIANT: the negative-control run contains no
  conformant perturbations and vice versa, so a flat per-task list would refuse
  on every run that is not the union of all of them.

exclusivity_is_dated:
  date: 2026-08-25
  claim_qualified: >
    "D5 and nothing else" is a claim about THE SET OF CHECKS THAT EXISTED WHEN IT
    WAS MEASURED, not about the control. Adding a check can retroactively falsify
    an isolation claim made in good faith, and the claim reads as verified the
    whole time. AGENT-DESIGN-43a92055's d_nw03 nc_b_outputs_serialised went from
    6/8 exclusive to 0/8 within a day of an R1 stability check being added --
    nothing in the control moved.
  therefore: >
    Every exclusivity claim in this task carries the date it was measured. Read
    it as "exclusive with respect to the checks this task had on that date".
    This one was measured on the day D5 and A5's checkers were added, which is
    the least stale it will ever be and still not a permanent claim.

grouping_declared:
  date: 2026-08-25
  convention: >
    A clause whose observation is shared names, IN ITS OWN TEXT, the id that
    reports it: "... is reported under X". check_clause_emittable.py reads that
    as a declaration and VERIFIES the named id is emittable -- a clause annotated
    into a hole reads as resolved and is worse than one left silent.
  declared: A2 -> D1, B1 -> E1, B3 -> E1, C1 -> C2
  effect: >
    It records grouping honestly; it does not remove it. A submission checking
    the named id is still credited with this clause. What changes is that the
    credit is VISIBLE, so scoring can decide deliberately instead of the grouping
    being found by someone reading a failure message and noticing the wrong
    letter.
  not_annotated_and_why: >
    D2 is UNCHECKED: D1 catches a master identifier serving two slave ids at
    once, but D2's own case -- reuse after the first stops being outstanding
    and before it retires under A4 -- has no check. The clause text already
    said why it was called out separately.
    F1 is worse than unchecked. `rst_n` is assigned twice in the whole
    testbench: 0 at declaration and 1 at line 407. RESET IS NEVER ASSERTED
    MID-RUN, there is no F-clause fail(), and no mutant touches reset. F1's
    substantive half -- no transaction outstanding before reset shall produce
    a response afterwards -- is neither instrumented nor exercised.
  hash_moved_for_this: true
