scored_configuration:
  SV: 39
  XLEN: 64
  VLEN: 64
  PLEN: 56
  ASID_WIDTH: 16
  NrPMPEntries: 8
  ITLB_ENTRIES: 16
  DTLB_ENTRIES: 16
  SHARED_TLB: none
  rationale: >
    One configuration; the task does not parameterise geometry. The TRANSLATION
    STORAGE is normative (spec P2) rather than a design choice, and that is the
    load-bearing decision on this task -- see storage_is_pinned below.
  storage_is_pinned: >
    Correctness never depends on TLB capacity: the walk resolves every miss and
    spec A9 requires the two paths to agree. So if capacity were free, the
    dominant strategy would be ZERO ENTRIES -- walk everything, satisfy every
    functional clause, take the smallest area. The same argument makes
    direct-mapped strictly dominate fully-associative when hit rate is unmeasured,
    and makes deleting a second-level TLB free area. The comparison would rank
    submissions by who read the capacity clause closely rather than by design
    quality. Pinned at the harvested reference values: InstrTlbEntries 16,
    DataTlbEntries 16, UseSharedTlb 0. See rule 25 and F69.
  storage_share_measured: >
    Pinning fixes 45.5% of the reference's area: 3,467 flip-flops at 25.02 um^2
    each, 86,744 of 190,561 um^2, against a field-list floor of about 3,168 flops
    for 32 entries -- within 9%, because the declared-but-unused gpte field and the
    whole shared TLB constant-fold away at RVH=0 and UseSharedTlb=0.
  replacement_policy_left_free: >
    Deliberately. The storage is already fixed, so no area is won by choosing one
    victim-selection policy over another, and pinning it would mandate a specific
    circuit for no measured benefit. T2 therefore does not score
    lsu_dtlb_hit_o/itlb_miss_o/dtlb_miss_o either -- scoring them would pin the
    policy A9 declined to pin.

scored_axes:
  # Two axes, REPORTED SEPARATELY. Not folded into a scalar: that needs a
  # cycle-per-square-micron exchange rate nobody can defend, which is rule 22's
  # refusal to weight area against frequency, applied again.
  - axis: correctness
    kind: gate
    surface: lsu_valid_o, lsu_paddr_o, lsu_exc_valid_o, lsu_exc_cause_o and the
             fetch equivalents, bit-exact over the 118 requests of sequence C
    note: fail it and NO PPA number is produced
  - axis: total_cycles
    kind: reported
    where: sim record, metrics.total_cycles
    reference_value: 832
    note: >
      THIS AXIS IS WHY SERIALISATION IS NOT FREE. Without it, one comparator swept
      across the 16 TLB entries, one PMP comparator instead of eight, and a
      per-entry flush clear instead of a generation counter were all dominant
      strategies -- smaller area at no measured cost. Validated by
      nc_b_serial_response, which passes correctness with 0 failures and moves
      cycles 832 -> 2,651.
  - axis: area
    kind: reported
    where: ppa record, design_area_um2 / synth_area_um2
    reference_value: 190561.51
    note: >
      Validated by nc_c_bloat_storage, which passes correctness, leaves cycles
      byte-identical at 832, and moves area 190,561 -> 329,980 with an exact
      +4,096 flop delta.

reporting_requirement_for_agent_1:
  status: REQUIREMENT, not a suggestion
  what_exists: >
    The join key ALREADY EXISTS and is ALREADY ENFORCED. write_run_record.py puts
    submission_sha256_16 on the sim record; ppa_candidate.sh computes the same
    sha256-16 of the submission and REFUSES to build unless a runs/<task>/*__sim.json
    carries the same value with all_passed. Verified by running its gate snippet
    verbatim against two files with different hashes and one sim record: the
    matching sha was ACCEPTED and paired, the other REFUSED.
  what_is_needed: >
    report_table.py must PAIR the cycle metric (sim record) with the area figure
    (ppa record) USING submission_sha256_16, and must refuse to display a pair
    whose identifiers differ. Cycles come from simulation and area from
    place-and-route -- different tools, different runs -- so the records stay
    separate and the join is a reporting concern. But without the key enforced at
    the reporting step, a submission could be shown with cycles from one build and
    area from another, accidentally or otherwise.
  not_done_by_me: scripts/ is Agent 1's; this is flagged rather than edited.

vectors:
  files: [vectors/vectors_sv39.hex]
  records: 118
  record_bits: 190
  captured_by: tb/audit/capture_vectors_tb.sv
  sequence: >
    SEQUENCE C, defined once in tb/sv39_mmu_seq.svh and included by BOTH the
    capture rig and the scoring testbench -- a sequence that lived separately in
    each would present a silent divergence as a mismatch on every request.
    7 functional cases, 2 bare-mode, 2 flush, 16-page fill, 16-page replay, a 17th
    page, 17-page replay, then 57 reuse requests.
  hit_ratio_is_a_construct: >
    51% TLB hits, AND THAT IS A SCORING CONSTRUCT, NOT A WORKLOAD CLAIM. The mix
    was chosen to price serialisation: at the functional probes' 20% hit rate a
    swept comparator costs almost nothing and the cycle axis cannot discriminate;
    the reuse passes lift it to where a swept comparator costs 3.19x. No working
    set is modelled and no address trace is replayed. Quote it as "the scored
    sequence is 51% hits by construction", never as "the MMU sees 51% hit rates".
    MEASUREMENTS.md section 9.

