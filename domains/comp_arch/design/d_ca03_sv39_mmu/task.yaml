  - {name: nc_d_no_resident_tlb,  targets: "T4 capacity",         verdict: FAIL, failures: 212}
  - {name: nc_e_super_offset,     targets: "A2 superpage offset", verdict: FAIL, failures: 2}
  - {name: nc_f_ad_ignored,       targets: "A5 fault-on-unset",   verdict: FAIL, failures: 6}
  - name: nc_g_itlb_one_entry
    targets: "T9, instruction TLB capacity"
    verdict: "FAIL at ITLB=1, PASS at ITLB=16"
    failures: 1
    total_cycles: 1627
    note: >
      CAPABILITY-REDUCED, in nc_g's shape on d_ai01. The second source with its
      instruction TLB pinned to one entry and ports left full width, so it
      answers every request correctly and only discards capacity. At ITLB=1 it
      fails T9 ALONE with ZERO per-step T1 failures -- a miss walks and returns
      the same translation, so nothing on the scored surface can catch it. That
      isolation is what makes T9 credible rather than merely passing.
      .
      POLARITY IS INVERTED from d_ai01's nc_g: there the TASK varies (HEIGHT 4
      or 8) and the control passes at the small geometry. P1 and P2 give this
      task ONE configuration, so what varies is the control's own literal, and
      it fails at the small capacity and passes at the large one.
      .
      REGENERATE THIS FILE whenever the second source changes -- it is a copy
      with one literal altered, and the first version was derived before A8 was
      rewritten and failed at BOTH capacities on its source's stale PMP check,
      reporting a defect that belonged to its source rather than to the
      perturbation under test.

  one_control_per_axis: >
    nc_b and nc_c are not correctness controls -- both PASS by design. They prove
    the two scored axes are live and INDEPENDENT, each moving only its own axis.
    Without both, a broken measurement on either would pass silently.
  the_area_control_failed_first: >
    Worth recording because it is the exact silent failure the control exists to
    prevent. The first nc_c terminated its register chain in a local wire,
    synthesis deleted all 4,096 flops, and the "bloated" build measured 190,469
    um^2 -- SMALLER than the reference. It now drives lsu_dtlb_ppn_o, which T2
    does not score, so the storage is load-bearing for a real output and survives.
    The exact +4,096 flop delta is how the fix is known to have worked.
  t4_validated_before_gating: >
    Rule 24. The 16-page replay returned 0 page-table reads on every request and
    the 17-page replay returned 6 on every request, measured against the
    reference, BEFORE the assertion was wired as a gate.

second_source:
  status: PRESENT -- PASS, 175 of 175 requests
  file: tb/sv39_mmu_alt_ref.sv
  metrics: {total_cycles: 977, pte_reads: 292, tlb_hits: 104, hit_pct: 50}
  divergence_from_reference: >
    1.30x fewer cycles (977 against 1,269) and 1.72x fewer page-table reads (292
    against 502), from the three deliberate structural choices the file's header
    names: a one-cycle parallel flush against the reference's 139, a fully
    combinational 16-way lookup, and one parallel PMP comparator bank shared
    between the walker's reads and the final address. Its instruction TLB also
    retains all 16 entries where the reference's retains one, which is where most
    of the read difference comes from. Both designs are conforming; the two axes
    separate them, which is what L1 exists for.
  defects_it_found: 4
  defect_summary: >
    1. A11 did not exist: whether valid_o accompanies a fault was unstated and
       scored on all four faulting requests, and L2's own wording pointed the
       wrong way. 2. paddr_o on a faulting request was scored and reports where
       the failing check was made, which A5 leaves free -- now unscored by T2.
       3. The sequence never drove fetch_req_i, so the whole instruction surface
       T1 declares scored went unexercised and T4 only ever reached the data TLB
       -- now T8. 4. The rig took retirement from whichever output rose first,
       which is wrong on the instruction port because the reference holds
       fetch_exc_valid_o for the whole of an in-flight walk; every fetch was
       recorded as an access fault at cycle 0. Chasing 4 exposed that T4's
       policy-independence claim was false, which is T9.
  authoring_constraint: >
    WRITTEN AGAINST spec/sv39_mmu_iface.sv ALONE. ref/sv39_mmu_ref.sv is NOT to be
    opened while implementing it, and neither is any file under refs/cva6/. This is
    a binding constraint on the work, not a preference, and it holds for whoever
    picks it up.
    .
    THE REASON, concretely. If the author can see the reference, a spec gap gets
    filled silently from it and the exercise loses exactly the defects it exists to
    surface. That is not hypothetical here: d_ca03's L2 hole -- a clause relaxed on
    the strength of a harness sampling bug and left standing after the harness was
    fixed -- survived my own review of the spec and only fell out when the
    obligation was measured independently. An author with the reference open would
    have implemented whatever it does and never noticed the text was undecided.
    .
    ADJUDICATE AFTERWARDS, NOT DURING. When the second source and the reference
    disagree, run the failing input through the anchor and take rule 5's three
    branches in order -- second source wrong, reference wrong, or spec ambiguous
    and both legal. Doing that adjudication while still writing the implementation
    collapses it into "make it match", which is the failure mode this constraint
    prevents.
    .
    CONTAMINATION ALREADY PRESENT, stated rather than claimed away: I wrote the
    shim, so I know the anchor's port semantics, the PTW's memory handshake, the
    TLB entry field list and the PMP config layout. I have not read the walker FSM
    or the TLB lookup logic. The structural differences below are therefore
    deliberate opposites of a partially known design, which is weaker evidence than
    a genuine clean room, and it is labelled that way.
  expected_yield: >
    Contract defects, and each one is the deliverable rather than an obstacle.
    d_ai01's second source found three (A10 unpinned, C2 over-claimed, C3/C4
    transition silence) plus the T5 tool gap, and none was visible to any of its
    seven negative controls.

