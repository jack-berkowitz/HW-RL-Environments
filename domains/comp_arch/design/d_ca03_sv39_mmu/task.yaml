title: RISC-V Sv39 MMU -- page-table walker, TLBs, PMP
id: d_ca03
module: sv39_mmu
domain: comp_arch
type: design
catalog: TASK_CATALOG.md
procedure: TIER-B
task_text_hash: b05dbe9522c9ff2e

catalog_divergence: >
  The catalog row d_ca03 reads `mmu_sv39_full`: "Integrated MMU: PTW, TLB, ASID
  handling, superpages, fault generation and prioritization". The contract here is
  named for what it pins rather than for the anchor module, and it ADDS one thing
  the row does not mention: PHYSICAL MEMORY PROTECTION. PMP is not optional here,
  it is in the page-walk path -- cva6_ptw.sv:250 instantiates the pmp module
  directly, and with no PMP region configured a U-mode walk is denied and reports
  cause 5 rather than translating. A spec that omitted it would be describing a
  different module. Recorded and reported; I do not own TASK_CATALOG.md.

oracle_class: A
reference:
  refs_lock_repo: openhwgroup/cva6
  file: refs/cva6/core/cva6_mmu/cva6_mmu.sv
  licence: Solderpad 0.51
  mode: vendor
  closure: [cva6_tlb, cva6_shared_tlb, cva6_ptw, pmp, pmp_entry, lzc, lfsr,
            cf_math_pkg, riscv_pkg, config_pkg, cv64a6_imafdc_sv39_config_pkg,
            build_config_pkg, ariane_pkg]
  shim: ref/sv39_mmu_ref.sv
  shim_top: ref/sv39_mmu_top.sv
  why_this_boundary: >
    THE COMPOSITION IS ITSELF A MODULE. cva6_mmu instantiates two cva6_tlb, a
    cva6_shared_tlb, a cva6_ptw and a pmp, so one port list covers 2,869 lines of
    walker, TLB and protection logic. That is exactly what d_ai01 lacked --
    RedMulE's array-plus-buffers composition existed only as siblings under
    redmule_top, no shimmable boundary exposed it, and the task premise was
    refuted. The boundary was checked before any spec text was written.
  why_it_is_testable: >
    THE PAGE TABLE IS EXTERNAL. req_port_o/req_port_i are ports, so the walker's
    memory accesses are driven by the testbench and the contract reduces to "given
    these page-table entries, deliver this address or this fault". No memory model
    lives inside the reference.
  shim_note: >
    Parameter binding, rename, struct flatten and reassembly only. CVA6Cfg is
    build_config(cv64a6_imafdc_sv39_config_pkg::cva6_cfg) -- a PREBUILT
    configuration, not one assembled here. `imafdc` has no `h`, so the package
    sets CVA6ConfigHExtEn = 0, "always disabled"; HYP_EXT is 0 and every G-stage
    port is tied off.
  struct_hazard: >
    THE PART MOST LIKELY TO GO SILENTLY WRONG. cva6_mmu takes its port types as
    `parameter type`, and the concrete types are in NO PACKAGE: cva6.sv declares
    them as anonymous `localparam type` structs inside its own parameter list. The
    shim reproduces them field for field and then checks each with $bits() against
    the width its field list must produce. Copying carefully is not the control;
    the assertion is. This is d_dsp01's FP4 mask (F53) in a new costume.
    Incidentally `cbo_t` is not a package type either -- it is `logic [7:0]`,
    cva6.sv:174.
  config_assertions: >
    The shim $fatal's at elaboration unless RVH=0, XLEN=64, SV=39, PtLevels=3,
    PLEN=56, VLEN=64, ASID_WIDTH=16 and NrPMPEntries=8. Every one was also
    confirmed by RUNNING before the spec was written, not by reading the config
    file name.

anchor_conformance:
  status: VERIFIED_BEFORE_USE
  method: five probes under tb/audit/, all recorded in MEASUREMENTS.md
  elaboration:
    verilator: "0 errors"
    slang: "clean, 0.61 s, 108 MB peak"
  functional: >
    Three-level walk delivers pa 0x5000 in 14 cycles; the same page again in 1
    (TLB hit); a 1 GiB superpage in 6, with the offset within the superpage
    preserved (0x4000_0001, not 0x4000_0000); an invalid PTE and a leaf without U
    accessed in U mode both raise cause 13.
  implementation_defined_choices_measured:
    - "A/D POLICY. RISC-V permits either hardware update during the walk or a
       fault leaving software to set the bits. THIS ANCHOR FAULTS AND NEVER WRITES
       A PAGE-TABLE ENTRY: load through a leaf with A=0 gives cause 13, store
       through a leaf with A=1 D=0 gives cause 15, and the entry is byte-identical
       in memory afterwards. Pinned in spec A5."
    - "PMP PRIORITY. An access fault from the walker's own PMP check precedes any
       page fault the returned entry would cause. Measured: with no region
       matching, a walk that would page-fault reports cause 5; the same walk
       reports 13 once a permitting region exists. That 5 -> 13 transition is the
       evidence both mechanisms are live and separable. Pinned in spec A7/A8."
  probe_defects_found:
    - "The first walk probe returned pa=0 with cause 5 and looked like a broken
       walker. It was PMP denying a U-mode access with all eight entries zero --
       an instrument defect, not an anchor defect."
    - "The harness POLLED lsu_valid_o as a level once per cycle. A
       flush_i-cancelled walk produces a narrow pulse, so the recorded reference
       for the flush-mid step read valid=0 when the design had asserted valid, and
       a control that latched internally then disagreed with a vector that was
       itself wrong. Retirement is now LATCHED. Third appearance of this shape in
       this project."

