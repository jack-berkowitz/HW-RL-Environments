      16.852 ns. Required is period - 0.213, so it closes at >= 21.33 and 25 ns
      leaves +2.94 ns for place-and-route.

ppa: ABSENT
ppa_note: >
  Agent 1 owns PPA. Tier-B pins a fixed clock period rather than sweeping fmax. No
  place-and-route run exists. Note that the fixed period matters more here than on
  most tasks: with cycles scored (L1) and area compared at a pinned period (G2), a
  design cannot buy frequency by pipelining harder -- the stages cost area and the
  period is not swept -- and cannot buy area by serialising, because that costs
  cycles.

skipped_under_tier_b: [mutant_set, formal_EC_per_task]
# find_fmax IS NOT SKIPPED. Tier-B drops the PER-CANDIDATE frequency search, not
# the reference measurement: find_fmax.py runs ONCE on the reference to derive the
# pinned clock period, and that number is a task-construction constant rather than
# a result. The earlier wording listed find_fmax here, which reads as "never run"
# and would leave the pinned period underivable.
fmax_use:
  scored_axis: false          # candidates are neither ranked nor rewarded on frequency
  reference_measurement: PENDING -- Agent 1 holds the sweep until this bump lands
  recipe: pinned_period_ns = roundup(1.5 * converged_period_ns, 0.25)
  units_caution: >
    find_fmax.py emits BOTH converged_period_ns AND achieved_fmax_mhz in the same
    record. The recipe takes the PERIOD. Taking the frequency field yields a
    0.667x period no design can close, and the failure presents as every
    submission missing timing rather than as a wrong pin.

difficulty_assessment: >
  Sv39 translation with three page sizes, Svnapot NAPOT pages, permission checks
  across U/S with SUM and MXR, ASID matching and global pages, the fault-on-unset
  A/D choice, six distinct fault causes, fault PRIORITY between access and page
  faults, and PMP checking on both the walker's own reads and the final address.
  Most of it carries external authority from the RISC-V privileged architecture,
  which is why this task needed three implementation-defined choices pinned rather
  than the dozen d_dsp02 and d_ai01 each needed.
  .
  The two scored axes make it harder than a correctness-only task: the obvious
  area optimisations all cost cycles, and the obvious cycle optimisations all cost
  area, with the period fixed so neither can be hidden.

