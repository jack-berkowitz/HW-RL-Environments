version_boundary:
  boundary: STIMULUS
  task_text_hash_before: 360afdc7295d5fd8      # my own last landed state
  task_text_hash_intervening: c2265a1e480ab767  # Agent 1's f19cd10, G5 + Fmax text
  task_text_hash_after: 7bc21e751be26fa2
  stimulus_changed: YES
  prior_results_comparable: NO
  what_changed: >
    THE SCORED STIMULUS CHANGED, from 118 requests to 207, so nothing measured
    before this boundary is comparable to anything measured after it. Stated
    plainly rather than left to be inferred from a differing hash.
    .
    Sequence C drove the LOAD/STORE PORT ONLY -- fetch_req was initialised to zero
    and never assigned. Sequence D added the instruction port. Sequence E made the
    instruction capacity fill HIT-INTERLEAVED, without which no residency check is
    possible against this anchor. Sequence F added PMP, privilege/SUM/MXR, and
    ASID/global phases, and moved the flush-mid step onto a NON-RESIDENT page --
    it had been targeting a page the previous step installed, so the request hit
    the TLB in one cycle and the flush arrived with nothing in flight to abort.
    C3's abort-and-restart and T5's cancelled-request check were both unexercised.
    .
    Clause changes in the same boundary: A8 rewritten from measurement (only the
    walker's reads are PMP-checked, and they need R; the final translated address
    is not checked at all); A11 added for the retirement handshake; T2 unscores
    paddr_o on a faulting request; T8 rewritten as a VARIATION requirement with
    three declared constants; T9 replaced -- the instruction TLB's capacity IS
    checkable and the structural flop count is dropped; T10 added for ASID and
    global pages.
  what_did_not_change: >
    NO RTL. The reference shim, the ORFS config and the SDC are untouched, so the
    190,561 um^2 synthesis area is unaffected BY THIS BOUNDARY.
  areas_are_not_final: >
    190,561 um^2 for the reference and 329,980 um^2 for nc_c_bloat_storage were
    both measured at the 25 ns STARTING CONSTRAINT in orfs/constraint.sdc, which
    is a derived logic-path figure and not a reference sweep. That constraint is
    about to change: Agent 1 pins at 1.5x the reference's measured period rounded
    up to 0.25 ns, and this design closes at >=21.33 ns, so the pin lands near
    32 ns. AT A LOOSER PERIOD BOTH AREAS MOVE. They are recorded here as measured
    and are NOT FINAL. The 1.73x ratio may survive; the absolutes will not.
  next_boundary_is_ppa:
    scope: >
      One boundary, not two, so no number is measured across two moving things:
      CORE_UTILIZATION and PLACE_DENSITY added to orfs/config.mk (absent today, so
      the raw task config cannot floorplan and a sweep dies at do-2_1_floorplan),
      the reference sweep, the pinned period, and the area re-baseline all land
      together with their own record.
    owner: Agent 1 -- values, sweep and re-baseline are all PPA-side
    blocked_on: nothing; this bump was the blocker and it has landed

