module: async_fifo_cdc
domain: comp_arch
type: design
catalog: TASK_CATALOG.md

# CLASS A -- external RTL oracle, proven against vendored PULP RTL.
oracle_class: A
reference:
  refs_lock_repo: pulp-platform/common_cells
  sha: 9ca8a7655f741e7dd5736669a20a301325194c28    # tag v1.39.0
  licence: SHL-0.51
  mode: vendor
  file: refs/common_cells/src/cdc_fifo_gray.sv
  shim: ref/async_fifo_cdc_ref.sv
  shim_note: >
    Renaming and parameter mapping only. No polarity inversion needed -- upstream
    already uses active-low resets in both domains, so every connection is
    wire-for-wire.

spec: spec/async_fifo_cdc_iface.sv
two_clock: true

# RULE 18 -- PPA, latency and throughput are measured ONLY here.
scored_configuration:
  DATA_W: 32
  LOG_DEPTH: 3          # depth 8
  SYNC_STAGES: 2
  rationale: >
    SYNC_STAGES=2 is the two-flop synchroniser, which is the standard answer:
    two stages give adequate MTBF at ordinary clock ratios and technologies, and
    three is reserved for extreme ratios or high-reliability parts. Choosing 3
    for scoring would make every submission pay for margin most designs do not
    buy.

    LOG_DEPTH=3 (depth 8) is the smallest power of two that comfortably absorbs
    the synchroniser round trip. A gray-pointer CDC FIFO cannot report occupancy
    faster than two stages each way, so roughly four cycles of staleness exist
    in each direction; depth 4 leaves almost no burst slack on top of that,
    while depth 8 does. This is where the interesting behaviour lives -- full
    and empty edges are reachable under burst traffic at depth 8 and mostly
    academic at large depths.

    DATA_W=32 is a word-width crossing, the common case, and wide enough that
    the storage array rather than the control logic dominates area.

    THESE COINCIDE WITH THE SHIM'S DEFAULTS, and that is not the reason. The
    reasoning above stands on its own; the coincidence is convenient because it
    means the existing measurements were already taken here.

# ---- F49: DISCRIMINATION AT THE SCORED SETTING, RE-MEASURED --------------
# F49 observes that SYNC_STAGES is scored at 2, and that the crossing-latency
# floor cannot tell a design that hardcodes two synchroniser flops from a
# correct one at that setting. RE-MEASURED DIRECTLY rather than read off F3's
# table, through the UNMODIFIED checker at the scored DATA_W=32/LOG_DEPTH=3:
#
#   design                        SS=2  lat.min  verdict     SS=3  lat.min  verdict
#   p3_ignores_sync_stages (2 hc)   2    PASS                  2    FAIL
#   second source (correct)         2    PASS                  3    PASS
#   reference (patched)             3    PASS                  4    PASS
#
# CONFIRMED AS STATED: at SS=2 the probe and a correct design are
# indistinguishable -- both read 2, both pass. The floor is lat.min >=
# SYNC_STAGES, and at 2 everything clears it.
#
# BUT THE CONSEQUENCE F49 IMPLIES DOES NOT FOLLOW, and this is the part that
# decides the question. The probe scores 9/18 on the CORRECTNESS SWEEP -- it
# fails all nine SYNC_STAGES=3 configurations -- and ppa_candidate.sh gates PPA
# on all_passed. A design that hardcodes two flops is REJECTED BEFORE IT IS
# SCORED. It cannot appear in the table with a clean capability number.
#
# DECISION: SYNC_STAGES stays at 2 for the scored configuration.
#
# The reasoning is not that engineering merit outweighs discrimination -- rule
# 18 as amended by F49 is explicit that merit alone does not establish
# discrimination. It is that THE DISCRIMINATION IS PERFORMED ELSEWHERE AND WAS
# MEASURED: the correctness sweep spans SYNC_STAGES 2 AND 3, so every design
# reaching the scored column has already demonstrated it honours the parameter
# at 3. Moving the scored point to 3 would relocate a check that already fires,
# make every submission pay for margin the standard two-flop design does not
# need, and invalidate every PPA number on this task.
#
# WHAT THE COLUMN THEREFORE MEANS, and this is the label the results table
# carries: min crossing latency at the scored setting is NOT a capability
# discriminator on its own. It is a property of designs that have already
# passed the binding check at SYNC_STAGES=3. Read alone it would not separate a
# correct design from a hardcoded probe -- the sweep does that, not this number.
capability_discrimination:
  scored_setting_discriminates: false
  discriminating_setting: 3
  enforced_by: correctness sweep (all 18 configs), not the scored metric
  probe_result: p3_ignores_sync_stages scores 9/18 and is gated out before PPA
  measured: 2026-08-19, unmodified checker, DATA_W=32 LOG_DEPTH=3

scored_metrics:
  - {metric: capacity_beats_accepted, label: "cap"}
  # The MINIMUM crossing latency is the capability -- it is what the design can
  # achieve, where the average is dragged around by stimulus. Named with the
  # `_min` suffix because the checker emits this metric as a NAMED line with
  # min/max/n fields, and the record writer now preserves that structure; it
  # previously dropped the name and filed the fields under bare min/max/n.
  - {metric: crossing_latency_rdclk_min, label: "lat.min"}
  - {metric: crossing_latency_rdclk_max, label: "lat.max"}
  - {metric: wr_stall_cycles,         label: "wrstall"}

scored_point_status: >
  THE EXISTING HEADLINE SURVIVES UNCHANGED. Reference 20101 um2 at 2.625 ns and
  candidate 14685 um2 at 4.5 ns were both built at DATA_W=32, LOG_DEPTH=3,
  SYNC_STAGES=2 -- the shim defaults, which the ORFS config does not override
  and which are now the pinned scored configuration. Ratio 1.369 and "candidate
  26.9 % smaller" stand as measured; nothing needs rebuilding or relabelling.

