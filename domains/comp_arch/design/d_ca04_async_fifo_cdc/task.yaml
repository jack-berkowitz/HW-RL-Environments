illegal_configs: >
  DATA_W outside {8,32,64}, LOG_DEPTH outside 2..4, SYNC_STAGES outside {2,3}.
  The checker aborts with "TEST_RESULT: FAIL: illegal ...".

sim_timeout_s: 600
simulator_pinning:
  reference_build: verilator-5.046-only
  reason: >
    The vendored anchor uses a `type` parameter and (* async *) attributes on
    port connections; Icarus 13.0 rejects both. This is a property of the
    ANCHOR, not the harness.
  checker_is_dual_simulator: true
  evidence: >
    The checker builds and reaches TEST_RESULT: PASS under Icarus 13.0 when
    given a plain-SystemVerilog DUT (the second source). Submissions can
    therefore be graded under either simulator.

second_source: true
second_source_file: tb/async_fifo_cdc_alt_ref.sv
second_source_note: >
  Classic dual-pointer async FIFO; single module rather than upstream's
  _src/_dst split, real dual-port memory instead of an exposed async_data array.
  All 18 configs pass. Found no over-constraint.

mutants:
  - {id: m01, class: cdc-encoding,  kill: "C5 phantom beat"}
  - {id: m02, class: cdc-encoding,  kill: "C1/C3 data mismatch"}
  - {id: m03, class: boundary,      kill: "C1/C3 data mismatch"}
  - {id: m04, class: control-flow,  kill: "C5 phantom at beat 0"}
  - {id: m05, class: cdc-encoding,  kill: "C5 phantom beat"}
  - {id: m06, class: boundary,      kill: "C1/C3 data mismatch"}
  - {id: m07, class: reset,         kill: "C5 phantom at beat 0"}
mutant_withdrawn:
  id: m05_original
  what: forced SYNC_STAGES to 1
  why: >
    SURVIVED, correctly. Synchroniser depth changes no logical value in a
    zero-delay simulation, so the mutant is functionally equivalent under the
    semantics the checker can observe. Replaced with a Gray-decode bug.

known_limitation: >
  This checker verifies the FUNCTIONAL half of CDC correctness (Gray encode and
  decode, pointer boundaries, full/empty, reset, no loss or reorder at 7 clock
  ratios). It CANNOT verify the timing half -- synchroniser depth and whether a
  submission's crossings are constrained at all. That needs CDC static analysis
  or formal. Report it alongside any d_ca04 result.

