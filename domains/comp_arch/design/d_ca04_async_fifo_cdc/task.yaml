second_source_note: >
  Classic dual-pointer async FIFO; single module rather than upstream's
  _src/_dst split, real dual-port memory instead of an exposed async_data array.
  All 18 configs pass. Found no over-constraint.

# RULE 21 -- evidence of non-equivalence, recorded PER MUTANT.
#
# These previously carried `kill: "C5 phantom beat"`, which names the clause
# that catches the mutant but not the configuration, the stimulus, or the point
# of divergence. That is weaker than rule 21's bar and was recorded under a key
# the evidence check does not recognise.
#
# WHY THE BAR IS WHERE IT IS. The risk rule 21 guards is a mutant that turns out
# EQUIVALENT to the golden -- unkillable by anyone, and silently inflating the
# denominator of every kill rate computed from the set. That has happened on
# this task: `m05_original` forced SYNC_STAGES to 1, survived everything, and
# was correct to survive, because synchroniser depth changes no logical value in
# a zero-delay simulation. It was withdrawn (see mutant_withdrawn below).
#
# Each witness below was MEASURED, 2026-08-19, at the scored configuration
# DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, by binding the mutant in place of
# cdc_fifo_gray under the unmodified checker and recording its FIRST divergence.
mutants:
  - {id: m01, class: cdc-encoding, evidence: witness,
     kill: "C5 phantom beat",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase A-equal, t=7695000: C5 phantom beat 601 -- read side delivered data with only 601 writes accepted"}
  - {id: m02, class: cdc-encoding, evidence: witness,
     kill: "C1/C3 data mismatch",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase A-equal, t=665000: C1/C3 beat 33 rd_data=0x10000028 expected 0x10000020"}
  - {id: m03, class: boundary, evidence: witness,
     kill: "C1/C3 data mismatch",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase B-fast-wr-slow-rd, t=8079000: C1/C3 beat 5 rd_data=0x1000000c expected 0x10000004"}
  - {id: m04, class: control-flow, evidence: witness,
     kill: "C5 phantom at beat 0",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase A-equal, t=225000: C5 phantom beat 0 -- read side delivered data with 0 writes accepted"}
  - {id: m05, class: cdc-encoding, evidence: witness,
     kill: "C5 phantom beat",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase A-equal, t=7525000: C5 phantom beat 601 -- read side delivered data with only 601 writes accepted"}
  - {id: m06, class: boundary, evidence: witness,
     kill: "C1/C3 data mismatch",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase A-equal, t=265000: C1/C3 beat 0 rd_data=0x0 expected 0x10000000"}
  - {id: m07, class: reset, evidence: witness,
     kill: "C5 phantom at beat 0",
     witness: "DATA_W=32 LOG_DEPTH=3 SYNC_STAGES=2, phase A-equal, t=225000: C5 phantom beat 0 -- read side delivered data with 0 writes accepted"}
mutant_withdrawn:
  id: m05_original
  what: forced SYNC_STAGES to 1
  why: >
    SURVIVED, correctly. Synchroniser depth changes no logical value in a
    zero-delay simulation, so the mutant is functionally equivalent under the
    semantics the checker can observe. Replaced with a Gray-decode bug.

known_limitation: >
  This checker verifies the FUNCTIONAL half of CDC correctness (Gray encode and
  decode, pointer boundaries, full/empty, reset, no loss or reorder at 7 clock
  ratios). It CANNOT verify the timing half -- synchroniser depth and whether a
  submission's crossings are constrained at all. That needs CDC static analysis
  or formal. Report it alongside any d_ca04 result.

