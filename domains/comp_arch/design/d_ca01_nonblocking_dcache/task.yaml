second_source:
  status: PRESENT -- PASS, 16 of 16 configurations
  file: tb/nonblocking_dcache_alt_ref.sv
  differences_implemented: [D1, D2, D3_prime_prime]
  iterations_used: 10       # 3 budgeted; 4-10 run on direct instruction to
                            # iterate until it passed. Recorded, not hidden.
  adjudications:
    - {iter: 1, symptom: "fails C2", verdict: HARNESS_SETUP_DEFECT,
       detail: "C2 warm-up treated a response as proof the line was installed; a forwarding design answers mid-fill"}
    - {iter: 2, symptom: "fails C1, only 1 outstanding", verdict: HARNESS_SETUP_DEFECT,
       detail: "C1 stalled the memory before the previous phase's fill had drained, leaking a record"}
    - {iter: 3, symptom: "masked-store byte wrong", verdict: SECOND_SOURCE_IS_WRONG, open: false,
       closed_by: "iterations 4-10; see NOTES.md"}
    - {iter: 4, symptom: "miss accepted in the shadow of its own last fill beat",
       verdict: SECOND_SOURCE_IS_WRONG, causal: false, score: "2/16 -> 2/16"}
    - {iter: 6, symptom: "victim chosen from a way already in flight for this set",
       verdict: SECOND_SOURCE_IS_WRONG, causal: true, score: "2/16 -> 4/16"}
    - {iter: 8, symptom: "hit bypassed a pending access to the same word (R5 ordering)",
       verdict: SECOND_SOURCE_IS_WRONG, causal: true, score: "4/16 -> 8/16"}
    - {iter: 9, symptom: "p_m is a record index and records are reused; 37 forwards returned another line",
       verdict: SECOND_SOURCE_IS_WRONG, causal: false, score: "8/16 -> 8/16"}
    - {iter: 10, symptom: "memory engine served records in index order, so a fill overtook the writeback of the same block",
       verdict: SECOND_SOURCE_IS_WRONG, causal: true, score: "8/16 -> 16/16",
       detail: "failure partitioned exactly on MAX_MISSES: 8/8 pass at 2, 8/8 fail at 8, independent of DATA_W/SETS/WAYS"}
  no_check_was_loosened: >
    Iterations 4-10 changed the second source only. No check, no testbench, no
    anchor and no clause was touched, and the anchor was re-measured at 16/16
    through scripts/build_and_score.sh --sim-only after the final fix. Rule 5
    held for the whole repair: the anchor was correct on the stimulus, so the
    second source was wrong.
    Both harness fixes make a phase wait for the memory model to go idle before
    stalling -- establishing the phase's own precondition. Verified unchanged
    afterwards: reference 16/16, mCAP1 8/16 on C1, m05 0/16 on C2, m06 0/16,
    c01/c02 16/16.
  what_it_bought: >
    Two harness assumptions the anchor could never have exposed, because the
    anchor does not forward (measured flat at 13 cycles). A checker validated
    only against a non-forwarding design carried a latent precondition.
  r4_narrowing_regression_check: >
    Every artifact built before R4 was narrowed was re-run against the narrowed
    clause: reference 16/16, mCAP1 8/16, m01-m06 0/16, c01/c02 16/16. NO VERDICT
    CHANGED. A spec edit that silently flips something built earlier is the kind
    of thing that surfaces much later, so it was checked rather than assumed.
  differences_named: true          # tb/audit/SECOND_SOURCE_DIFFERENCES.md, committed before the shim
  D1: {claim: "merge against all outstanding lines", risk: highest, status: SURVIVES,
       note: "second source passes 16/16 carrying it"}
  D2: {claim: "true LRU vs tree-PLRU", status: SURVIVES, also_conformant: true,
       note: "second source passes 16/16 carrying it"}
  D3: {claim: "fetch first, write victim back after", status: REFUTED,
       reason: "measured -- the anchor already fetches first and writes back after"}
  D3_prime: {claim: "strictly in-order responses", status: unmeasured, also_conformant: true,
             note: "replacement for D3, named openly; the failed claim is kept"}
# (a stale `mutants: {status: NOT_STARTED, planned: "5-7 ..."}` stub stood here.
#  It was a second top-level `mutants:` key, so on parse it REPLACED the real
#  block above -- all seven mutants, their cex depths and the checker-hole
#  record read as NOT_STARTED to any tool. Deleted; the built block is at
#  `mutants:` above.)
conformant:
  status: BUILT            # 2 survive; the third turned out not to be conformant
  gated: true              # re-run with the slang gate live once conformant/* was exempted
  overlap_declared: >
    Replacement policy (L1) has NO wrapper and cannot have one -- replacement is
    internal to the anchor and a wrapper cannot reach it. L1 is exercised by the
    SECOND SOURCE's true-LRU choice instead.
  built:
    - name: c01_self_initializing
      licence_clause: P1
      survives: 16/16
      evidence: bmc_cex
      cex_depth: 34
      neutralise_control: >
        FAILED phase 1 on first build; neutralised it PASSED, so the wrapper was
        sound and the perturbation was at fault. The anchor answers the wrapper's
        own initialisation ops and R3 promises one response per ACCEPTED REQUEST,
        which an internal init op is not. Those responses are now swallowed.
        A wrapper defect, not a spec defect.
    - name: c02_ready_gated_on_valid
      licence_clause: L5
      survives: 16/16
      evidence: bmc_cex
      cex_depth: 34
  retired:
    - name: c03_responses_in_order
      licence_claimed: R4
      outcome: NOT CONFORMANT -- promoted to mutants/m06_responses_in_order.sv
      finding: >
        R4 said strictly in-order retirement was conformant; C2 requires a hit
        accepted after an outstanding miss to be ANSWERED. Under in-order
        retirement that hit is blocked behind the miss, so the two clauses could
        not both be satisfied. Neutralise control passed, so this was the
        perturbation and not the wrapper. R4 NARROWED: response order is free
        except that a ready response must not be held behind an unready one --
        a consequence of C2, not an independent requirement.
      consequence: >
        Second-source difference D3' is dead with it. D3'' (early fill
        forwarding) named in tb/audit/SECOND_SOURCE_DIFFERENCES.md, with both
        failures kept.
  l6_exercised_by: >
    The zero-latency control DUT built for the L6 fix runs with latency min=0
    against the reference's min=2, so L6's latitude is exercised in both
    directions already; no separate conformant wrapper is needed for it.

