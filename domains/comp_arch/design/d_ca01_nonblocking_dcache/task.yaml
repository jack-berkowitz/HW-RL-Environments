task_text_hash: cb910c9196c73809    # spec/ + probe/PASTE.md

version_boundary:
  changed_on: 2026-08-25
  pre_bump_task_text_hash:  aab70a4bfcf132e7
  post_bump_task_text_hash: f7a68c4dbec4a1b7
  intermediate_hash_no_candidate_saw: 51337b00b54b64c7
  one_boundary_not_two: >
    R1b landed first, at 51337b00b54b64c7, and the grouped-clause annotations
    landed on top of it BEFORE any candidate was solicited at the intermediate
    value. Recorded as ONE boundary because that is what a submission
    experiences; two would imply a solicitation that never happened. The
    intermediate hash is named rather than dropped so the chain has no gap. Same
    handling as d_ai01's interface_boundary.
  grouped_clause_annotations: >
    R5 and M2 now NAME THE ID THAT REPORTS THEM -- "REPORTED UNDER R3/R5" and
    "REPORTED UNDER M1/M2" -- per AGENT-VERIF-A2's convention.
    .
    THIS IS THE CHEAPEST CASE OF THAT CONVENTION AND THE REASON IS WORTH KEEPING:
    both groupings were ALREADY COMBINED IN THE TESTBENCH'S ID FIELD. The checks
    have always read "R3/R5: a LOAD returned the wrong value for its id" and
    "M1/M2: a memory transaction did not carry BLOCK_WORDS beats". So the spec
    edit DESCRIBES WHAT THE TESTBENCH ALREADY DOES rather than introducing a
    convention -- the fact was established and only the spec was silent.
    .
    Found by grepping check MESSAGE STRINGS for two clause ids, which is a
    different unit from the innermost begin/end block. On this corpus the block
    unit is noise: d_ca01's own phase-7 results block is ONE begin emitting SEVEN
    distinct ids as seven separate chk() calls. A block is a scoping accident; a
    message is one observation reporting one verdict.
  behavioural: false
  what_changed: >
    R1b ADDED. `rsp_valid_o` MUST NOT depend combinationally on `rsp_ready_i`.
    R1's stability sentence was satisfiable by NEVER OFFERING -- a response never
    presented to a stalled consumer cannot be withdrawn from one -- so a design
    could empty R1's antecedent instead of honouring its consequent, and no
    clause objected.
    .
    MEASURED, NOT ARGUED. controls/nc_r1_evades_antecedent.sv gates rsp_valid_o
    on rsp_ready_i, is otherwise the reference verbatim, and under the contract as
    it stood satisfied every clause while driving R1's firing count to zero at
    all sixteen configurations. Its only distinct failure is the condition floor.
    .
    The asymmetry with L5 is the reason R1b names L5 explicitly. L5 PERMITS the
    identical construction on the request side, and conformant/c02_ready_gated_on
    _valid.sv is that permitted design -- it passes 16/16, including with the
    condition floor live. One side of the same handshake had a clause and a
    control; the other had neither.
  prior_results_comparable: true
  why: >
    No behaviour required of a submission changes. R1b forbids a construction
    that no current submission uses -- all three pass R1 with a non-zero firing
    count -- so nothing is re-scored for correctness. The hash moves because the
    SHIPPED TEXT moves, and the hash is what asserts "same question".
  nothing_is_being_covered_up: >
    ZERO OF THE THREE current submissions exploits the gap, and the same is true
    of d_dsp02's three. This closes a live hole before anything walked through
    it; it does not correct a scored result. Re-solicitation is the cost of
    changing the question, not of hiding an answer.
  enforceability_caveat: >
    STATED PLAINLY BECAUSE IT IS A LIMIT, NOT A CAVEAT TO BURY. R1b forbids a
    COMBINATIONAL DEPENDENCY, which the testbench cannot observe directly -- it
    sees rsp_valid_o low and cannot distinguish "gated on ready" from "no
    response yet". The condition floor catches the construction, but reports it as
    "R1 was never exercised" rather than as an R1b violation. R1b is enforceable
    by inspection and by control, and only partially by the harness.

# RULE 18 -- PPA, latency and throughput are measured ONLY here.
scored_configuration:
  DATA_W: 32
  SETS: 16
  WAYS: 4
  MAX_MISSES: 8
  rationale: >
    Not the anchor's default -- the anchor has no defaults, every parameter is
    mandatory. MAX_MISSES=8 is the load-bearing choice: d_nw01 recorded that no
    capability check discriminates at MAX_TRANS=2 and that a pass there is not
    capability evidence, so choosing 2 here would knowingly repeat it. WAYS=4 is
    the ordinary L1 associativity and makes replacement non-degenerate, which it
    nearly is at 2. DATA_W=32 rather than 64 because 64 doubles the data array
    without exercising the allocation-and-scheduling axis this task measures,
    and pushes place-and-route toward the container memory ceiling that already
    killed one route here (F31). 16 sets x 4 ways x 4 words x 32 bits = 8 kbit
    of data array: a real cache, small enough to close.
  authority: stated task intent, recorded in spec clause S0

scored_metrics:
  # Reported, NOT gated. A slower correct design is not a failing design.
  # NAMES ARE THE EMITTED KEYS. Three of the four here previously named metrics
  # no checker produces -- hit_latency_cycles, fill_latency_cycles and
  # accept_rate_per_1k -- so those columns rendered ABSENT on every row and the
  # fourth, max_outstanding, resolved to a structured metric whose scalar lives
  # in max_outstanding_n. The task looked instrumented and reported nothing.
  #
  # role: choice     a free design decision the spec does not fix; it moves PPA,
  #                  so an area comparison against a design that chose
  #                  differently is not like-for-like
  # role: capability more is better; area buys it, so PPA should be read per
  #                  unit of it as well as raw
  # role: fixed      the spec requires the value in `expect`
  - {metric: latency_min,         label: "lat.min",  role: choice}
  - {metric: latency_max,         label: "lat.max"}   # worst case; stimulus-driven
  - {metric: max_outstanding_n,   label: "outstd",   role: capability}
  - {metric: mem_txns_fills,      label: "fills"}     # stimulus-driven
  # AXIS AUDIT, 2026-08-29 -- one added, one resolved as NOT an axis.
  #
  # mem_txns_writebacks is the observable of REPLACEMENT POLICY, which L1 makes
  # free and G4 lists first among the real choices. A better policy evicts fewer
  # dirty lines. LOWER-is-better, so role: choice -- a choice is not divided by
  # area and needs no inversion.
  - {metric: mem_txns_writebacks, label: "wb", role: choice}
  #
  # accept_rate: RESOLVED AS NOT AN INDEPENDENT AXIS and deliberately undeclared.
  # The request port is a single req_valid_i/req_ready_o handshake, so acceptance
  # is bounded by the interface at one per cycle; the rate a design achieves is
  # then a composite of miss parallelism (max_outstanding_n, declared capability)
  # and hit latency (latency_min, declared choice). Declaring it would count both
  # a third time rather than measure anything new.


