mutants:         {status: NOT_STARTED, planned: "5-7, each wrapping the anchor, incl. one CAPABILITY-class"}
conformant:
  status: NOT_STARTED
  overlap_declared: >
    D2 (true LRU) and D3' (in-order responses) are the SAME artifacts as two of
    the second source's differences, serving both purposes. They are not
    independent evidence.
  planned_distinct:
    - self-initializing design      # P1 says this is conformant; untested otherwise
    - req_ready_o gated on req_valid_i   # L5 licences it and nothing exercises it
