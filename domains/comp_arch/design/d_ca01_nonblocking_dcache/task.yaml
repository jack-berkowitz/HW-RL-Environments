mutants:
  status: BUILT

  # EVIDENCE OF NON-EQUIVALENCE, per mutant, recorded as a TYPE and never
  # implied by the kill rate. Two accepted values:
  #   witness  -- a named clause fails at a named configuration under a named
  #               stimulus. Non-equivalence demonstrated under that stimulus.
  #   bmc_cex  -- a bounded counterexample: a concrete input sequence on which
  #               the mutant and the reference differ from an IDENTICAL initial
  #               state. This is a proof of non-equivalence.
  #
  # WHAT THE DEPTH MEANS, stated so `bmc_cex depth 34` cannot be read as
  # "verified to 34": the number is the depth at which the COUNTEREXAMPLE WAS
  # FOUND. It says nothing about how far the miter has been shown sound. That is
  # a separate figure and it is recorded once, below, for the whole set.
  bmc_timeout_s: 900        # rule 21; lives in each .sby, not in a wrapper
  bmc_resource_profile:
    measured: "m03 @ depth 14: 99% CPU (single-threaded), 223 MB peak RSS, 15.75 s wall"
    consequence: >
      Single-threaded and modest, so BMC does not need serialising against ORFS
      builds; the cap is hygiene rather than a scheduling control.
  evidence_control:
    miter_control: reference vs itself, PASS at depth 14
    miter_control_depth34: >
      TIMEOUT at the attempted depth -- did not complete in 600 s. Recorded as a
      measured bound per rule 21, not as a pass and not as a failure. It does not
      invalidate the depth-34 counterexamples, which are self-certifying.
    control_limit: >
      The control is established to depth 14 only; proving absence of a
      counterexample at depth 34 did not finish in ten minutes. A counterexample
      is self-certifying, so the depth-34 results do not depend on the control --
      but a MITER CONSTRUCTION defect first manifesting after cycle 14 is not
      ruled out. Closing that gap means replaying each counterexample in
      simulation and is not done.
    why_the_control_matters: >
      Without `setundef -zero -undriven -init` the two copies start at
      independent free values and BMC reports the reference non-equivalent to
      ITSELF. The control read FAIL before that line and PASS after.
    harness: mutants/ec/   # miter.sv, one .sby per mutant, README.md

  set:
    - {name: mCAP1_outstanding_capped, clause: C1, class: CAPABILITY,
       evidence: bmc_cex, cex_depth: 34, configs_passed: 8, of: 16,
       note: "survives all eight MAX_MISSES=2 configs, dies at all eight MAX_MISSES=8 -- the low-setting blindness measured, not assumed"}
    - {name: m01_rsp_id_perturbed,   clause: R3, evidence: bmc_cex, cex_depth: 34, configs_passed: 0, of: 16}
    - {name: m02_store_mask_ignored, clause: R2, evidence: bmc_cex, cex_depth: 34, configs_passed: 0, of: 16}
    - {name: m03_fill_wrong_block,   clause: M1, evidence: bmc_cex, cex_depth: 14, configs_passed: 0, of: 16}
    - {name: m04_writeback_corrupted, clause: M2, evidence: bmc_cex, cex_depth: 14, configs_passed: 0, of: 16,
       note: "caught in simulation via the readback sweep"}
    # block form, not {flow}: a folded scalar cannot appear inside a flow
    # mapping, and these two entries carrying `>` made the whole file
    # unparseable. Values unchanged.
    - name: m05_blocking_on_miss
      clause: C2
      evidence: bmc_cex
      cex_depth: 14
      configs_passed: 0
      of: 16
      isolated: false
      overlap_resolved: >
        REAL SEMANTIC OVERLAP, not a mutant defect. A design that refuses
        requests during a memory transaction cannot hold more than one miss
        outstanding, so it fails C1 by construction as well as C2. The converse
        does not hold -- mCAP1 fails C1 and PASSES C2 -- so neither clause
        subsumes the other. The interface's C2 text now states the overlap.
        mCAP1 is what isolates C1.

    - name: m06_responses_in_order
      clause: C2
      evidence: bmc_cex
      cex_depth: 34
      configs_passed: 0
      of: 16
      isolated: true
      provenance: >
        Built as a CONFORMANT perturbation under R4's original text and promoted
        here when that text proved wrong. Fails C2 and nothing else, so it is
        the cleanly isolated C2 mutant that m05 is not.

  cut_from_the_set: []      # none; every mutant obtained bmc_cex evidence

  found_a_checker_hole: >
    m05 initially PASSED C2. The phase stalled the memory by withholding request
    acceptance, and m05's blocking keys off acceptance, so the blocking never
    engaged. The phase now withholds the fill DATA instead.

verified_simulators:
  verilator: "5.046 -- 16/16 configs on the skeleton with a minimal stub"
  icarus: NOT_CHECKED
frontend_gate:
  slang: "interface elaborates 0 errors; anchor closure needs -DYOSYS (see NOTES.md)"

watchdog:
  skeleton_cycles: 20000
  margin_note: >
    The longest thing the skeleton does is one fill -- acceptance, memory
    request, 4 beats, response -- under 40 cycles for any sane design, so the
    margin is roughly 500x. Sized to convert a hang into a verdict, not to
    measure speed. The step-3 testbench will need its own value and its own
    recorded margin.

